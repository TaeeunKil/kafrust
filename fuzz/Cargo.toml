[package]
name = "kafrust-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
kafrust-protocol = { path = "../crates/kafrust-protocol" }
libfuzzer-sys = "0.4"

# Keep the fuzz workspace buildable with the repository MSRV. Newer `cc`
# releases pull a `jobserver` release that requires Edition 2024.
[build-dependencies]
cc = "=1.0.83"
jobserver = "=0.1.25"

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

