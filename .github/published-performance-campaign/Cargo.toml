[package]
name = "kafrust-published-performance-campaign"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
kafrust = { version = "__KAFRUST_VERSION__", features = __KAFRUST_FEATURES__ }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
