name: Published DescribeCluster Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.3"
      kafka_version:
        description: Kafka version to qualify
        required: true
        type: choice
        default: 4.3.1
        options:
          - "3.7.2"
          - "4.3.1"

permissions:
  contents: read

jobs:
  published-describe-cluster:
    name: Published kafrust ${{ inputs.kafrust_version }} Kafka ${{ inputs.kafka_version }} DescribeCluster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:39200
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker network create kafrust-published-describe-cluster
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-published-describe-cluster-broker \
            --network kafrust-published-describe-cluster \
            -p 39200:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-describe-cluster-broker:29092,EXTERNAL://localhost:39200 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-describe-cluster-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-describe-cluster-broker \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-describe-cluster-broker:29092 \
              >/tmp/kafrust-published-describe-cluster-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-describe-cluster-probe.log || true
          docker logs kafrust-published-describe-cluster-broker
          exit 1

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-describe-cluster"
          cargo new --bin "$project_dir"
          cp .github/published-describe-cluster/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-describe-cluster/Cargo.toml > "$project_dir/Cargo.toml"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published smoke project must be outside the repository"
            exit 1
          fi

      - name: Run published DescribeCluster smoke
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-describe-cluster"
          cargo run --manifest-path "$project_dir/Cargo.toml" 2>&1 \
            | tee /tmp/kafrust-published-describe-cluster.log
          grep -Fq "api60 cluster_id_present=true" \
            /tmp/kafrust-published-describe-cluster.log
          grep -Fq "metadata controller_id=" \
            /tmp/kafrust-published-describe-cluster.log

      - name: Verify published dependency versions
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          lockfile="$RUNNER_TEMP/kafrust-published-describe-cluster/Cargo.lock"
          grep -A1 -q 'name = "kafrust"' "$lockfile"
          grep -A1 -q "version = \"$KAFRUST_PUBLISHED_VERSION\"" "$lockfile"
          grep -A1 -q 'name = "kafrust-protocol"' "$lockfile"
          printf '{"kafrust_version":"%s","kafka_version":"%s","api60":true,"metadata_baseline":true}\n' \
            "$KAFRUST_PUBLISHED_VERSION" "${{ inputs.kafka_version }}" > \
            "$RUNNER_TEMP/published-describe-cluster.json"

      - name: Upload published DescribeCluster result
        uses: actions/upload-artifact@v4
        with:
          name: kafrust-published-describe-cluster-${{ github.run_id }}
          path: ${{ runner.temp }}/published-describe-cluster.json

      - name: Dump diagnostics
        if: failure()
        run: |
          cat /tmp/kafrust-published-describe-cluster.log || true
          docker logs kafrust-published-describe-cluster-broker || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kafrust-published-describe-cluster-broker || true
          docker network rm kafrust-published-describe-cluster || true
