name: Live Kafka Streams Group Failover

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 2"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:19192,localhost:19193,localhost:19194
  KAFRUST_STREAMS_TOPIC: kafrust-streams-failover-${{ github.run_id }}
  KAFRUST_STREAMS_FAILOVER_GROUP_ID: kafrust-streams-failover-${{ github.run_id }}
  KAFRUST_FAILOVER_PAUSE_MS: "30000"

jobs:
  streams-group-failover:
    name: Kafka 4.3.1 Streams coordinator failover
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 4.3.1
        run: |
          docker network create kafrust-streams-failover
          KAFKA_CLUSTER_ID="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19191 + node))
            docker run -d --name "kafrust-streams-failover-${node}" \
              --network kafrust-streams-failover \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${KAFKA_CLUSTER_ID}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-streams-failover-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-streams-failover-1:9093,2@kafrust-streams-failover-2:9093,3@kafrust-streams-failover-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,streams \
              -e KAFKA_GROUP_STREAMS_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-streams-failover-1 \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-streams-failover-1:29092 \
              >/tmp/kafrust-streams-failover-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-streams-failover-probe.log || true
          docker logs kafrust-streams-failover-1
          docker logs kafrust-streams-failover-2
          docker logs kafrust-streams-failover-3
          exit 1

      - name: Create Streams source topic
        run: |
          docker exec kafrust-streams-failover-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-streams-failover-1:29092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_STREAMS_TOPIC" \
            --partitions 3 \
            --replication-factor 3

      - name: Build Streams failover example
        run: cargo build -p kafrust --example streams_group_failover

      - name: Run Streams coordinator failover
        run: |
          cargo run -p kafrust --example streams_group_failover \
            >/tmp/kafrust-streams-failover.log 2>&1 &
          streams_pid=$!

          coordinator_node=""
          before_seen=""
          for attempt in {1..120}; do
            coordinator_node="$(sed -n 's/.*coordinator node \([0-9][0-9]*\)$/\1/p' /tmp/kafrust-streams-failover.log | tail -n 1)"
            if grep -q "streams group failover before heartbeat" /tmp/kafrust-streams-failover.log; then
              before_seen=1
            fi
            if [ -n "$coordinator_node" ] && [ -n "$before_seen" ]; then
              break
            fi
            if ! kill -0 "$streams_pid" 2>/dev/null; then
              cat /tmp/kafrust-streams-failover.log || true
              wait "$streams_pid"
            fi
            sleep 1
          done

          if ! [[ "$coordinator_node" =~ ^[123]$ ]] || [ -z "$before_seen" ]; then
            echo "Streams failover example did not reach its first heartbeat"
            cat /tmp/kafrust-streams-failover.log || true
            kill "$streams_pid" 2>/dev/null || true
            wait "$streams_pid" || true
            exit 1
          fi

          coordinator_container="kafrust-streams-failover-${coordinator_node}"
          docker stop "$coordinator_container"

          streams_status=0
          wait "$streams_pid" || streams_status=$?
          cat /tmp/kafrust-streams-failover.log

          docker start "$coordinator_container"
          coordinator_ready=""
          for attempt in {1..120}; do
            if docker exec "$coordinator_container" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "${coordinator_container}:29092" \
              >/tmp/kafrust-streams-coordinator-recovery.log 2>&1; then
              coordinator_ready=1
              break
            fi
            sleep 2
          done

          if [ "$streams_status" -ne 0 ] || [ -z "$coordinator_ready" ]; then
            cat /tmp/kafrust-streams-coordinator-recovery.log || true
            docker logs "$coordinator_container"
            exit 1
          fi

      - name: Dump Kafka logs
        if: failure()
        run: |
          docker logs kafrust-streams-failover-1 || true
          docker logs kafrust-streams-failover-2 || true
          docker logs kafrust-streams-failover-3 || true
