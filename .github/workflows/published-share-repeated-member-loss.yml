name: Published ShareConsumer Repeated Member Loss

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to run from crates.io"
        required: true
        default: "0.3.6"
      run_seconds:
        description: "Seconds each surviving published member remains active"
        required: true
        default: "120"
      cycles:
        description: "Independent member-loss/rejoin cycles (qualification requires 100)"
        required: true
        default: "8"
  schedule:
    - cron: "47 6 * * 2"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.81.0"
  KAFRUST_BOOTSTRAP_SERVERS: localhost:23092,localhost:23093,localhost:23094
  KAFRUST_SHARE_TOPIC: kafrust-published-share-repeated-loss-${{ github.run_id }}
  KAFRUST_SHARE_GROUP_ID: kafrust-published-share-repeated-loss-group-${{ github.run_id }}
  KAFRUST_SHARE_VALUE_PREFIX: published-share-repeated-loss-
  KAFRUST_SHARE_MEMBER_RUN_SECONDS: ${{ inputs.run_seconds || '120' }}
  KAFRUST_SHARE_MEMBER_LOSS_CYCLES: ${{ inputs.cycles || '8' }}
  KAFRUST_SHARE_RECORDS_PER_PARTITION: "1"

jobs:
  published-share-repeated-member-loss:
    name: Published kafrust ShareConsumer repeated member-loss churn
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 4.3.1 with share groups enabled
        run: |
          docker network create kafrust-published-share-repeated-loss
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((23091 + node))
            docker run -d --name "kafrust-published-share-repeated-loss-${node}" \
              --network kafrust-published-share-repeated-loss \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-share-repeated-loss-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-share-repeated-loss-1:9093,2@kafrust-published-share-repeated-loss-2:9093,3@kafrust-published-share-repeated-loss-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=2 \
              -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
              -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-share-repeated-loss-1 \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-share-repeated-loss-1:29092 \
              >/tmp/kafrust-published-share-repeated-loss-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-share-repeated-loss-probe.log || true
          docker logs kafrust-published-share-repeated-loss-1
          docker logs kafrust-published-share-repeated-loss-2
          docker logs kafrust-published-share-repeated-loss-3
          exit 1

      - name: Create replicated share topic
        run: |
          docker exec kafrust-published-share-repeated-loss-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-share-repeated-loss-1:29092 \
            --create --if-not-exists --topic "$KAFRUST_SHARE_TOPIC" \
            --partitions 6 --replication-factor 3
          docker exec kafrust-published-share-repeated-loss-1 /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-published-share-repeated-loss-1:29092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest

      - name: Create fresh external published project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.6' }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-repeated-loss"
          cargo new --bin "$project_dir"
          cp .github/published-share-multi-member/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-share-multi-member/Cargo.toml > "$project_dir/Cargo.toml"
          cargo build --release --manifest-path "$project_dir/Cargo.toml"

      - name: Run repeated member-loss cycles
        run: |
          set -euo pipefail
          [[ "$KAFRUST_SHARE_MEMBER_LOSS_CYCLES" =~ ^[1-9][0-9]*$ ]] || {
            echo "cycles must be a positive integer"
            exit 1
          }
          if [ "$KAFRUST_SHARE_MEMBER_LOSS_CYCLES" -gt 100 ]; then
            echo "cycles cannot exceed the V1-21 qualification bound"
            exit 1
          fi
          project_dir="$RUNNER_TEMP/kafrust-published-share-repeated-loss"
          ready_base="$RUNNER_TEMP/kafrust-published-share-repeated-loss-ready"
          heartbeat_ready_base="$RUNNER_TEMP/kafrust-published-share-repeated-loss-heartbeat-ready"
          start_file="$RUNNER_TEMP/kafrust-published-share-repeated-loss-start"
          output_base="$RUNNER_TEMP/kafrust-published-share-repeated-loss-output"
          log_base="$RUNNER_TEMP/kafrust-published-share-repeated-loss-log"
          rm -f "$ready_base"-* "$heartbeat_ready_base"-* "$start_file"-* "$output_base"-* "$log_base"-*

          start_member() {
            member="$1"
            ready_file="$2"
            heartbeat_ready_file="$3"
            member_start_file="$4"
            output_file="$5"
            log_file="$6"
            KAFRUST_OPERATION=member \
              KAFRUST_SHARE_MEMBER_ID="share-member-${member}" \
              KAFRUST_SHARE_MEMBER_READY_FILE="$ready_file" \
              KAFRUST_SHARE_MEMBER_HEARTBEAT_READY_FILE="$heartbeat_ready_file" \
              KAFRUST_SHARE_MEMBER_START_FILE="$member_start_file" \
              KAFRUST_SHARE_MEMBER_OUTPUT_FILE="$output_file" \
              cargo run --quiet --release \
              --manifest-path "$project_dir/Cargo.toml" \
              > "$log_file" 2>&1 &
            STARTED_PID=$!
          }

          wait_for_marker() {
            marker="$1"
            for attempt in {1..180}; do
              if [ -f "$marker" ]; then
                return 0
              fi
              sleep 1
            done
            echo "timed out waiting for $marker"
            return 1
          }

          wait_for_lines() {
            output_file="$1"
            expected_lines="$2"
            for attempt in {1..240}; do
              if [ -f "$output_file" ] && [ "$(wc -l < "$output_file")" -ge "$expected_lines" ]; then
                return 0
              fi
              sleep 1
            done
            echo "timed out waiting for $expected_lines lines in $output_file"
            return 1
          }

          start_member 1 "$ready_base-1-initial" "$heartbeat_ready_base-1-initial" "$start_file-initial" "$output_base-1" "$log_base-1-initial"
          member_one_pid=$STARTED_PID
          start_member 2 "$ready_base-2-initial" "$heartbeat_ready_base-2-initial" "$start_file-initial" "$output_base-2" "$log_base-2-initial"
          member_two_pid=$STARTED_PID
          wait_for_marker "$ready_base-1-initial"
          wait_for_marker "$ready_base-2-initial"
          touch "$start_file-initial"
          wait_for_marker "$heartbeat_ready_base-1-initial"
          wait_for_marker "$heartbeat_ready_base-2-initial"

          kill -9 "$member_two_pid" 2>/dev/null || true
          set +e
          wait "$member_two_pid"
          member_two_status=$?
          set -e
          test "$member_two_status" -ne 0

          KAFRUST_OPERATION=seed cargo run --quiet --release \
            --manifest-path "$project_dir/Cargo.toml"
          wait_for_lines "$output_base-1" 6

          active_member=1
          active_pid=$member_one_pid
          member_one_lines=6
          member_two_lines=0
          for loss in $(seq 2 "$KAFRUST_SHARE_MEMBER_LOSS_CYCLES"); do
            if [ "$active_member" -eq 1 ]; then
              next_member=2
            else
              next_member=1
            fi
            ready_file="$ready_base-${next_member}-cycle-${loss}"
            heartbeat_ready_file="$heartbeat_ready_base-${next_member}-cycle-${loss}"
            member_start_file="$start_file-cycle-${loss}"
            output_file="$output_base-${next_member}"
            log_file="$log_base-${next_member}-cycle-${loss}"
            start_member "$next_member" "$ready_file" "$heartbeat_ready_file" "$member_start_file" "$output_file" "$log_file"
            next_pid=$STARTED_PID
            wait_for_marker "$ready_file"
            touch "$member_start_file"
            wait_for_marker "$heartbeat_ready_file"

            kill -9 "$active_pid" 2>/dev/null || true
            set +e
            wait "$active_pid"
            active_status=$?
            set -e
            test "$active_status" -ne 0

            KAFRUST_OPERATION=seed cargo run --quiet --release \
              --manifest-path "$project_dir/Cargo.toml"
            if [ "$next_member" -eq 1 ]; then
              member_one_lines=$((member_one_lines + 6))
              expected_lines=$member_one_lines
            else
              member_two_lines=$((member_two_lines + 6))
              expected_lines=$member_two_lines
            fi
            wait_for_lines "$output_file" "$expected_lines"
            active_member=$next_member
            active_pid=$next_pid
          done

          set +e
          wait "$active_pid"
          final_status=$?
          set -e
          for log_file in "$log_base"-*; do
            [ -f "$log_file" ] && cat "$log_file"
          done
          exit "$final_status"

      - name: Verify repeated ownership recovery
        run: |
          set -euo pipefail
          output_base="$RUNNER_TEMP/kafrust-published-share-repeated-loss-output"
          cat "$output_base-1" "$output_base-2" | sort -t, -k2,2n -k3,3n > "$RUNNER_TEMP/repeated-share-member-observed"
          cycles="$KAFRUST_SHARE_MEMBER_LOSS_CYCLES"
          expected_total=$((6 * cycles))
          test "$(wc -l < "$RUNNER_TEMP/repeated-share-member-observed")" -eq "$expected_total"
          member_one_cycles=$(( (cycles + 1) / 2 ))
          member_two_cycles=$(( cycles / 2 ))
          test "$(wc -l < "$output_base-1")" -eq "$((6 * member_one_cycles))"
          test "$(wc -l < "$output_base-2")" -eq "$((6 * member_two_cycles))"
          test "$(cut -d, -f2 "$RUNNER_TEMP/repeated-share-member-observed" | sort -n | uniq | paste -sd, -)" = "0,1,2,3,4,5"
          for partition in $(seq 0 5); do
            test "$(cut -d, -f2 "$RUNNER_TEMP/repeated-share-member-observed" | grep -cx "$partition")" -eq "$cycles"
          done
          test "$(cut -d, -f2,3 "$RUNNER_TEMP/repeated-share-member-observed" | sort | uniq | wc -l)" -eq "$expected_total"
          if [ "$((cycles % 2))" -eq 0 ]; then
            last_member=2
          else
            last_member=1
          fi
          grep -Eq "member=share-member-${last_member} assignment=6 accepted=6 consumed=6 in_flight=0 buffered=0 failed=[0-9]+ retries=[0-9]+ max_in_flight=[0-9]+ max_buffered=[0-9]+" \
            "$RUNNER_TEMP/kafrust-published-share-repeated-loss-log-${last_member}-cycle-${cycles}"
          jq -n \
            --arg campaign_id "published-share-member-loss-${GITHUB_RUN_ID}" \
            --arg artifact_version "${{ inputs.kafrust_version || '0.3.6' }}" \
            --argjson cycles "$cycles" \
            --argjson total_records "$expected_total" \
            '{schema_version: 1, qualified: ($cycles == 100), campaign_id: $campaign_id,
              artifact_version: $artifact_version, cycles: $cycles, partitions: 6,
              observed_records: $total_records, loss_count: 0, duplicate_count: 0,
              final_resource_gauges: {in_flight: 0, buffered: 0},
              qualification_reason: (if $cycles == 100 then "100-cycle published Share member-loss/rejoin gate" else "bounded diagnostic; 100-cycle gate not reached" end)}' \
            > published-share-member-loss-campaign.json

      - name: Upload repeated ownership evidence
        uses: actions/upload-artifact@v6
        with:
          name: kafrust-published-share-member-loss-${{ github.run_id }}
          path: |
            published-share-member-loss-campaign.json
            ${{ runner.temp }}/repeated-share-member-observed
            ${{ runner.temp }}/kafrust-published-share-repeated-loss-log-*
          if-no-files-found: error
          retention-days: 90

      - name: Verify published dependency versions
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.6' }}
        run: |
          lockfile="$RUNNER_TEMP/kafrust-published-share-repeated-loss/Cargo.lock"
          grep -A1 -q 'name = "kafrust"' "$lockfile"
          grep -A1 -q "version = \"$KAFRUST_PUBLISHED_VERSION\"" "$lockfile"
          grep -A1 -q 'name = "kafrust-protocol"' "$lockfile"

      - name: Dump diagnostics
        if: failure()
        run: |
          for log_file in "$RUNNER_TEMP/kafrust-published-share-repeated-loss-log"-*; do
            [ -f "$log_file" ] && cat "$log_file"
          done
          docker logs kafrust-published-share-repeated-loss-1 || true
          docker logs kafrust-published-share-repeated-loss-2 || true
          docker logs kafrust-published-share-repeated-loss-3 || true
