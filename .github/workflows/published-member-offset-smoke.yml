name: Published Member Offset Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.1"

permissions:
  contents: read

jobs:
  published-member-offset:
    name: Published kafrust ${{ inputs.kafrust_version }} member-aware offsets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:39096
      KAFRUST_GROUP_ID: kafrust-published-member-offset-${{ github.run_id }}
      KAFRUST_TOPIC: kafrust-published-member-offset-topic-${{ github.run_id }}
      KAFRUST_PARTITION: "0"
      KAFRUST_ADMIN_OFFSET: "42"
      RUST_LOG: kafrust=debug
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1
        run: |
          docker network create kafrust-published-member-offset
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-published-member-offset-broker \
            --network kafrust-published-member-offset \
            -p 39096:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-member-offset-broker:29092,EXTERNAL://localhost:39096 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-member-offset-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.3.1

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-member-offset-broker \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-member-offset-broker:29092 \
              >/tmp/kafrust-published-member-offset-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-member-offset-probe.log || true
          docker logs kafrust-published-member-offset-broker
          exit 1

      - name: Create topic
        run: |
          docker exec kafrust-published-member-offset-broker /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-member-offset-broker:29092 \
            --create \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-member-offset"
          cargo new --bin "$project_dir"
          cp .github/published-member-offset-smoke/src/main.rs "$project_dir/src/main.rs"
          cp crates/kafrust/examples/common/mod.rs "$project_dir/src/common.rs"
          sed \
            -e "s|__KAFRUST_VERSION__|${KAFRUST_PUBLISHED_VERSION}|" \
            -e 's|__KAFRUST_FEATURES__|[]|' \
            .github/published-member-offset-smoke/Cargo.toml > "$project_dir/Cargo.toml"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published smoke project must be outside the repository"
            exit 1
          fi

      - name: Run published member-aware OffsetFetch and OffsetCommit v10
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-member-offset"
          cargo run --manifest-path "$project_dir/Cargo.toml" 2>&1 \
            | tee /tmp/kafrust-published-member-offset.log
          grep -Fq "member-aware after" /tmp/kafrust-published-member-offset.log
          grep -Fq "api_version=10" /tmp/kafrust-published-member-offset.log
          grep -A1 -q 'name = "kafrust"' "$project_dir/Cargo.lock"
          grep -A1 -q 'version = "${{ inputs.kafrust_version }}"' "$project_dir/Cargo.lock"

      - name: Verify committed offset through Kafka CLI
        run: |
          for attempt in {1..30}; do
            if docker exec kafrust-published-member-offset-broker /opt/kafka/bin/kafka-consumer-groups.sh \
              --bootstrap-server kafrust-published-member-offset-broker:29092 \
              --group "$KAFRUST_GROUP_ID" \
              --describe \
              > /tmp/kafrust-published-member-offset-after.log 2>&1; then
              if grep -Eq "[[:space:]]$KAFRUST_TOPIC[[:space:]]+0[[:space:]]+42[[:space:]]" \
                /tmp/kafrust-published-member-offset-after.log; then
                cat /tmp/kafrust-published-member-offset-after.log
                exit 0
              fi
            fi
            sleep 1
          done
          cat /tmp/kafrust-published-member-offset-after.log || true
          exit 1

      - name: Dump diagnostics
        if: failure()
        run: |
          cat /tmp/kafrust-published-member-offset.log || true
          docker logs kafrust-published-member-offset-broker || true
