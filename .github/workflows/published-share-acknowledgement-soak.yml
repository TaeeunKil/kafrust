name: Published ShareConsumer Acknowledgement Soak

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to run from crates.io"
        required: true
        default: "0.3.3"
      cycles:
        description: "Unique records to acknowledge and commit"
        required: true
        default: "64"
  schedule:
    - cron: "47 4 * * 2"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.81.0"
  KAFRUST_BOOTSTRAP_SERVERS: localhost:9092
  KAFRUST_SHARE_TOPIC: kafrust-published-share-ack-soak-${{ github.run_id }}
  KAFRUST_SHARE_GROUP_ID: kafrust-published-share-ack-soak-group-${{ github.run_id }}
  KAFRUST_SHARE_LONG_CYCLES: ${{ inputs.cycles || '64' }}
  KAFRUST_SHARE_LONG_PREFIX: kafrust-published-share-ack-soak-${{ github.run_id }}-

jobs:
  acknowledgement-soak:
    name: Published kafrust ShareConsumer acknowledgement soak
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1 with share groups enabled
        run: |
          docker run -d --name kafrust-published-share-ack-kafka \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1 \
            -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
            -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.3.1

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-published-share-ack-kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 >/tmp/kafrust-published-share-ack-probe.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-published-share-ack-probe.log || true
          docker logs kafrust-published-share-ack-kafka
          exit 1

      - name: Create and seed share topic
        run: |
          set -euo pipefail
          docker exec kafrust-published-share-ack-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic "$KAFRUST_SHARE_TOPIC" \
            --partitions 1 --replication-factor 1
          docker exec kafrust-published-share-ack-kafka /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server localhost:9092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest
          for index in $(seq 1 "$KAFRUST_SHARE_LONG_CYCLES"); do
            printf '%s%s\n' "$KAFRUST_SHARE_LONG_PREFIX" "$index"
          done | docker exec -i kafrust-published-share-ack-kafka \
            /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 --topic "$KAFRUST_SHARE_TOPIC"

      - name: Create fresh external published project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.3' }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-acknowledgement-soak"
          cargo new --bin "$project_dir"
          cp .github/published-share-acknowledgement-soak/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-share-acknowledgement-soak/Cargo.toml > "$project_dir/Cargo.toml"

      - name: Build and run published ShareConsumer soak
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-acknowledgement-soak"
          cargo run --release --manifest-path "$project_dir/Cargo.toml"

      - name: Verify published dependency versions
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.3' }}
        run: |
          lockfile="$RUNNER_TEMP/kafrust-published-share-acknowledgement-soak/Cargo.lock"
          grep -A1 -q 'name = "kafrust"' "$lockfile"
          grep -A1 -q "version = \"$KAFRUST_PUBLISHED_VERSION\"" "$lockfile"
          grep -A1 -q 'name = "kafrust-protocol"' "$lockfile"

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-published-share-ack-kafka || true
