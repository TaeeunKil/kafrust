name: Live DescribeQuorum Compatibility

on:
  workflow_dispatch:
    inputs:
      kafka_version:
        description: Kafka version to qualify
        required: true
        type: choice
        default: 4.3.1
        options:
          - "3.7.2"
          - "4.3.1"

permissions:
  contents: read

jobs:
  describe-quorum:
    name: Kafka ${{ inputs.kafka_version }} DescribeQuorum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:39092
      KAFRUST_CONTROLLER_BOOTSTRAP_SERVERS: 127.0.0.1:39093

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker network create kafrust-describe-quorum
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-describe-quorum-broker \
            --network kafrust-describe-quorum \
            -p 39092:9092 \
            -p 39093:9093 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-describe-quorum-broker:29092,EXTERNAL://127.0.0.1:39092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-describe-quorum-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-describe-quorum-broker \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-describe-quorum-broker:29092 \
              >/tmp/kafrust-describe-quorum-ready.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-describe-quorum-ready.log || true
          docker logs kafrust-describe-quorum-broker
          exit 1

      - name: Verify Kafka controller quorum CLI
        run: |
          docker exec kafrust-describe-quorum-broker \
            /opt/kafka/bin/kafka-metadata-quorum.sh \
            --bootstrap-server kafrust-describe-quorum-broker:29092 \
            describe --status

      - name: Run current-source DescribeQuorum example
        run: cargo run -p kafrust --example admin_describe_quorum

      - name: Dump diagnostics
        if: failure()
        run: docker logs kafrust-describe-quorum-broker || true
