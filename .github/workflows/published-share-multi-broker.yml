name: Published ShareConsumer Multi-Broker Failover

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to run from crates.io"
        required: true
        default: "0.3.3"
  schedule:
    - cron: "17 5 * * 2"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.81.0"
  KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
  KAFRUST_SHARE_TOPIC: kafrust-published-share-multi-${{ github.run_id }}
  KAFRUST_SHARE_GROUP_ID: kafrust-published-share-multi-group-${{ github.run_id }}
  KAFRUST_SHARE_PARTITION: "0"

jobs:
  published-share-multi-broker:
    name: Published kafrust ShareConsumer multi-broker failover
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 4.3.1 with share groups enabled
        run: |
          docker network create kafrust-published-share-multi
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-published-share-multi-${node}" \
              --network kafrust-published-share-multi \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-share-multi-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-share-multi-1:9093,2@kafrust-published-share-multi-2:9093,3@kafrust-published-share-multi-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=2 \
              -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
              -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-share-multi-1 \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-share-multi-1:29092 \
              >/tmp/kafrust-published-share-multi-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-share-multi-probe.log || true
          docker logs kafrust-published-share-multi-1
          docker logs kafrust-published-share-multi-2
          docker logs kafrust-published-share-multi-3
          exit 1

      - name: Create replicated share topic and choose broker 1 leader
        run: |
          docker exec kafrust-published-share-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-share-multi-1:29092 \
            --create --if-not-exists --topic "$KAFRUST_SHARE_TOPIC" \
            --partitions 6 --replication-factor 3
          docker exec kafrust-published-share-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-share-multi-1:29092 --describe \
            --topic "$KAFRUST_SHARE_TOPIC" | tee /tmp/kafrust-published-share-multi-topic.log
          failover_partition="$(awk '/Partition:/ && /Leader: 1/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-published-share-multi-topic.log)"
          if [ -z "$failover_partition" ]; then
            cat /tmp/kafrust-published-share-multi-topic.log
            echo "could not find a partition led by broker 1"
            exit 1
          fi
          echo "KAFRUST_SHARE_PARTITION=${failover_partition}" >> "$GITHUB_ENV"

      - name: Configure share group offset reset
        run: |
          docker exec kafrust-published-share-multi-1 /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-published-share-multi-1:29092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest

      - name: Create fresh external published project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.3' }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-multi-broker"
          cargo new --bin "$project_dir"
          cp .github/published-share-multi-broker/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-share-multi-broker/Cargo.toml > "$project_dir/Cargo.toml"
          cargo build --release --manifest-path "$project_dir/Cargo.toml"

      - name: Produce pre-failover record through published producer
        env:
          KAFRUST_OPERATION: produce
          KAFRUST_SHARE_VALUE: published-share-multi-pre-${{ github.run_id }}
        run: |
          cargo run --quiet --release \
            --manifest-path "$RUNNER_TEMP/kafrust-published-share-multi-broker/Cargo.toml"

      - name: Consume pre-failover record through published ShareConsumer
        env:
          KAFRUST_OPERATION: consume
          KAFRUST_SHARE_PHASE: pre
          KAFRUST_SHARE_VALUE: published-share-multi-pre-${{ github.run_id }}
        run: |
          cargo run --quiet --release \
            --manifest-path "$RUNNER_TEMP/kafrust-published-share-multi-broker/Cargo.toml"

      - name: Stop broker 1 and wait for replacement leader
        run: |
          docker stop kafrust-published-share-multi-1
          for attempt in {1..60}; do
            line="$(docker exec kafrust-published-share-multi-2 \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafrust-published-share-multi-2:29092 --describe \
              --topic "$KAFRUST_SHARE_TOPIC" | \
              awk -v partition="$KAFRUST_SHARE_PARTITION" '$0 ~ /Partition:/ { p=""; l=""; for (i = 1; i <= NF; i++) { if ($i == "Partition:") p=$(i + 1); if ($i == "Leader:") l=$(i + 1) } if (p == partition) print l }')"
            if [ -n "$line" ] && [ "$line" != "1" ] && [ "$line" != "-1" ]; then
              echo "partition $KAFRUST_SHARE_PARTITION moved to leader $line"
              exit 0
            fi
            sleep 2
          done
          docker exec kafrust-published-share-multi-2 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-share-multi-2:29092 --describe \
            --topic "$KAFRUST_SHARE_TOPIC"
          exit 1

      - name: Produce post-failover record through surviving published producer
        env:
          KAFRUST_BOOTSTRAP_SERVERS: localhost:19093,localhost:19094
          KAFRUST_OPERATION: produce
          KAFRUST_SHARE_VALUE: published-share-multi-post-${{ github.run_id }}
        run: |
          cargo run --quiet --release \
            --manifest-path "$RUNNER_TEMP/kafrust-published-share-multi-broker/Cargo.toml"

      - name: Consume post-failover record through surviving published ShareConsumer
        env:
          KAFRUST_BOOTSTRAP_SERVERS: localhost:19093,localhost:19094
          KAFRUST_OPERATION: consume
          KAFRUST_SHARE_PHASE: post
          KAFRUST_SHARE_VALUE: published-share-multi-post-${{ github.run_id }}
        run: |
          cargo run --quiet --release \
            --manifest-path "$RUNNER_TEMP/kafrust-published-share-multi-broker/Cargo.toml"

      - name: Verify published dependency versions
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.3' }}
        run: |
          lockfile="$RUNNER_TEMP/kafrust-published-share-multi-broker/Cargo.lock"
          grep -A1 -q 'name = "kafrust"' "$lockfile"
          grep -A1 -q "version = \"$KAFRUST_PUBLISHED_VERSION\"" "$lockfile"
          grep -A1 -q 'name = "kafrust-protocol"' "$lockfile"

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-published-share-multi-1 || true
          docker logs kafrust-published-share-multi-2 || true
          docker logs kafrust-published-share-multi-3 || true
