name: Published Transaction Failover Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.2"

env:
  CARGO_TERM_COLOR: always

jobs:
  published-transaction-failover:
    name: Published kafrust ${{ inputs.kafrust_version }} transaction coordinator failover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:21092,localhost:21093,localhost:21094
      KAFRUST_TOPIC: kafrust-published-transaction-${{ github.run_id }}
      KAFRUST_TRANSACTIONAL_ID: kafrust-published-transaction-id-${{ github.run_id }}
      KAFRUST_FAILOVER_PAUSE_MS: "10000"
      KAFRUST_MAX_RETRIES: "300"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 3.7.2
        run: |
          docker network create kafrust-published-transaction
          cluster_id="$(docker run --rm apache/kafka:3.7.2 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((21091 + node))
            docker run -d --name "kafrust-published-transaction-${node}" \
              --network kafrust-published-transaction \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-transaction-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-transaction-1:9093,2@kafrust-published-transaction-2:9093,3@kafrust-published-transaction-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:3.7.2
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-transaction-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-transaction-1:29092 \
              >/tmp/kafrust-published-transaction-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-transaction-probe.log || true
          docker logs kafrust-published-transaction-1
          docker logs kafrust-published-transaction-2
          docker logs kafrust-published-transaction-3
          exit 1

      - name: Create replicated transaction topic
        run: |
          docker exec kafrust-published-transaction-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-transaction-1:29092 \
            --create --if-not-exists --topic "$KAFRUST_TOPIC" --partitions 1 --replication-factor 3

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-transaction-smoke"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published transaction project must be outside the repository"
            exit 1
          fi
          cargo new --bin "$project_dir"
          cp .github/published-transaction-failover-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/; s/__KAFRUST_FEATURES__/[]/" \
            .github/published-transaction-failover-smoke/Cargo.toml > "$project_dir/Cargo.toml"

      - name: Run transaction through coordinator stop
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-transaction-smoke"
          log_file="$RUNNER_TEMP/kafrust-published-transaction.log"
          cargo run --manifest-path "$project_dir/Cargo.toml" >"$log_file" 2>&1 &
          transaction_pid=$!
          coordinator_node=""
          for attempt in {1..120}; do
            if grep -q 'transaction coordinator node ' "$log_file"; then
              coordinator_node="$(sed -n 's/.*transaction coordinator node \([0-9][0-9]*\)$/\1/p' "$log_file" | tail -n 1)"
              break
            fi
            if ! kill -0 "$transaction_pid" 2>/dev/null; then
              cat "$log_file"
              wait "$transaction_pid"
            fi
            sleep 1
          done
          if [ -z "$coordinator_node" ]; then
            cat "$log_file"
            echo "transaction coordinator was not reported"
            kill "$transaction_pid" 2>/dev/null || true
            wait "$transaction_pid" || true
            exit 1
          fi
          echo "stopping transaction coordinator broker $coordinator_node"
          docker stop "kafrust-published-transaction-${coordinator_node}"
          wait "$transaction_pid"
          cat "$log_file"

      - name: Verify published dependency versions
        run: |
          grep -A1 -q 'name = "kafrust"' "$RUNNER_TEMP/kafrust-published-transaction-smoke/Cargo.lock"
          grep -A1 -q "version = \"${{ inputs.kafrust_version }}\"" "$RUNNER_TEMP/kafrust-published-transaction-smoke/Cargo.lock"

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-published-transaction-1 || true
          docker logs kafrust-published-transaction-2 || true
          docker logs kafrust-published-transaction-3 || true
