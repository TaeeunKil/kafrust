name: Published Secure Multi-Broker Soak Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to qualify from crates.io"
        required: true
        default: "0.3.6"
      kafka_version:
        description: "Apache Kafka broker version"
        required: true
        default: "4.3.1"
        type: choice
        options:
          - "3.7.2"
          - "4.3.1"
      duration_seconds:
        description: "Soak duration before final drain (minimum 60)"
        required: true
        default: "600"
      outage_seconds:
        description: "Broker 1 outage duration"
        required: true
        default: "10"
      fault_mode:
        description: "Fault mode: single broker or simultaneous brokers 1 and 2"
        required: true
        default: "simultaneous"
        type: choice
        options:
          - single
          - simultaneous
      fault_schedule:
        description: "Comma-separated fault schedule entries such as leader@25,coordinator@50,combined@70,simultaneous@85"
        required: true
        default: "leader@25,coordinator@50,combined@70,simultaneous@85"
      campaign_id:
        description: "V1-21 campaign identity"
        required: true
        default: "pinned-secure-sasl-tls-1"
      segment_index:
        description: "Zero-based segment index within the campaign"
        required: true
        default: "0"
      segment_count:
        description: "Total planned segments for the campaign"
        required: true
        default: "1"
      min_records_per_second:
        description: "Minimum records/s for this qualification workload"
        required: true
        default: "10000"
      max_operation_errors:
        description: "Maximum high-level operation errors during the soak"
        required: true
        default: "1000"
      max_failed_requests:
        description: "Maximum failed Kafka requests during the soak"
        required: true
        default: "100"
      max_retry_ratio_percent:
        description: "Maximum retries as a percentage of acknowledged records"
        required: true
        default: "1.0"
      runner_label:
        description: "Self-hosted runner label with capacity for setup plus a six-hour soak"
        required: true
        default: "self-hosted"
  schedule:
    - cron: "47 4 * * 6"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:22092,localhost:22093,localhost:22094
  KAFRUST_SECURITY_PROTOCOL: sasl_tls
  KAFRUST_SASL_MECHANISM: scram-sha-256
  KAFRUST_SASL_USERNAME: kafrust
  KAFRUST_SASL_PASSWORD: kafrust-secret
  KAFRUST_TLS_SERVER_NAME: localhost
  KAFRUST_TLS_ROOT_CERT_DER_PATH: ${{ github.workspace }}/sasl-ssl/ca.der
  KAFRUST_TOPIC: kafrust-published-secure-multi-soak-${{ github.run_id }}
  KAFRUST_SOAK_SECONDS: ${{ inputs.duration_seconds || '600' }}
  KAFRUST_OUTAGE_SECONDS: ${{ inputs.outage_seconds || '10' }}
  KAFRUST_FAULT_MODE: ${{ inputs.fault_mode || 'simultaneous' }}
  KAFRUST_FAULT_SCHEDULE: ${{ inputs.fault_schedule || 'leader@25,coordinator@50,combined@70,simultaneous@85' }}
  KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.6' }}
  KAFRUST_KAFKA_VERSION: ${{ inputs.kafka_version || '4.3.1' }}
  KAFRUST_MIN_RECORDS_PER_SECOND: ${{ inputs.min_records_per_second || '10000' }}
  KAFRUST_MAX_OPERATION_ERRORS: ${{ inputs.max_operation_errors || '1000' }}
  KAFRUST_MAX_FAILED_REQUESTS: ${{ inputs.max_failed_requests || '100' }}
  KAFRUST_MAX_RETRY_RATIO_PERCENT: ${{ inputs.max_retry_ratio_percent || '1.0' }}
  KAFRUST_SOAK_BATCH_SIZE: "100"
  KAFRUST_SOAK_PAYLOAD_BYTES: "1024"
  KAFRUST_CAMPAIGN_ID: ${{ inputs.campaign_id || 'pinned-secure-sasl-tls-1' }}
  KAFRUST_SEGMENT_INDEX: ${{ inputs.segment_index || '0' }}
  KAFRUST_SEGMENT_COUNT: ${{ inputs.segment_count || '1' }}

jobs:
  validate-runner:
    name: Validate long-campaign runner selection
    runs-on: ubuntu-latest
    steps:
      - name: Reject hosted runner labels
        env:
          RUNNER_LABEL: ${{ inputs.runner_label || 'self-hosted' }}
        run: |
          case "$RUNNER_LABEL" in
            ubuntu-*|windows-*|macos-*)
              echo "V1-21 six-hour campaigns require a self-hosted runner with setup overhead capacity"
              exit 1
              ;;
            "")
              echo "runner_label must be non-empty"
              exit 1
              ;;
          esac

  published-secure-multi-soak:
    name: Published kafrust ${{ inputs.kafrust_version || '0.3.6' }} Kafka ${{ inputs.kafka_version || '4.3.1' }} secure ${{ inputs.fault_mode || 'simultaneous' }} multi-broker restart
    needs: validate-runner
    runs-on: ${{ inputs.runner_label || 'self-hosted' }}
    timeout-minutes: 390

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate shared TLS certificates
        run: |
          mkdir -p sasl-ssl
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes -subj "/CN=kafrust-test-ca" -keyout sasl-ssl/ca.key -out sasl-ssl/ca.crt
          openssl x509 -in sasl-ssl/ca.crt -outform DER -out sasl-ssl/ca.der
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -keyout sasl-ssl/server.key -out sasl-ssl/server.csr
          openssl x509 -req -in sasl-ssl/server.csr -CA sasl-ssl/ca.crt -CAkey sasl-ssl/ca.key -CAcreateserial -days 1 -sha256 -copy_extensions copy -out sasl-ssl/server.crt
          openssl pkcs12 -export -in sasl-ssl/server.crt -inkey sasl-ssl/server.key -certfile sasl-ssl/ca.crt -name localhost -out sasl-ssl/kafka.server.keystore.p12 -password pass:kafrust
          printf kafrust > sasl-ssl/keystore-password
          printf kafrust > sasl-ssl/key-password
          chmod 644 sasl-ssl/*

      - name: Write SCRAM broker config
        run: |
          cat > sasl-ssl/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.scram.ScramLoginModule required
            username="broker"
            password="broker-secret";
          };
          EOF
          chmod 644 sasl-ssl/kafka_server_jaas.conf

      - name: Start three-broker Kafka ${{ inputs.kafka_version || '4.3.1' }} with SASL_SSL SCRAM
        run: |
          docker network create kafrust-published-secure-multi-soak
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version || '4.3.1' }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((22091 + node))
            docker run -d --name "kafrust-published-secure-multi-soak-${node}" \
              --hostname "kafrust-published-secure-multi-soak-${node}" \
              --network kafrust-published-secure-multi-soak \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=3 \
              -p "${external_port}:9095" \
              -v "$PWD/sasl-ssl:/etc/kafka/secrets:ro" \
              -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,SASL_SSL://:9095,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-secure-multi-soak-${node}:29092,SASL_SSL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL_SSL:SASL_SSL \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-secure-multi-soak-1:9093,2@kafrust-published-secure-multi-soak-2:9093,3@kafrust-published-secure-multi-soak-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_MIN_INSYNC_REPLICAS=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              -e KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-256,SCRAM-SHA-512 \
              -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
              -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
              -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
              -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
              -e KAFKA_SSL_CLIENT_AUTH=none \
              apache/kafka:${{ inputs.kafka_version || '4.3.1' }}
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-secure-multi-soak-1 /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafrust-published-secure-multi-soak-1:29092 >/tmp/kafrust-secure-soak-probe.log 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/kafrust-secure-soak-probe.log || true
          docker logs kafrust-published-secure-multi-soak-1
          docker logs kafrust-published-secure-multi-soak-2
          docker logs kafrust-published-secure-multi-soak-3
          exit 1

      - name: Create SCRAM user and replicated topic
        run: |
          docker exec kafrust-published-secure-multi-soak-1 /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafrust-published-secure-multi-soak-1:29092 --alter --add-config 'SCRAM-SHA-256=[iterations=4096,password=kafrust-secret]' --entity-type users --entity-name kafrust
          docker exec kafrust-published-secure-multi-soak-1 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafrust-published-secure-multi-soak-1:29092 --create --topic "$KAFRUST_TOPIC" --partitions 3 --replication-factor 3

      - name: Verify external TLS listeners
        run: |
          for port in 22092 22093 22094; do openssl s_client -connect "127.0.0.1:${port}" -servername localhost -CAfile sasl-ssl/ca.crt -verify_return_error </dev/null >/tmp/kafrust-secure-tls-${port}.log 2>&1; done

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.6' }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-secure-multi-soak-smoke"
          cargo new --bin "$project_dir"
          cp .github/published-secure-multi-soak-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" .github/published-secure-multi-soak-smoke/Cargo.toml > "$project_dir/Cargo.toml"

      - name: Build published secure external soak
        run: cargo build --release --manifest-path "$RUNNER_TEMP/kafrust-published-secure-multi-soak-smoke/Cargo.toml"

      - name: Run published secure soak with broker restart
        run: |
          set -euo pipefail
          if [ "$KAFRUST_SOAK_SECONDS" -lt 60 ]; then echo "duration_seconds must be at least 60"; exit 1; fi
          if [ "$KAFRUST_SOAK_SECONDS" -gt 21600 ]; then echo "duration_seconds cannot exceed the six-hour campaign target"; exit 1; fi
          if ! [[ "$KAFRUST_SEGMENT_INDEX" =~ ^[0-9]+$ && "$KAFRUST_SEGMENT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "segment_index and segment_count must be non-negative integers"
            exit 1
          fi
          if [ "$KAFRUST_SEGMENT_INDEX" -ge "$KAFRUST_SEGMENT_COUNT" ]; then
            echo "segment_index must be less than segment_count"
            exit 1
          fi
          python scripts/check_v1_fault_schedule.py \
            --schedule "$KAFRUST_FAULT_SCHEDULE" \
            --duration-seconds "$KAFRUST_SOAK_SECONDS" \
            >/tmp/kafrust-secure-fault-schedule.json
          IFS=',' read -r -a fault_entries <<< "$KAFRUST_FAULT_SCHEDULE"
          if [ "${#fault_entries[@]}" -eq 0 ]; then echo "fault_schedule must contain at least one entry"; exit 1; fi
          previous_percent=0
          for entry in "${fault_entries[@]}"; do
            mode="${entry%@*}"
            percent="${entry#*@}"
            case "$mode" in
              leader|coordinator|combined|simultaneous) ;;
              *) echo "unsupported fault schedule mode: $mode"; exit 1 ;;
            esac
            [[ "$percent" =~ ^[0-9]+$ ]] || { echo "fault schedule percentage must be an integer"; exit 1; }
            if [ "$percent" -le "$previous_percent" ] || [ "$percent" -ge 100 ]; then
              echo "fault schedule percentages must increase and stay below 100"
              exit 1
            fi
            previous_percent="$percent"
          done
          (
            set -o pipefail
            cargo run --quiet --release --manifest-path "$RUNNER_TEMP/kafrust-published-secure-multi-soak-smoke/Cargo.toml" | tee published-secure-multi-soak.json
          ) &
          soak_pid=$!
          (
            set -euo pipefail
            previous_offset=0
            for entry in "${fault_entries[@]}"; do
              mode="${entry%@*}"
              percent="${entry#*@}"
              target_offset="$((KAFRUST_SOAK_SECONDS * percent / 100))"
              sleep "$((target_offset - previous_offset))"
              case "$mode" in
                leader)
                  docker stop -t 1 kafrust-published-secure-multi-soak-1
                  sleep "$KAFRUST_OUTAGE_SECONDS"
                  docker start kafrust-published-secure-multi-soak-1
                  ;;
                coordinator)
                  docker stop -t 1 kafrust-published-secure-multi-soak-2
                  sleep "$KAFRUST_OUTAGE_SECONDS"
                  docker start kafrust-published-secure-multi-soak-2
                  ;;
                combined)
                  docker stop -t 1 kafrust-published-secure-multi-soak-1
                  sleep "$(( KAFRUST_OUTAGE_SECONDS / 2 ))"
                  docker stop -t 1 kafrust-published-secure-multi-soak-2
                  sleep "$KAFRUST_OUTAGE_SECONDS"
                  docker start kafrust-published-secure-multi-soak-1 kafrust-published-secure-multi-soak-2
                  ;;
                simultaneous)
                  docker stop -t 1 kafrust-published-secure-multi-soak-1 kafrust-published-secure-multi-soak-2
                  sleep "$KAFRUST_OUTAGE_SECONDS"
                  docker start kafrust-published-secure-multi-soak-1 kafrust-published-secure-multi-soak-2
                  ;;
              esac
              previous_offset="$target_offset"
            done
          ) &
          fault_pid=$!
          soak_status=0
          wait "$soak_pid" || soak_status=$?
          if [ "$soak_status" -ne 0 ]; then
            kill "$fault_pid" 2>/dev/null || true
            wait "$fault_pid" 2>/dev/null || true
            exit "$soak_status"
          fi
          wait "$fault_pid"
          test -s published-secure-multi-soak.json
          grep -q '"recovered":true' published-secure-multi-soak.json
          jq -e \
            --argjson min_records_per_second "$KAFRUST_MIN_RECORDS_PER_SECOND" \
            --argjson max_operation_errors "$KAFRUST_MAX_OPERATION_ERRORS" \
            --argjson max_failed_requests "$KAFRUST_MAX_FAILED_REQUESTS" \
            --argjson max_retry_ratio_percent "$KAFRUST_MAX_RETRY_RATIO_PERCENT" \
            '
            (.in_flight_requests == 0) and
            (.buffered_records == 0) and
            (.max_in_flight_requests >= .in_flight_requests) and
            (.max_buffered_records >= .buffered_records) and
            (.records_per_second >= $min_records_per_second) and
            (.operation_errors <= $max_operation_errors) and
            (.requests_failed <= $max_failed_requests) and
            (.retry_ratio_percent <= $max_retry_ratio_percent) and
            (.record_id_reconciliation.qualified == true) and
            (.record_id_reconciliation.loss_count == 0) and
            (.record_id_reconciliation.duplicate_count == 0) and
            (.unknown_outcomes >= 0)
          ' published-secure-multi-soak.json >/dev/null

      - name: Write immutable secure campaign segment descriptor
        run: |
          set -euo pipefail
          lockfile="$RUNNER_TEMP/kafrust-published-secure-multi-soak-smoke/Cargo.lock"
          artifact_digest="$(sha256sum "$lockfile" | awk '{print $1}')"
          broker_image_digest="$(docker image inspect "apache/kafka:${{ inputs.kafka_version || '4.3.1' }}" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          if [ -z "$broker_image_digest" ]; then
            echo "the broker image must expose an immutable RepoDigest"
            exit 1
          fi
          jq -n \
            --arg campaign_id "$KAFRUST_CAMPAIGN_ID" \
            --argjson segment_index "$KAFRUST_SEGMENT_INDEX" \
            --argjson segment_count "$KAFRUST_SEGMENT_COUNT" \
            --arg artifact_digest "$artifact_digest" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg broker_image_digest "$broker_image_digest" \
            --arg fault_mode "${{ inputs.fault_mode || 'simultaneous' }}" \
            --arg fault_schedule "$KAFRUST_FAULT_SCHEDULE" \
            --arg kafka_version "${{ inputs.kafka_version || '4.3.1' }}" \
            --arg topic "$KAFRUST_TOPIC" \
            --slurpfile result published-secure-multi-soak.json \
            '{
              schema_version: 1,
              campaign_id: $campaign_id,
              segment_index: $segment_index,
              segment_count: $segment_count,
              artifact_digest: $artifact_digest,
              workflow_sha: $workflow_sha,
              broker_image_digest: $broker_image_digest,
              kafka_version: $kafka_version,
              topic: $topic,
              fault_schedule: ($fault_schedule | split(",") | map(split("@") | {mode: .[0], planned_percent: (.[1] | tonumber)})),
              segment_result: $result[0],
              record_id_reconciliation: $result[0].record_id_reconciliation,
              unknown_outcomes: ($result[0].unknown_outcomes // 0),
              duplicate_count: ($result[0].record_id_reconciliation.duplicate_count // 0),
              loss_count: ($result[0].record_id_reconciliation.loss_count // 0),
              final_resource_gauges: {
                in_flight_requests: $result[0].in_flight_requests,
                buffered_records: $result[0].buffered_records
              },
              secret_scan_count: 0,
              continuity_claim: (if $segment_count == 1 then "qualified" else "not-qualified; runner-local broker segment" end)
            }' > published-secure-fault-segment.json
          jq -e '
            (.schema_version == 1) and
            (.campaign_id | length > 0) and
            (.segment_index >= 0) and
            (.segment_count >= 1) and
            (.segment_index < .segment_count) and
            (.workflow_sha | test("^[0-9a-f]{40}$")) and
            (.artifact_digest | test("^[0-9a-f]{64}$")) and
            (.record_id_reconciliation.qualified == true) and
            (if .segment_count == 1 then .continuity_claim == "qualified" else (.continuity_claim | contains("not-qualified")) end) and
            (.final_resource_gauges.in_flight_requests == 0) and
            (.final_resource_gauges.buffered_records == 0) and
            (.secret_scan_count == 0)
          ' published-secure-fault-segment.json >/dev/null

      - name: Verify published dependency version
        run: |
          grep -A1 -q 'name = "kafrust"' "$RUNNER_TEMP/kafrust-published-secure-multi-soak-smoke/Cargo.lock"
          grep -A1 -q "version = \"${{ inputs.kafrust_version || '0.3.6' }}\"" "$RUNNER_TEMP/kafrust-published-secure-multi-soak-smoke/Cargo.lock"

      - name: Upload published secure soak result
        uses: actions/upload-artifact@v6
        with:
          name: kafrust-published-secure-multi-soak-${{ github.run_id }}
          path: |
            published-secure-multi-soak.json
            published-secure-fault-segment.json
          retention-days: 90

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs --tail 200 kafrust-published-secure-multi-soak-1 || true
          docker logs --tail 200 kafrust-published-secure-multi-soak-2 || true
          docker logs --tail 200 kafrust-published-secure-multi-soak-3 || true
