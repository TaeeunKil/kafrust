name: Live Kafka Share Multi-Broker Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "7 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
  KAFRUST_TOPIC: kafrust-share-multi-${{ github.run_id }}
  KAFRUST_SHARE_TOPIC: kafrust-share-multi-${{ github.run_id }}
  KAFRUST_SHARE_GROUP_ID: kafrust-share-multi-group-${{ github.run_id }}
  KAFRUST_SHARE_PARTITION: "0"
  KAFRUST_SHARE_VALUE: share-multi-post-${{ github.run_id }}

jobs:
  share-consumer-multi-broker:
    name: Kafka 4.3.1 ShareConsumer multi-broker failover
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 4.3.1 with share groups enabled
        run: |
          docker network create kafrust-share-multi
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-share-multi-${node}" \
              --network kafrust-share-multi \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-share-multi-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-share-multi-1:9093,2@kafrust-share-multi-2:9093,3@kafrust-share-multi-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=2 \
              -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
              -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-share-multi-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-share-multi-1:29092 >/tmp/kafrust-share-multi-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-share-multi-probe.log || true
          docker logs kafrust-share-multi-1
          docker logs kafrust-share-multi-2
          docker logs kafrust-share-multi-3
          exit 1

      - name: Create replicated share topic and choose broker 1 leader
        run: |
          docker exec kafrust-share-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-share-multi-1:29092 \
            --create --if-not-exists --topic "$KAFRUST_SHARE_TOPIC" \
            --partitions 6 --replication-factor 3
          docker exec kafrust-share-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-share-multi-1:29092 --describe \
            --topic "$KAFRUST_SHARE_TOPIC" | tee /tmp/kafrust-share-multi-topic.log
          failover_partition="$(awk '/Partition:/ && /Leader: 1/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-share-multi-topic.log)"
          if [ -z "$failover_partition" ]; then
            cat /tmp/kafrust-share-multi-topic.log
            echo "could not find a partition led by broker 1"
            exit 1
          fi
          echo "KAFRUST_SHARE_PARTITION=${failover_partition}" >> "$GITHUB_ENV"

      - name: Configure share group offset reset
        run: |
          docker exec kafrust-share-multi-1 /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-share-multi-1:29092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest

      - name: Produce pre-failover record to broker 1 leader
        env:
          KAFRUST_VALUE: share-multi-pre-${{ github.run_id }}
        run: |
          KAFRUST_PARTITION="$KAFRUST_SHARE_PARTITION" \
            cargo run -p kafrust --example producer_send

      - name: Run ShareConsumer pre-failover phase
        env:
          KAFRUST_SHARE_PHASE: pre
          KAFRUST_SHARE_VALUE: share-multi-pre-${{ github.run_id }}
        run: cargo test -p kafrust --test broker_roundtrip share_consumer_multi_broker_failover_when_broker_is_configured -- --nocapture

      - name: Stop broker 1 and wait for replacement leader
        run: |
          docker stop kafrust-share-multi-1
          for attempt in {1..60}; do
            line="$(docker exec kafrust-share-multi-2 /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafrust-share-multi-2:29092 --describe \
              --topic "$KAFRUST_SHARE_TOPIC" | \
              awk -v partition="$KAFRUST_SHARE_PARTITION" '$0 ~ /Partition:/ { p=""; l=""; for (i = 1; i <= NF; i++) { if ($i == "Partition:") p=$(i + 1); if ($i == "Leader:") l=$(i + 1) } if (p == partition) print l }')"
            if [ -n "$line" ] && [ "$line" != "1" ] && [ "$line" != "-1" ]; then
              echo "partition $KAFRUST_SHARE_PARTITION moved to leader $line"
              exit 0
            fi
            sleep 2
          done
          docker exec kafrust-share-multi-2 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-share-multi-2:29092 --describe \
            --topic "$KAFRUST_SHARE_TOPIC"
          exit 1

      - name: Produce post-failover record on surviving brokers
        env:
          KAFRUST_BOOTSTRAP_SERVERS: localhost:19093,localhost:19094
          KAFRUST_VALUE: share-multi-post-${{ github.run_id }}
        run: |
          KAFRUST_PARTITION="$KAFRUST_SHARE_PARTITION" \
            cargo run -p kafrust --example producer_send

      - name: Run ShareConsumer post-failover phase
        env:
          KAFRUST_SHARE_PHASE: post
        run: cargo test -p kafrust --test broker_roundtrip share_consumer_multi_broker_failover_when_broker_is_configured -- --nocapture

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-share-multi-1 || true
          docker logs kafrust-share-multi-2 || true
          docker logs kafrust-share-multi-3 || true
