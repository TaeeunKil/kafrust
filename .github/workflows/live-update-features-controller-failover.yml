name: Live UpdateFeatures Controller Failover

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 4"

permissions:
  contents: read

jobs:
  controller-failover:
    name: Kafka ${{ matrix.kafka-version }} UpdateFeatures controller failover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - "3.7.2"
          - "4.3.1"
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
      KAFRUST_EXPECT_UPDATE_FEATURES_VERSION: "1"
      KAFRUST_UPDATE_FEATURES_FEATURE: metadata.version
      KAFRUST_UPDATE_FEATURES_EXPECT_ERROR: "0"
      KAFRUST_UPDATE_FEATURES_VALIDATE_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker KRaft cluster
        run: |
          docker network create kafrust-update-features-failover
          kafka_image="apache/kafka:${KAFKA_VERSION}"
          cluster_id="$(docker run --rm "$kafka_image" /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-update-features-${node}" \
              --network kafrust-update-features-failover \
              -p "${external_port}:9092" \
              -p "$((29091 + node)):9093" \
              -e KAFKA_CLUSTER_ID="$cluster_id" \
              -e KAFKA_NODE_ID="$node" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-update-features-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-update-features-1:9093,2@kafrust-update-features-2:9093,3@kafrust-update-features-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              "$kafka_image"
          done

      - name: Wait for cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-update-features-2 \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-update-features-2:29092 \
              >/tmp/kafrust-update-features-failover-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-update-features-failover-probe.log || true
          docker logs kafrust-update-features-1
          docker logs kafrust-update-features-2
          docker logs kafrust-update-features-3
          exit 1

      - name: Stop active controller and wait for failover
        run: |
          for attempt in {1..30}; do
            quorum_output="$(docker exec kafrust-update-features-2 \
              /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller kafrust-update-features-2:9093 \
              describe --status 2>/tmp/kafrust-update-features-quorum.log || true)"
            leader_id="$(printf '%s\n' "$quorum_output" | \
              sed -n 's/^[[:space:]]*LeaderId:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [ "$leader_id" = 1 -o "$leader_id" = 2 -o "$leader_id" = 3 ]; then
              break
            fi
            sleep 2
          done
          printf '%s\n' "$quorum_output"
          test "$leader_id" = 1 -o "$leader_id" = 2 -o "$leader_id" = 3
          docker stop "kafrust-update-features-${leader_id}"

          if [ "$leader_id" = 2 ]; then
            probe_node=3
          else
            probe_node=2
          fi
          bootstrap_servers=""
          for node in 1 2 3; do
            if [ "$node" != "$leader_id" ]; then
              if [ -n "$bootstrap_servers" ]; then
                bootstrap_servers+=","
              fi
              bootstrap_servers+="localhost:$((19091 + node))"
            fi
          done
          echo "KAFRUST_FAILOVER_BOOTSTRAP_SERVERS=$bootstrap_servers" >> "$GITHUB_ENV"

          for attempt in {1..60}; do
            failover_output="$(docker exec "kafrust-update-features-${probe_node}" \
              /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller "kafrust-update-features-${probe_node}:9093" \
              describe --status 2>/tmp/kafrust-update-features-failover-quorum.log || true)"
            new_leader_id="$(printf '%s\n' "$failover_output" | \
              sed -n 's/^[[:space:]]*LeaderId:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [ -n "$new_leader_id" ] && [ "$new_leader_id" != "$leader_id" ]; then
              printf '%s\n' "$failover_output"
              echo "controller failover completed: $leader_id -> $new_leader_id"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-update-features-failover-quorum.log || true
          exit 1

      - name: Verify UpdateFeatures through surviving controller quorum
        run: |
          echo "bootstrap servers: $KAFRUST_FAILOVER_BOOTSTRAP_SERVERS"
          KAFRUST_BOOTSTRAP_SERVERS="$KAFRUST_FAILOVER_BOOTSTRAP_SERVERS" \
            cargo test -p kafrust --test broker_roundtrip \
            api_versions_and_metadata_roundtrip_when_broker_is_configured \
            -- --nocapture

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-update-features-1 || true
          docker logs kafrust-update-features-2 || true
          docker logs kafrust-update-features-3 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kafrust-update-features-1 kafrust-update-features-2 kafrust-update-features-3 || true
          docker network rm kafrust-update-features-failover || true
