name: Live Kafka Share Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:9092
  KAFRUST_SHARE_TOPIC: kafrust-share-smoke
  KAFRUST_SHARE_GROUP_ID: kafrust-share-smoke-${{ github.run_id }}
  KAFRUST_SHARE_TEST_EXPIRY: "1"

jobs:
  share-consumer:
    name: Kafka 4.3.1 ShareConsumer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1 with share groups enabled
        run: |
          docker run -d --name kafrust-share-kafka \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1 \
            -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
            -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.3.1

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-share-kafka
          exit 1

      - name: Create share smoke topic
        run: |
          docker exec kafrust-share-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_SHARE_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Produce share smoke record
        run: |
          docker exec kafrust-share-kafka /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server localhost:9092 \
            --alter \
            --entity-type groups \
            --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest

          printf 'share-smoke-%s\n' "$GITHUB_RUN_ID" | \
            docker exec -i kafrust-share-kafka /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server localhost:9092 \
              --topic "$KAFRUST_SHARE_TOPIC"

      - name: Run ShareConsumer and ShareGroupDescribe live roundtrip
        run: cargo test -p kafrust --test broker_roundtrip share_consumer_roundtrip_when_broker_is_configured -- --nocapture

      - name: Run ShareGroup offset mutation live roundtrip
        run: cargo test -p kafrust --test broker_roundtrip share_group_offset_mutations_when_broker_is_configured -- --nocapture

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-share-kafka
