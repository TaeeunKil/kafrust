name: Live Admin Mutation Ambiguity

on:
  workflow_dispatch:
    inputs:
      kafka_version:
        description: "Apache Kafka broker image version"
        required: true
        default: "3.7.2"
        type: choice
        options:
          - "3.7.2"
          - "4.3.1"
      mutation:
        description: "Admin mutation whose first response should be dropped"
        required: true
        default: "create_topics"
        type: choice
        options:
          - "create_topics"
          - "create_partitions"
          - "incremental_alter_configs"
          - "alter_configs"
          - "create_acls"
          - "delete_acls"
          - "alter_client_quotas"
          - "alter_user_scram_credentials"
          - "create_delegation_token"
          - "alter_consumer_group_offsets"
          - "delete_topics"

env:
  CARGO_TERM_COLOR: always

jobs:
  admin-ambiguity:
    name: Kafka ${{ inputs.kafka_version }} ${{ inputs.mutation }} response loss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:39095
      KAFRUST_ADMIN_TOPIC: kafrust-admin-ambiguity-${{ github.run_id }}
      KAFRUST_ADMIN_MUTATION: ${{ inputs.mutation }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start single-broker Kafka
        run: |
          docker network create kafrust-admin-ambiguity
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          authorizer_args=()
          listener_args=(
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          )
          case "${{ inputs.mutation }}" in
            create_acls|delete_acls|alter_user_scram_credentials)
              authorizer_args=(
                -e KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
                -e KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
                -e KAFKA_SUPER_USERS=User:ANONYMOUS
              )
              ;;
            create_delegation_token)
              authorizer_args=(
                -e KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
                -e KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
                -e 'KAFKA_SUPER_USERS=User:ANONYMOUS;User:admin'
                -e KAFKA_DELEGATION_TOKEN_SECRET_KEY=kafrust-ambiguity-delegation-secret
              )
              listener_args=(
                -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
                -e KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
                -e 'KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_admin="admin-secret";'
              )
              {
                echo KAFRUST_SECURITY_PROTOCOL=sasl_plaintext
                echo KAFRUST_SASL_MECHANISM=plain
                echo KAFRUST_SASL_USERNAME=admin
                echo KAFRUST_SASL_PASSWORD=admin-secret
              } >> "$GITHUB_ENV"
              ;;
          esac
          docker run -d --name kafrust-admin-ambiguity-broker \
            --network kafrust-admin-ambiguity \
            -p 29095:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-admin-ambiguity-broker:29092,EXTERNAL://127.0.0.1:39095 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            "${listener_args[@]}" \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-admin-ambiguity-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            "${authorizer_args[@]}" \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-admin-ambiguity-broker /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-admin-ambiguity-broker:29092 \
              >/tmp/kafrust-admin-ambiguity-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-admin-ambiguity-probe.log || true
          docker logs kafrust-admin-ambiguity-broker
          exit 1

      - name: Start response-drop proxy
        run: |
          rm -f /tmp/kafrust-admin-ambiguity-dropped
          case "${{ inputs.mutation }}" in
            create_topics) drop_api_key=19 ;;
            create_partitions) drop_api_key=37 ;;
            incremental_alter_configs) drop_api_key=44 ;;
            alter_configs) drop_api_key=33 ;;
            create_acls) drop_api_key=30 ;;
            delete_acls) drop_api_key=31 ;;
            alter_client_quotas) drop_api_key=49 ;;
            alter_user_scram_credentials) drop_api_key=51 ;;
            create_delegation_token) drop_api_key=38 ;;
            alter_consumer_group_offsets) drop_api_key=8 ;;
            delete_topics) drop_api_key=20 ;;
            *) echo "unsupported mutation: ${{ inputs.mutation }}"; exit 1 ;;
          esac
          python3 -u scripts/kafka_response_drop_proxy.py \
            --listen-port 39095 \
            --target-port 29095 \
            --drop-api-key "$drop_api_key" \
            --drop-marker /tmp/kafrust-admin-ambiguity-dropped \
            >/tmp/kafrust-admin-ambiguity-proxy.log 2>&1 &
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/39095) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-admin-ambiguity-proxy.log
          exit 1

      - name: Run current-source ambiguity and reconciliation example
        run: cargo run -p kafrust --example admin_mutation_ambiguity

      - name: Verify response was dropped
        run: test -f /tmp/kafrust-admin-ambiguity-dropped

      - name: Dump diagnostics
        if: failure()
        run: |
          cat /tmp/kafrust-admin-ambiguity-proxy.log || true
          docker logs kafrust-admin-ambiguity-broker || true
