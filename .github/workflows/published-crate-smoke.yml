name: Published Crate Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.2.27"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:9092

jobs:
  published-crate:
    name: Published kafrust ${{ inputs.kafrust_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker run -d --name kafrust-published-kafka \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.7.2

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-published-kafka
          exit 1

      - name: Create external smoke topic
        env:
          KAFRUST_TOPIC: kafrust-published-${{ github.run_id }}
        run: |
          docker exec kafrust-published-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-smoke"
          cargo new --bin "$project_dir"
          cp .github/published-crate-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/${KAFRUST_PUBLISHED_VERSION}/" \
            .github/published-crate-smoke/Cargo.toml > "$project_dir/Cargo.toml"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published smoke project must be outside the repository"
            exit 1
          fi
          test -f "$project_dir/Cargo.toml"
          test -f "$project_dir/src/main.rs"

      - name: Run published crate producer and consumer
        env:
          KAFRUST_TOPIC: kafrust-published-${{ github.run_id }}
          KAFRUST_VALUE: published-crate-${{ github.run_id }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-smoke"
          cargo run --manifest-path "$project_dir/Cargo.toml"
          grep -A1 -q 'name = "kafrust"' "$project_dir/Cargo.lock"
          grep -A1 -q "version = \"${{ inputs.kafrust_version }}\"" "$project_dir/Cargo.lock"

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-published-kafka
