name: Live Kafka Share Acknowledgement Ambiguity

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 5"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:39095
  KAFRUST_SHARE_AMBIGUITY_TOPIC: kafrust-share-ack-ambiguity-${{ github.run_id }}
  KAFRUST_SHARE_AMBIGUITY_GROUP_ID: kafrust-share-ack-ambiguity-group-${{ github.run_id }}
  KAFRUST_SHARE_AMBIGUITY_VALUE: share-ambiguity-${{ github.run_id }}

jobs:
  acknowledgement-ambiguity:
    name: Kafka 4.3.1 ShareConsumer response-loss reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1 with share groups enabled
        run: |
          docker run -d --name kafrust-share-ack-ambiguity \
            -p 29095:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:39095 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1 \
            -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
            -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.3.1

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-share-ack-ambiguity /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 >/tmp/kafrust-share-ack-ambiguity-probe.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-share-ack-ambiguity-probe.log || true
          docker logs kafrust-share-ack-ambiguity
          exit 1

      - name: Create and seed share topic
        run: |
          set -euo pipefail
          docker exec kafrust-share-ack-ambiguity /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic "$KAFRUST_SHARE_AMBIGUITY_TOPIC" \
            --partitions 1 --replication-factor 1
          docker exec kafrust-share-ack-ambiguity /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server localhost:9092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_AMBIGUITY_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest
          printf '%s\n' "$KAFRUST_SHARE_AMBIGUITY_VALUE" | \
            docker exec -i kafrust-share-ack-ambiguity /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server localhost:9092 --topic "$KAFRUST_SHARE_AMBIGUITY_TOPIC"

      - name: Start ShareAcknowledge response-drop proxy
        run: |
          set -euo pipefail
          rm -f /tmp/kafrust-share-ack-ambiguity-dropped
          python3 -u scripts/kafka_response_drop_proxy.py \
            --listen-port 39095 \
            --target-port 29095 \
            --drop-api-key 79 \
            --drop-marker /tmp/kafrust-share-ack-ambiguity-dropped \
            >/tmp/kafrust-share-ack-ambiguity-proxy.log 2>&1 &
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/39095) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-share-ack-ambiguity-proxy.log
          exit 1

      - name: Run response-loss reconciliation gate
        run: |
          cargo test -p kafrust --test broker_roundtrip \
            share_consumer_reconciles_lost_release_response_when_broker_is_configured \
            -- --nocapture

      - name: Verify ShareAcknowledge response was dropped
        run: test -f /tmp/kafrust-share-ack-ambiguity-dropped

      - name: Dump diagnostics
        if: failure()
        run: |
          cat /tmp/kafrust-share-ack-ambiguity-proxy.log || true
          docker logs kafrust-share-ack-ambiguity || true
