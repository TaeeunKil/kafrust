name: Published KIP-848 Regex Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.6"

permissions:
  contents: read

jobs:
  published-regex:
    name: Published kafrust ${{ inputs.kafrust_version }} KIP-848 regex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:39097
      KAFRUST_GROUP_ID: kafrust-published-regex-${{ github.run_id }}
      KAFRUST_GROUP_PROTOCOL: consumer
      KAFRUST_TOPIC_PATTERN: ^kafrust-published-regex-(orders|payments|dynamic-${{ github.run_id }})$
      KAFRUST_REGEX_EXPECTED_TOPICS: kafrust-published-regex-orders,kafrust-published-regex-payments
      KAFRUST_REGEX_DYNAMIC_TOPIC: kafrust-published-regex-dynamic-${{ github.run_id }}
      KAFRUST_COMMIT_WORKER: "1"
      KAFRUST_COMMIT_WORKER_INTERVAL_MS: "100"
      RUST_LOG: kafrust=debug
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1
        run: |
          docker network create kafrust-published-regex
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-published-regex-broker \
            --network kafrust-published-regex \
            -p 39097:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-regex-broker:29092,EXTERNAL://localhost:39097 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-regex-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.3.1

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-regex-broker \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-regex-broker:29092 \
              >/tmp/kafrust-published-regex-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-regex-probe.log || true
          docker logs kafrust-published-regex-broker
          exit 1

      - name: Create and seed initial regex topics
        run: |
          for topic in kafrust-published-regex-orders kafrust-published-regex-payments; do
            docker exec kafrust-published-regex-broker /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafrust-published-regex-broker:29092 \
              --create --topic "$topic" --partitions 1 --replication-factor 1
            printf 'published-regex-seed-%s\n' "$topic" | \
              docker exec -i kafrust-published-regex-broker /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server kafrust-published-regex-broker:29092 --topic "$topic"
          done

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-regex"
          cargo new --bin "$project_dir"
          cp crates/kafrust/examples/consumer_group_regex.rs "$project_dir/src/main.rs"
          cp crates/kafrust/examples/common/mod.rs "$project_dir/src/common.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-regex-smoke/Cargo.toml > "$project_dir/Cargo.toml"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published smoke project must be outside the repository"
            exit 1
          fi

      - name: Run published KIP-848 regex and dynamic assignment
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/kafrust-published-regex"
          cargo run --manifest-path "$project_dir/Cargo.toml" 2>&1 \
            | tee /tmp/kafrust-published-regex.log
          grep -Fq "regex subscription received dynamic topic" /tmp/kafrust-published-regex.log
          grep -Fq "regex subscription" /tmp/kafrust-published-regex.log
          grep -A1 -q 'name = "kafrust"' "$project_dir/Cargo.lock"
          grep -A1 -q 'version = "${{ inputs.kafrust_version }}"' "$project_dir/Cargo.lock"

      - name: Verify dynamic topic through Kafka CLI
        run: |
          docker exec kafrust-published-regex-broker /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server kafrust-published-regex-broker:29092 \
            --group "$KAFRUST_GROUP_ID" --describe \
            | tee /tmp/kafrust-published-regex-group.log
          grep -Fq "$KAFRUST_REGEX_DYNAMIC_TOPIC" /tmp/kafrust-published-regex-group.log

      - name: Dump diagnostics
        if: failure()
        run: |
          cat /tmp/kafrust-published-regex.log || true
          docker logs kafrust-published-regex-broker || true
