name: Fuzz Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  compile-fuzz-targets:
    name: Compile libFuzzer targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fuzz
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked

      - name: Compile all fuzz targets
        run: |
          for target in \
            codec \
            frame \
            api_versions_response \
            group_describe_response \
            share_group_offsets_response \
            streams_groups_response \
            offset_commit_response \
            offset_fetch_response \
            compression \
            list_groups_response; do
            cargo +nightly fuzz check "$target"
          done

      - name: Run corpus-backed fuzz campaign
        run: |
          set -o pipefail
          status=0
          mkdir -p "$RUNNER_TEMP/kafrust-fuzz-artifacts"
          for target in \
            codec \
            frame \
            api_versions_response \
            group_describe_response \
            share_group_offsets_response \
            streams_groups_response \
            offset_commit_response \
            offset_fetch_response \
            compression \
            list_groups_response; do
            mkdir -p "$RUNNER_TEMP/kafrust-fuzz-artifacts/$target"
            if ! cargo +nightly fuzz run "$target" "corpus/$target" -- \
              -max_total_time=30 \
              -rss_limit_mb=2048 \
              -timeout=10 \
              -artifact_prefix="$RUNNER_TEMP/kafrust-fuzz-artifacts/$target/" \
              -print_final_stats=1; then
              status=1
            fi
          done
          exit "$status"

      - name: Upload fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafrust-fuzz-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/kafrust-fuzz-artifacts
            fuzz/corpus
