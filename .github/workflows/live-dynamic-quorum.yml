name: Live Kafka Dynamic Quorum

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:19093
  KAFRUST_CONTROLLER_BOOTSTRAP_SERVERS: 127.0.0.1:19093
  KAFRUST_NEW_VOTER_ID: "2"
  KAFRUST_NEW_VOTER_LISTENER: CONTROLLER://controller-2:9093

jobs:
  dynamic-quorum:
    name: Kafka 4.3.1 dynamic controller membership
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Create Docker network
        run: docker network create kafrust-dynamic-quorum

      - name: Start standalone controller
        run: |
          docker run -d \
            --name kafrust-controller-1 \
            --hostname controller-1 \
            --network kafrust-dynamic-quorum \
            -p 19093:9093 \
            -e CLUSTER_ID="$KAFRUST_CLUSTER_ID" \
            apache/kafka:4.3.1 \
            bash -ec '
              cat > /tmp/controller.properties <<EOF
          process.roles=controller
          node.id=1
          listeners=CONTROLLER://:9093
          controller.listener.names=CONTROLLER
          listener.security.protocol.map=CONTROLLER:PLAINTEXT
          controller.quorum.bootstrap.servers=controller-1:9093,controller-2:9093
          metadata.log.dir=/tmp/kraft-metadata
          log.dirs=/tmp/kraft-logs
          EOF
              /opt/kafka/bin/kafka-storage.sh format --cluster-id "$CLUSTER_ID" --standalone --config /tmp/controller.properties
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/controller.properties
            '

      - name: Wait for standalone controller
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-controller-1 \
              /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller controller-1:9093 describe --status >/tmp/quorum-status 2>/dev/null; then
              cat /tmp/quorum-status
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-controller-1
          exit 1

      - name: Start observer controller
        run: |
          docker run -d \
            --name kafrust-controller-2 \
            --hostname controller-2 \
            --network kafrust-dynamic-quorum \
            -p 29093:9093 \
            -e CLUSTER_ID="$KAFRUST_CLUSTER_ID" \
            apache/kafka:4.3.1 \
            bash -ec '
              cat > /tmp/controller.properties <<EOF
          process.roles=controller
          node.id=2
          listeners=CONTROLLER://:9093
          controller.listener.names=CONTROLLER
          listener.security.protocol.map=CONTROLLER:PLAINTEXT
          controller.quorum.bootstrap.servers=controller-1:9093,controller-2:9093
          metadata.log.dir=/tmp/kraft-metadata
          log.dirs=/tmp/kraft-logs
          EOF
              /opt/kafka/bin/kafka-storage.sh format --cluster-id "$CLUSTER_ID" --no-initial-controllers --config /tmp/controller.properties
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/controller.properties
            '

      - name: Wait for observer replication
        run: |
          for attempt in {1..90}; do
            output="$(docker exec kafrust-controller-1 \
              /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller controller-1:9093 describe --replication 2>/dev/null || true)"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | awk '$1 == 2 { found = 1 } END { exit found ? 0 : 1 }'; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-controller-1
          docker logs kafrust-controller-2
          exit 1

      - name: Read observer directory UUID
        run: |
          directory_id="$(docker exec kafrust-controller-2 \
            sh -c "sed -n 's/^directory.id=//p' /tmp/kraft-metadata/meta.properties")"
          test -n "$directory_id"
          echo "KAFRUST_NEW_VOTER_DIRECTORY_ID=$directory_id" >> "$GITHUB_ENV"
          echo "observer directory id discovered"

      - name: Run AddRaftVoter and RemoveRaftVoter qualification
        run: cargo run -p kafrust --example admin_dynamic_quorum

      - name: Dump Kafka logs
        if: failure()
        run: |
          docker logs kafrust-controller-1 || true
          docker logs kafrust-controller-2 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kafrust-controller-2 kafrust-controller-1 || true
          docker network rm kafrust-dynamic-quorum || true
