name: Live ListConfigResources Compatibility

on:
  workflow_dispatch:
    inputs:
      kafka_version:
        description: Kafka version to qualify
        required: true
        type: choice
        default: 4.3.1
        options:
          - "3.9.1"
          - "4.1.0"
          - "4.2.0"
          - "4.3.1"

permissions:
  contents: read

jobs:
  list-config-resources:
    name: Kafka ${{ inputs.kafka_version }} API 74 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:39092
      KAFRUST_CONFIG_TOPIC: kafrust-config-qualification
      KAFRUST_EXPECT_DESCRIBE_CLUSTER_VERSION: "1"
      KAFRUST_EXPECT_LIST_CONFIG_RESOURCES_VERSION: ${{ inputs.kafka_version == '3.9.1' && '0' || '1' }}
      KAFRUST_LIST_CONFIG_RESOURCES_RESOURCE_TYPE: ${{ inputs.kafka_version == '3.9.1' && '16' || '2' }}
      KAFRUST_EXPECT_DESCRIBE_CONFIGS_VERSION: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker network create kafrust-list-config-resources
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-list-config-resources-broker \
            --network kafrust-list-config-resources \
            -p 39092:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-list-config-resources-broker:29092,EXTERNAL://127.0.0.1:39092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-list-config-resources-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-list-config-resources-broker \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-list-config-resources-broker:29092 \
              >/tmp/kafrust-list-config-resources-ready.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-list-config-resources-ready.log || true
          docker logs kafrust-list-config-resources-broker
          exit 1

      - name: Create configuration qualification topic
        if: inputs.kafka_version != '3.9.1'
        run: |
          docker exec kafrust-list-config-resources-broker \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-list-config-resources-broker:29092 \
            --create --if-not-exists \
            --topic "$KAFRUST_CONFIG_TOPIC" \
            --partitions 1 --replication-factor 1

      - name: Run current-source configuration API roundtrip
        run: |
          if [ "${{ inputs.kafka_version }}" = "3.9.1" ]; then
            unset KAFRUST_EXPECT_DESCRIBE_CONFIGS_VERSION
          fi
          cargo test -p kafrust --test broker_roundtrip \
            api_versions_and_metadata_roundtrip_when_broker_is_configured \
            -- --nocapture

      - name: Dump diagnostics
        if: failure()
        run: docker logs kafrust-list-config-resources-broker || true
