name: Live UpdateFeatures Transaction Lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 4"

permissions:
  contents: read

env:
  KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:39092
  KAFRUST_EXPECT_UPDATE_FEATURES_VERSION: "1"
  KAFRUST_UPDATE_FEATURES_FEATURE: transaction.version
  KAFRUST_UPDATE_FEATURES_EXPECT_ERROR: "0"
  KAFRUST_UPDATE_FEATURES_VALIDATE_ONLY: "false"

jobs:
  transaction-lifecycle:
    name: Kafka 4.3.1 transaction feature lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1
        run: |
          docker network create kafrust-update-features-lifecycle
          kafka_image="apache/kafka:4.3.1"
          cluster_id="$(docker run --rm "$kafka_image" /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-update-features-lifecycle \
            --network kafrust-update-features-lifecycle \
            -p 39092:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-update-features-lifecycle:29092,EXTERNAL://127.0.0.1:39092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-update-features-lifecycle:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            "$kafka_image"

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-update-features-lifecycle \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-update-features-lifecycle:29092 \
              >/tmp/kafrust-update-features-lifecycle-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-update-features-lifecycle-probe.log || true
          docker logs kafrust-update-features-lifecycle
          exit 1

      - name: Prepare transaction feature at level 2
        run: |
          docker exec kafrust-update-features-lifecycle \
            /opt/kafka/bin/kafka-features.sh \
            --bootstrap-server kafrust-update-features-lifecycle:29092 \
            upgrade --feature transaction.version=2

      - name: Run safe transaction feature downgrade 2 to 1
        env:
          KAFRUST_UPDATE_FEATURES_LEVEL: "1"
          KAFRUST_UPDATE_FEATURES_ALLOW_DOWNGRADE: "true"
          KAFRUST_UPDATE_FEATURES_VERIFY_LEVEL: "1"
        run: |
          cargo test -p kafrust --test broker_roundtrip \
            api_versions_and_metadata_roundtrip_when_broker_is_configured \
            -- --nocapture

      - name: Run transaction feature upgrade 1 to 2
        env:
          KAFRUST_UPDATE_FEATURES_LEVEL: "2"
          KAFRUST_UPDATE_FEATURES_ALLOW_DOWNGRADE: "false"
          KAFRUST_UPDATE_FEATURES_VERIFY_LEVEL: "2"
        run: |
          cargo test -p kafrust --test broker_roundtrip \
            api_versions_and_metadata_roundtrip_when_broker_is_configured \
            -- --nocapture

      - name: Dump Kafka diagnostics
        if: failure()
        run: docker logs kafrust-update-features-lifecycle || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kafrust-update-features-lifecycle || true
          docker network rm kafrust-update-features-lifecycle || true
