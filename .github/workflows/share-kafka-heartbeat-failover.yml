name: Live Kafka Share Heartbeat Failover

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
  KAFRUST_TOPIC: kafrust-share-heartbeat-${{ github.run_id }}
  KAFRUST_SHARE_TOPIC: kafrust-share-heartbeat-${{ github.run_id }}
  KAFRUST_GROUP_ID: kafrust-share-heartbeat-group-${{ github.run_id }}
  KAFRUST_SHARE_GROUP_ID: kafrust-share-heartbeat-group-${{ github.run_id }}
  KAFRUST_SHARE_VALUE: share-heartbeat-post-${{ github.run_id }}
  KAFRUST_SHARE_HEARTBEAT_CYCLES: "3"
  KAFRUST_SHARE_HEARTBEAT_VALUE_PREFIX: share-heartbeat-cycle-

jobs:
  share-heartbeat-failover:
    name: Kafka 4.3.1 ShareConsumer active heartbeat failover (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 4.3.1 with share groups enabled
        run: |
          docker network create kafrust-share-heartbeat
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-share-heartbeat-${node}" \
              --network kafrust-share-heartbeat \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-share-heartbeat-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-share-heartbeat-1:9093,2@kafrust-share-heartbeat-2:9093,3@kafrust-share-heartbeat-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=2 \
              -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
              -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-share-heartbeat-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-share-heartbeat-1:29092 >/tmp/kafrust-share-heartbeat-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-share-heartbeat-probe.log || true
          docker logs kafrust-share-heartbeat-1
          docker logs kafrust-share-heartbeat-2
          docker logs kafrust-share-heartbeat-3
          exit 1

      - name: Create replicated share topic and choose broker 1 leader
        run: |
          docker exec kafrust-share-heartbeat-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-share-heartbeat-1:29092 \
            --create --if-not-exists --topic "$KAFRUST_SHARE_TOPIC" \
            --partitions 6 --replication-factor 3
          docker exec kafrust-share-heartbeat-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-share-heartbeat-1:29092 --describe \
            --topic "$KAFRUST_SHARE_TOPIC" | tee /tmp/kafrust-share-heartbeat-topic.log
          failover_partition="$(awk '/Partition:/ && /Leader: 1/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-share-heartbeat-topic.log)"
          if [ -z "$failover_partition" ]; then
            echo "could not find a partition led by broker 1"
            exit 1
          fi
          echo "KAFRUST_SHARE_PARTITION=${failover_partition}" >> "$GITHUB_ENV"

      - name: Configure share group offset reset
        run: |
          docker exec kafrust-share-heartbeat-1 /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-share-heartbeat-1:29092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest

      - name: Produce pre-heartbeat record on selected partition leader
        env:
          KAFRUST_VALUE: share-heartbeat-pre-${{ github.run_id }}
        run: |
          KAFRUST_PARTITION="$KAFRUST_SHARE_PARTITION" \
            cargo run -p kafrust --example producer_send

      - name: Repeat coordinator loss while active heartbeat task is running
        env:
          KAFRUST_SHARE_PRE_VALUE: share-heartbeat-pre-${{ github.run_id }}
          KAFRUST_SHARE_HEARTBEAT_READY_FILE: ${{ runner.temp }}/kafrust-share-heartbeat-ready
        run: |
          set -euo pipefail
          rm -f "$KAFRUST_SHARE_HEARTBEAT_READY_FILE"-* /tmp/kafrust-share-heartbeat-test.log
          set +e
          cargo test -p kafrust --test broker_roundtrip share_consumer_active_heartbeat_failover_when_broker_is_configured -- --nocapture > /tmp/kafrust-share-heartbeat-test.log 2>&1 &
          test_pid=$!
          wait_for_marker() {
            marker="$1"
            for attempt in {1..180}; do
              if [ -f "$marker" ]; then
                return 0
              fi
              if ! kill -0 "$test_pid" 2>/dev/null; then
                cat /tmp/kafrust-share-heartbeat-test.log
                return 1
              fi
              sleep 1
            done
            echo "timed out waiting for $marker"
            cat /tmp/kafrust-share-heartbeat-test.log
            return 1
          }

          find_share_coordinator() {
            for candidate in 1 2 3; do
              if ! docker ps --format '{{.Names}}' | grep -qx "kafrust-share-heartbeat-${candidate}"; then
                continue
              fi
              state="$(docker exec "kafrust-share-heartbeat-${candidate}" /opt/kafka/bin/kafka-share-groups.sh \
                --bootstrap-server "kafrust-share-heartbeat-${candidate}:29092" \
                --describe --group "$KAFRUST_SHARE_GROUP_ID" --state 2>/dev/null || true)"
              if [ -n "$state" ]; then
                printf '%s\n' "$state"
                return 0
              fi
            done
            return 1
          }

          for cycle in $(seq 1 "$KAFRUST_SHARE_HEARTBEAT_CYCLES"); do
            ready_file="$KAFRUST_SHARE_HEARTBEAT_READY_FILE-${cycle}-ready"
            recovered_file="$KAFRUST_SHARE_HEARTBEAT_READY_FILE-${cycle}-recovered"
            continue_file="$KAFRUST_SHARE_HEARTBEAT_READY_FILE-${cycle}-continue"
            if ! wait_for_marker "$ready_file"; then
              kill "$test_pid" 2>/dev/null || true
              wait "$test_pid" || true
              exit 1
            fi
            if ! share_state="$(find_share_coordinator)"; then
              echo "could not inspect the share coordinator for cycle $cycle"
              cat /tmp/kafrust-share-heartbeat-test.log
              kill "$test_pid" 2>/dev/null || true
              wait "$test_pid" || true
              exit 1
            fi
            printf '%s\n' "$share_state"
            coordinator_id="$(printf '%s\n' "$share_state" | sed -n 's/.*(\([0-9-]*\)).*/\1/p' | head -n 1)"
            if [ -z "$coordinator_id" ] || [ "$coordinator_id" -lt 1 ] || [ "$coordinator_id" -gt 3 ]; then
              echo "could not resolve the active share coordinator broker for cycle $cycle"
              cat /tmp/kafrust-share-heartbeat-test.log
              kill "$test_pid" 2>/dev/null || true
              wait "$test_pid"
              exit 1
            fi
            echo "stopping coordinator broker $coordinator_id for cycle $cycle"
            docker stop "kafrust-share-heartbeat-${coordinator_id}"
            case "$coordinator_id" in
              1) surviving_bootstrap="localhost:19093,localhost:19094" ;;
              2) surviving_bootstrap="localhost:19092,localhost:19094" ;;
              3) surviving_bootstrap="localhost:19092,localhost:19093" ;;
            esac
            if ! KAFRUST_BOOTSTRAP_SERVERS="$surviving_bootstrap" \
              KAFRUST_VALUE="${KAFRUST_SHARE_HEARTBEAT_VALUE_PREFIX}${cycle}" \
              KAFRUST_PARTITION="$KAFRUST_SHARE_PARTITION" \
              cargo run -p kafrust --example producer_send; then
              echo "failed to produce heartbeat cycle $cycle record"
              cat /tmp/kafrust-share-heartbeat-test.log
              kill "$test_pid" 2>/dev/null || true
              wait "$test_pid" || true
              exit 1
            fi
            if ! wait_for_marker "$recovered_file"; then
              kill "$test_pid" 2>/dev/null || true
              wait "$test_pid" || true
              exit 1
            fi
            if [ "$cycle" -lt "$KAFRUST_SHARE_HEARTBEAT_CYCLES" ]; then
              docker start "kafrust-share-heartbeat-${coordinator_id}"
              broker_ready=0
              for attempt in {1..90}; do
                if docker exec "kafrust-share-heartbeat-${coordinator_id}" /opt/kafka/bin/kafka-broker-api-versions.sh \
                  --bootstrap-server "kafrust-share-heartbeat-${coordinator_id}:29092" >/dev/null 2>&1; then
                  broker_ready=1
                  break
                fi
                sleep 2
              done
              if [ "$broker_ready" -ne 1 ]; then
                echo "broker $coordinator_id did not restart before cycle $cycle continued"
                exit 1
              fi
              touch "$continue_file"
            fi
          done

          set +e
          wait "$test_pid"
          test_status=$?
          cat /tmp/kafrust-share-heartbeat-test.log
          exit "$test_status"

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-share-heartbeat-1 || true
          docker logs kafrust-share-heartbeat-2 || true
          docker logs kafrust-share-heartbeat-3 || true
