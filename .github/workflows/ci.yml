name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.75.0"
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check build
        run: cargo check --workspace --all-targets

      - name: Check TLS feature build
        run: cargo check -p kafrust --features tls --all-targets

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run TLS feature clippy
        run: cargo clippy -p kafrust --features tls --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run kafrust doc tests
        run: cargo test -p kafrust --doc

      - name: Run TLS feature tests
        run: cargo test -p kafrust --features tls --all-targets
