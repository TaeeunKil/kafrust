name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.81.0"
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check whitespace
        run: git diff --check

      - name: Check protocol API surface
        run: python scripts/check_protocol_api_surface.py

      - name: Check Apache schema metadata
        run: python scripts/check_apache_schema_versions.py

      - name: Test protocol audit scripts
        run: python -m unittest scripts/test_check_apache_schema_versions.py

      - name: Check build
        run: cargo check --workspace --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
