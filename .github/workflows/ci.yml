name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.81.0"
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check published external example formatting
        run: |
          rustfmt --edition 2021 --check \
            .github/published-performance-smoke/src/main.rs \
            .github/published-multi-soak-smoke/src/main.rs \
            .github/published-secure-multi-soak-smoke/src/main.rs \
            .github/published-share-multi-member/src/main.rs \
            .github/published-streams-group-runtime/src/main.rs

      - name: Check whitespace
        run: git diff --check

      - name: Check long-campaign safety scripts
        run: bash -n scripts/check_campaign_capacity.sh scripts/cleanup_campaign_docker.sh

      - name: Check protocol API surface
        run: python scripts/check_protocol_api_surface.py

      - name: Check V1 API-key classification
        run: python scripts/check_v1_api_key_classification.py

      - name: Check V1 secret redaction artifacts
        run: python scripts/check_v1_secret_artifacts.py

      - name: Check V1 session ownership inventory
        run: python scripts/check_v1_ownership_inventory.py

      - name: Check V1 metrics contract
        run: python scripts/check_v1_metrics_contract.py

      - name: Check Apache schema metadata
        run: python scripts/check_apache_schema_versions.py

      - name: Check data-plane version manifest
        run: python scripts/check_data_plane_manifest.py

      - name: Check v1 compatibility matrix manifest
        run: python scripts/check_v1_compatibility_matrix.py

      - name: Check v1 fuzz campaign manifest
        run: python scripts/check_v1_fuzz_campaign_manifest.py

      - name: Check v1 fault campaign manifest
        run: python scripts/check_v1_fault_campaign_manifest.py

      - name: Test V1-21 fault result adjudicator
        run: python -m unittest scripts/test_check_v1_fault_results.py

      - name: Test V1-21 fault schedule parser
        run: python -m unittest scripts/test_check_v1_fault_schedule.py

      - name: Check v1 performance campaign manifest
        run: python scripts/check_v1_performance_campaign_manifest.py

      - name: Test V1-22 performance result adjudicator
        run: python -m unittest scripts/test_check_v1_performance_results.py

      - name: Check V1 dependency graph posture
        run: python scripts/check_v1_dependency_graph.py

      - name: Check V1 native-tooling posture
        run: python scripts/check_v1_native_tooling.py --check

      - name: Check V1 license policy
        run: python scripts/check_v1_license_policy.py --check

      - name: Check V1 unsafe/native inventory
        run: python scripts/check_v1_unsafe_native_inventory.py --check

      - name: Check V1 unsafe/native owner review
        run: python scripts/check_v1_unsafe_native_review.py --check

      - name: Check V1 registry provenance
        run: python scripts/check_v1_registry_provenance.py --check

      - name: Check V1 advisory snapshot
        run: python scripts/check_v1_advisories.py --check --allow-resolved-version-drift

      - name: Check v1 migration canary manifest
        run: python scripts/check_v1_migration_canary_manifest.py

      - name: Check published workflow version defaults
        run: python scripts/check_published_workflow_versions.py

      - name: Test protocol audit scripts
        run: python -m unittest scripts/test_check_apache_schema_versions.py

      - name: Test V1 API-key classification checker
        run: python -m unittest scripts/test_check_v1_api_key_classification.py

      - name: Test V1 secret artifact checker
        run: python -m unittest scripts/test_check_v1_secret_artifacts.py

      - name: Test V1 session ownership checker
        run: python -m unittest scripts/test_check_v1_ownership_inventory.py

      - name: Test V1 metrics contract checker
        run: python -m unittest scripts/test_check_v1_metrics_contract.py

      - name: Test V1-19 SBOM checker
        run: python -m unittest scripts/test_check_v1_sbom.py

      - name: Test V1-19 native-tooling checker
        run: python -m unittest scripts/test_check_v1_native_tooling.py

      - name: Test V1-19 license-policy checker
        run: python -m unittest scripts/test_check_v1_license_policy.py

      - name: Test V1-19 unsafe/native inventory checker
        run: python -m unittest scripts/test_check_v1_unsafe_native_inventory.py

      - name: Test V1-19 unsafe/native owner review
        run: python -m unittest scripts/test_check_v1_unsafe_native_review.py

      - name: Test V1-19 registry-provenance checker
        run: python -m unittest scripts/test_check_v1_registry_provenance.py

      - name: Test V1-19 advisory checker
        run: python -m unittest scripts/test_check_v1_advisories.py

      - name: Check qualification ledger
        run: python scripts/check_qualification_ledger.py

      - name: Test qualification ledger checker
        run: python -m unittest scripts/test_check_qualification_ledger.py

      - name: Check public API snapshot
        run: python scripts/public_api_snapshot.py

      - name: Check V1 API freeze manifest
        run: python scripts/check_v1_api_freeze_manifest.py

      - name: Check V1 migration notes
        run: python scripts/check_v1_migration_notes.py

      - name: Check V1 release-candidate manifest
        run: python scripts/check_v1_rc_manifest.py

      - name: Check V1 stable-release manifest
        run: python scripts/check_v1_release_manifest.py

      - name: Compile public surface feature profiles
        run: |
          cargo test -p kafrust --test public_surface --no-default-features
          cargo test -p kafrust --test public_surface --no-default-features --features tls
          cargo test -p kafrust --test public_surface --no-default-features --features blocking
          cargo test -p kafrust --test public_surface --no-default-features --features otlp
          cargo test -p kafrust --test public_surface --all-features

      - name: Check build
        run: cargo check --workspace --all-targets --all-features

      - name: Check published Streams example against current source
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-streams-compile"
          cargo new --bin "$project_dir"
          cp .github/published-streams-group-runtime/src/main.rs "$project_dir/src/main.rs"
          sed "s|kafrust = \"__KAFRUST_VERSION__\"|kafrust = { path = \"$GITHUB_WORKSPACE/crates/kafrust\" }|" \
            .github/published-streams-group-runtime/Cargo.toml > "$project_dir/Cargo.toml"
          cargo check --manifest-path "$project_dir/Cargo.toml"

      - name: Check published Share example against current source
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-compile"
          cargo new --bin "$project_dir"
          cp .github/published-share-multi-member/src/main.rs "$project_dir/src/main.rs"
          sed "s|kafrust = \"__KAFRUST_VERSION__\"|kafrust = { path = \"$GITHUB_WORKSPACE/crates/kafrust\" }|" \
            .github/published-share-multi-member/Cargo.toml > "$project_dir/Cargo.toml"
          cargo check --manifest-path "$project_dir/Cargo.toml"

      - name: Check published secure Share example against current source
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-secure-compile"
          cargo new --bin "$project_dir"
          cp .github/published-share-multi-member/src/main.rs "$project_dir/src/main.rs"
          sed "s|kafrust = \"__KAFRUST_VERSION__\"|kafrust = { path = \"$GITHUB_WORKSPACE/crates/kafrust\", features = [\"tls\"] }|" \
            .github/published-share-multi-member/Cargo.toml > "$project_dir/Cargo.toml"
          cargo check --manifest-path "$project_dir/Cargo.toml"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

      - name: Reproduce published 0.3.5 package boundary regression
        if: matrix.toolchain == 'stable'
        run: python scripts/verify_package_boundary.py --regression

      - name: Verify package-only protocol and client boundary
        run: python scripts/verify_package_boundary.py --staged

      - name: Verify deterministic V1-19 SBOM and package artifacts
        if: matrix.toolchain == 'stable'
        run: python scripts/check_v1_sbom.py --check --require-artifacts --allow-resolved-version-drift
