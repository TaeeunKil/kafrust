name: Published Mutual TLS

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.3"
      kafka_version:
        description: "Apache Kafka broker image version"
        required: true
        default: "3.7.2"
        type: choice
        options:
          - "3.7.2"
          - "4.3.1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:19093
  KAFRUST_TOPIC: kafrust-published-mtls-data-${{ github.run_id }}
  KAFRUST_TRANSACTION_TOPIC: kafrust-published-mtls-transactions-${{ github.run_id }}
  KAFRUST_ADMIN_TOPIC: kafrust-published-mtls-admin-${{ github.run_id }}
  KAFRUST_GROUP_ID: kafrust-published-mtls-group-${{ github.run_id }}
  KAFRUST_TRANSACTIONAL_ID: kafrust-published-mtls-transaction-${{ github.run_id }}
  KAFRUST_VALUE: published-mTLS-roundtrip

jobs:
  published-mtls:
    name: Published kafrust ${{ inputs.kafrust_version }} on Kafka ${{ inputs.kafka_version }} mutual TLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate CA, broker, and client certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mtls

          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -subj "/CN=kafrust-published-mtls-ca" \
            -keyout mtls/ca.key \
            -out mtls/ca.crt
          openssl x509 -in mtls/ca.crt -outform DER -out mtls/ca.der

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out mtls/server.key
          openssl req -new -key mtls/server.key -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -out mtls/server.csr
          openssl x509 -req -in mtls/server.csr -CA mtls/ca.crt \
            -CAkey mtls/ca.key -CAcreateserial -days 1 -sha256 \
            -copy_extensions copy -out mtls/server.crt
          openssl pkcs12 -export -in mtls/server.crt -inkey mtls/server.key \
            -certfile mtls/ca.crt -name localhost \
            -out mtls/kafka.server.keystore.p12 -password pass:kafrust

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out mtls/client.key
          openssl req -new -key mtls/client.key -subj "/CN=kafrust-published-client" \
            -addext "extendedKeyUsage=clientAuth" \
            -out mtls/client.csr
          openssl x509 -req -in mtls/client.csr -CA mtls/ca.crt \
            -CAkey mtls/ca.key -CAcreateserial -days 1 -sha256 \
            -copy_extensions copy -out mtls/client.crt
          openssl x509 -in mtls/client.crt -outform DER -out mtls/client.der
          openssl pkcs8 -topk8 -nocrypt -in mtls/client.key \
            -outform DER -out mtls/client-key.der

          keytool -importcert -noprompt -alias kafrust-published-mtls-ca \
            -file mtls/ca.crt -keystore mtls/kafka.server.truststore.p12 \
            -storetype PKCS12 -storepass kafrust
          printf 'kafrust' > mtls/keystore-password
          printf 'kafrust' > mtls/key-password
          printf 'kafrust' > mtls/truststore-password
          chmod 644 mtls/*

      - name: Start Kafka with required client authentication
        shell: bash
        run: |
          set -euo pipefail
          docker network create kafrust-published-mtls
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} \
            /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-published-mtls-broker \
            --hostname kafrust-published-mtls-broker \
            --network kafrust-published-mtls \
            -p 19093:9093 \
            -v "$PWD/mtls:/etc/kafka/secrets:ro" \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,SSL://:9093,CONTROLLER://:9094 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-mtls-broker:29092,SSL://localhost:19093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SSL:SSL \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-mtls-broker:9094 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
            -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
            -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
            -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
            -e KAFKA_SSL_TRUSTSTORE_FILENAME=kafka.server.truststore.p12 \
            -e KAFKA_SSL_TRUSTSTORE_CREDENTIALS=truststore-password \
            -e KAFKA_SSL_TRUSTSTORE_TYPE=PKCS12 \
            -e KAFKA_SSL_CLIENT_AUTH=required \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for mutual TLS listener
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            if openssl s_client -connect 127.0.0.1:19093 \
                -CAfile mtls/ca.crt \
                -cert mtls/client.crt \
                -key mtls/client.key \
                -verify_return_error -brief < /dev/null \
                > /tmp/kafrust-published-mtls-openssl.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-mtls-openssl.log
          docker logs kafrust-published-mtls-broker
          exit 1

      - name: Create data and transaction topics
        shell: bash
        run: |
          set -euo pipefail
          for topic in "$KAFRUST_TOPIC" "$KAFRUST_TRANSACTION_TOPIC"; do
            docker exec kafrust-published-mtls-broker /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafrust-published-mtls-broker:29092 \
              --create --topic "$topic" --partitions 1 --replication-factor 1
          done

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/kafrust-published-mtls"
          cargo new --bin "$project_dir"
          cp .github/published-mtls-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s|__KAFRUST_VERSION__|${KAFRUST_PUBLISHED_VERSION}|" \
            .github/published-mtls-smoke/Cargo.toml > "$project_dir/Cargo.toml"
          test "$project_dir" != "$GITHUB_WORKSPACE"
          test -f "$project_dir/Cargo.toml"
          test -f "$project_dir/src/main.rs"

      - name: Run published mTLS project
        working-directory: ${{ runner.temp }}/kafrust-published-mtls
        env:
          KAFRUST_SECURITY_PROTOCOL: tls
          KAFRUST_TLS_SERVER_NAME: localhost
          KAFRUST_TLS_ROOT_CERT_DER_PATH: ${{ github.workspace }}/mtls/ca.der
          KAFRUST_TLS_CLIENT_CERT_DER_PATH: ${{ github.workspace }}/mtls/client.der
          KAFRUST_TLS_CLIENT_KEY_DER_PATH: ${{ github.workspace }}/mtls/client-key.der
        run: cargo run --quiet

      - name: Upload broker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-mtls-kafka-diagnostics-${{ github.run_id }}
          path: /tmp/kafrust-published-mtls-openssl.log
          if-no-files-found: ignore

      - name: Cleanup Kafka
        if: always()
        shell: bash
        run: |
          docker logs kafrust-published-mtls-broker || true
          docker rm -f kafrust-published-mtls-broker || true
          docker network rm kafrust-published-mtls || true
