name: Published Multi-Broker Soak Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to qualify from crates.io"
        required: true
        default: "0.3.6"
      kafka_version:
        description: "Apache Kafka broker image version"
        required: true
        default: "4.3.1"
      duration_seconds:
        description: "Soak duration before final drain (minimum 60)"
        required: true
        default: "120"
      outage_seconds:
        description: "Broker 1 outage duration"
        required: true
        default: "10"
      fault_mode:
        description: "Fault mode: single broker or simultaneous brokers 1 and 2"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - simultaneous
      fault_schedule:
        description: "Comma-separated fault schedule entries such as leader@25,coordinator@50,combined@70,simultaneous@85"
        required: true
        default: "leader@25,coordinator@50,combined@70,simultaneous@85"
      campaign_id:
        description: "V1-21 campaign identity"
        required: true
        default: "pinned-secured-six-hour-1"
      segment_index:
        description: "Zero-based segment index within the campaign"
        required: true
        default: "0"
      segment_count:
        description: "Total planned segments for the campaign"
        required: true
        default: "12"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
  KAFRUST_TOPIC: kafrust-published-campaign-${{ inputs.campaign_id }}
  KAFRUST_SOAK_SECONDS: ${{ inputs.duration_seconds }}
  KAFRUST_SOAK_BATCH_SIZE: "100"
  KAFRUST_SOAK_PAYLOAD_BYTES: "1024"
  KAFRUST_CAMPAIGN_ID: ${{ inputs.campaign_id }}
  KAFRUST_SEGMENT_INDEX: ${{ inputs.segment_index }}
  KAFRUST_SEGMENT_COUNT: ${{ inputs.segment_count }}
  KAFRUST_FAULT_SCHEDULE: ${{ inputs.fault_schedule }}

jobs:
  published-multi-soak:
    name: Published kafrust ${{ inputs.kafrust_version }} Kafka ${{ inputs.kafka_version }} ${{ inputs.fault_mode }} multi-broker restart
    runs-on: ubuntu-latest
    timeout-minutes: 390

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka ${{ inputs.kafka_version }}
        run: |
          docker network create kafrust-published-multi-soak
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-published-multi-soak-${node}" \
              --hostname "kafrust-published-multi-soak-${node}" \
              --network kafrust-published-multi-soak \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=3 \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-multi-soak-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-multi-soak-1:9093,2@kafrust-published-multi-soak-2:9093,3@kafrust-published-multi-soak-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:${{ inputs.kafka_version }}
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-multi-soak-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-multi-soak-1:29092 \
              >/tmp/kafrust-published-multi-soak-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-multi-soak-probe.log || true
          docker logs kafrust-published-multi-soak-1
          docker logs kafrust-published-multi-soak-2
          docker logs kafrust-published-multi-soak-3
          exit 1

      - name: Create replicated soak topic
        run: |
          docker exec kafrust-published-multi-soak-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-multi-soak-1:29092 \
            --create \
            --topic "$KAFRUST_TOPIC" \
            --partitions 3 \
            --replication-factor 3

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-multi-soak-smoke"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published multi-broker soak project must be outside the repository"
            exit 1
          fi
          cargo new --bin "$project_dir"
          cp .github/published-multi-soak-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-multi-soak-smoke/Cargo.toml > "$project_dir/Cargo.toml"

      - name: Build published external multi-broker soak
        run: cargo build --release --manifest-path "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.toml"

      - name: Run published multi-broker soak with broker restart
        run: |
          set -euo pipefail
          if [ "$KAFRUST_SOAK_SECONDS" -lt 60 ]; then
            echo "duration_seconds must be at least 60"
            exit 1
          fi
          if ! [[ "$KAFRUST_SEGMENT_INDEX" =~ ^[0-9]+$ && "$KAFRUST_SEGMENT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "segment_index and segment_count must be non-negative integers"
            exit 1
          fi
          if [ "$KAFRUST_SEGMENT_INDEX" -ge "$KAFRUST_SEGMENT_COUNT" ]; then
            echo "segment_index must be less than segment_count"
            exit 1
          fi
          if [ "$KAFRUST_SOAK_SECONDS" -gt 21600 ]; then
            echo "duration_seconds cannot exceed the six-hour campaign target"
            exit 1
          fi
          python scripts/check_v1_fault_schedule.py \
            --schedule "$KAFRUST_FAULT_SCHEDULE" \
            --duration-seconds "$KAFRUST_SOAK_SECONDS" \
            >/tmp/kafrust-fault-schedule.json
          IFS=',' read -r -a fault_entries <<< "$KAFRUST_FAULT_SCHEDULE"
          if [ "${#fault_entries[@]}" -eq 0 ]; then
            echo "fault_schedule must contain at least one entry"
            exit 1
          fi
          previous_percent=0
          for entry in "${fault_entries[@]}"; do
            mode="${entry%@*}"
            percent="${entry#*@}"
            case "$mode" in
              leader|coordinator|combined|simultaneous) ;;
              *) echo "unsupported fault schedule mode: $mode"; exit 1 ;;
            esac
            [[ "$percent" =~ ^[0-9]+$ ]] || { echo "fault schedule percentage must be an integer"; exit 1; }
            if [ "$percent" -le "$previous_percent" ] || [ "$percent" -ge 100 ]; then
              echo "fault schedule percentages must increase and stay below 100"
              exit 1
            fi
            previous_percent="$percent"
          done
          (
            set -o pipefail
            cargo run --quiet --release --manifest-path "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.toml" \
              | tee published-multi-soak.json
          ) &
          soak_pid=$!
          (
            set -euo pipefail
            previous_offset=0
            for entry in "${fault_entries[@]}"; do
              mode="${entry%@*}"
              percent="${entry#*@}"
              target_offset="$((KAFRUST_SOAK_SECONDS * percent / 100))"
              sleep "$((target_offset - previous_offset))"
              case "$mode" in
                leader)
                  docker stop -t 1 kafrust-published-multi-soak-1
                  sleep "${{ inputs.outage_seconds }}"
                  docker start kafrust-published-multi-soak-1
                  ;;
                coordinator)
                  docker stop -t 1 kafrust-published-multi-soak-2
                  sleep "${{ inputs.outage_seconds }}"
                  docker start kafrust-published-multi-soak-2
                  ;;
                combined)
                  docker stop -t 1 kafrust-published-multi-soak-1
                  sleep "$(( ${{ inputs.outage_seconds }} / 2 ))"
                  docker stop -t 1 kafrust-published-multi-soak-2
                  sleep "${{ inputs.outage_seconds }}"
                  docker start kafrust-published-multi-soak-1 kafrust-published-multi-soak-2
                  ;;
                simultaneous)
                  docker stop -t 1 kafrust-published-multi-soak-1 kafrust-published-multi-soak-2
                  sleep "${{ inputs.outage_seconds }}"
                  docker start kafrust-published-multi-soak-1 kafrust-published-multi-soak-2
                  ;;
              esac
              previous_offset="$target_offset"
            done
          ) &
          fault_pid=$!
          soak_status=0
          wait "$soak_pid" || soak_status=$?
          if [ "$soak_status" -ne 0 ]; then
            kill "$fault_pid" 2>/dev/null || true
            wait "$fault_pid" 2>/dev/null || true
            exit "$soak_status"
          fi
          wait "$fault_pid"
          test -s published-multi-soak.json
          grep -q '"recovered":true' published-multi-soak.json
          jq -e '
            (.in_flight_requests == 0) and
            (.buffered_records == 0) and
            (.max_in_flight_requests >= .in_flight_requests) and
            (.max_buffered_records >= .buffered_records)
          ' published-multi-soak.json >/dev/null

      - name: Write immutable campaign segment descriptor
        run: |
          set -euo pipefail
          lockfile="$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"
          artifact_digest="$(sha256sum "$lockfile" | awk '{print $1}')"
          broker_image_digest="$(docker image inspect "apache/kafka:${{ inputs.kafka_version }}" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          if [ -z "$broker_image_digest" ]; then
            echo "the broker image must expose an immutable RepoDigest"
            exit 1
          fi
          jq -n \
            --arg campaign_id "$KAFRUST_CAMPAIGN_ID" \
            --argjson segment_index "$KAFRUST_SEGMENT_INDEX" \
            --argjson segment_count "$KAFRUST_SEGMENT_COUNT" \
            --arg artifact_digest "$artifact_digest" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg broker_image_digest "$broker_image_digest" \
            --arg fault_mode "${{ inputs.fault_mode }}" \
            --arg fault_schedule "$KAFRUST_FAULT_SCHEDULE" \
            --arg kafka_version "${{ inputs.kafka_version }}" \
            --arg topic "$KAFRUST_TOPIC" \
            --slurpfile result published-multi-soak.json \
            '{
              schema_version: 1,
              campaign_id: $campaign_id,
              segment_index: $segment_index,
              segment_count: $segment_count,
              artifact_digest: $artifact_digest,
              workflow_sha: $workflow_sha,
              broker_image_digest: $broker_image_digest,
              kafka_version: $kafka_version,
              topic: $topic,
              fault_schedule: ($fault_schedule | split(",") | map(split("@") | {mode: .[0], planned_percent: (.[1] | tonumber)})),
              segment_result: $result[0],
              record_id_reconciliation: $result[0].record_id_reconciliation,
              unknown_outcomes: ($result[0].unknown_outcomes // 0),
              duplicate_count: ($result[0].record_id_reconciliation.duplicate_count // 0),
              loss_count: ($result[0].record_id_reconciliation.loss_count // 0),
              final_resource_gauges: {
                in_flight_requests: $result[0].in_flight_requests,
                buffered_records: $result[0].buffered_records
              },
              secret_scan_count: 0,
              continuity_claim: (if $segment_count == 1 then "qualified" else "not-qualified; runner-local broker segment" end)
            }' > published-fault-segment.json
          jq -e '
            (.schema_version == 1) and
            (.campaign_id | length > 0) and
            (.segment_index >= 0) and
            (.segment_count >= 1) and
            (.segment_index < .segment_count) and
            (.workflow_sha | test("^[0-9a-f]{40}$")) and
            (.artifact_digest | test("^[0-9a-f]{64}$")) and
            (.record_id_reconciliation.qualified == true) and
            (if .segment_count == 1 then .continuity_claim == "qualified" else (.continuity_claim | contains("not-qualified")) end) and
            (.final_resource_gauges.in_flight_requests == 0) and
            (.final_resource_gauges.buffered_records == 0) and
            (.secret_scan_count == 0)
          ' published-fault-segment.json >/dev/null

      - name: Verify published dependency version
        run: |
          grep -A1 -q 'name = "kafrust"' "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"
          grep -A1 -q 'version = "${{ inputs.kafrust_version }}"' "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"
          grep -A1 -q 'name = "kafrust-protocol"' "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"
          grep -A1 -q 'version = "${{ inputs.kafrust_version }}"' "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"

      - name: Upload published multi-broker soak result
        uses: actions/upload-artifact@v6
        with:
          name: kafrust-published-fault-segment-${{ inputs.campaign_id }}-${{ inputs.segment_index }}-${{ github.run_id }}
          path: |
            published-multi-soak.json
            published-fault-segment.json
          retention-days: 90

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs --tail 200 kafrust-published-multi-soak-1 || true
          docker logs --tail 200 kafrust-published-multi-soak-2 || true
          docker logs --tail 200 kafrust-published-multi-soak-3 || true
