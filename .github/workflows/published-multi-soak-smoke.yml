name: Published Multi-Broker Soak Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to qualify from crates.io"
        required: true
        default: "0.2.28"
      duration_seconds:
        description: "Soak duration before final drain (minimum 60)"
        required: true
        default: "120"
      outage_seconds:
        description: "Broker 1 outage duration"
        required: true
        default: "10"
      fault_mode:
        description: "Fault mode: single broker or simultaneous brokers 1 and 2"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - simultaneous

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
  KAFRUST_TOPIC: kafrust-published-multi-soak-${{ github.run_id }}
  KAFRUST_SOAK_SECONDS: ${{ inputs.duration_seconds }}
  KAFRUST_SOAK_BATCH_SIZE: "100"
  KAFRUST_SOAK_PAYLOAD_BYTES: "1024"

jobs:
  published-multi-soak:
    name: Published kafrust ${{ inputs.kafrust_version }} Kafka 4.3.1 ${{ inputs.fault_mode }} multi-broker restart
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka 4.3.1
        run: |
          docker network create kafrust-published-multi-soak
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-published-multi-soak-${node}" \
              --hostname "kafrust-published-multi-soak-${node}" \
              --network kafrust-published-multi-soak \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-multi-soak-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-multi-soak-1:9093,2@kafrust-published-multi-soak-2:9093,3@kafrust-published-multi-soak-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-multi-soak-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-multi-soak-1:29092 \
              >/tmp/kafrust-published-multi-soak-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-multi-soak-probe.log || true
          docker logs kafrust-published-multi-soak-1
          docker logs kafrust-published-multi-soak-2
          docker logs kafrust-published-multi-soak-3
          exit 1

      - name: Create replicated soak topic
        run: |
          docker exec kafrust-published-multi-soak-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-multi-soak-1:29092 \
            --create \
            --topic "$KAFRUST_TOPIC" \
            --partitions 3 \
            --replication-factor 3

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-multi-soak-smoke"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published multi-broker soak project must be outside the repository"
            exit 1
          fi
          cargo new --bin "$project_dir"
          cp .github/published-multi-soak-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/" \
            .github/published-multi-soak-smoke/Cargo.toml > "$project_dir/Cargo.toml"

      - name: Build published external multi-broker soak
        run: cargo build --release --manifest-path "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.toml"

      - name: Run published multi-broker soak with broker restart
        run: |
          set -euo pipefail
          if [ "$KAFRUST_SOAK_SECONDS" -lt 60 ]; then
            echo "duration_seconds must be at least 60"
            exit 1
          fi
          (
            set -o pipefail
            cargo run --quiet --release --manifest-path "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.toml" \
              | tee published-multi-soak.json
          ) &
          soak_pid=$!
          sleep "$((KAFRUST_SOAK_SECONDS / 3))"
          if [ "${{ inputs.fault_mode }}" = "simultaneous" ]; then
            docker stop -t 1 kafrust-published-multi-soak-1 kafrust-published-multi-soak-2
          else
            docker stop -t 1 kafrust-published-multi-soak-1
          fi
          sleep "${{ inputs.outage_seconds }}"
          if [ "${{ inputs.fault_mode }}" = "simultaneous" ]; then
            docker start kafrust-published-multi-soak-1 kafrust-published-multi-soak-2
          else
            docker start kafrust-published-multi-soak-1
          fi
          wait "$soak_pid"
          test -s published-multi-soak.json
          grep -q '"recovered":true' published-multi-soak.json

      - name: Verify published dependency version
        run: |
          grep -A1 -q 'name = "kafrust"' "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"
          grep -A1 -q 'version = "${{ inputs.kafrust_version }}"' "$RUNNER_TEMP/kafrust-published-multi-soak-smoke/Cargo.lock"

      - name: Upload published multi-broker soak result
        uses: actions/upload-artifact@v6
        with:
          name: kafrust-published-multi-soak-${{ github.run_id }}
          path: published-multi-soak.json
          retention-days: 90

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-published-multi-soak-1 || true
          docker logs kafrust-published-multi-soak-2 || true
          docker logs kafrust-published-multi-soak-3 || true
