name: Published API 74 Configuration Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.2"
      kafka_version:
        description: Kafka version to qualify
        required: true
        type: choice
        default: 4.3.1
        options:
          - "3.9.1"
          - "4.3.1"

permissions:
  contents: read

jobs:
  published-config-resources:
    name: Published kafrust ${{ inputs.kafrust_version }} Kafka ${{ inputs.kafka_version }} API 74
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:39100
      KAFRUST_CONFIG_TOPIC: kafrust-published-config-${{ github.run_id }}
      KAFRUST_EXPECT_LIST_CONFIG_RESOURCES_VERSION: ${{ inputs.kafka_version == '3.9.1' && '0' || '1' }}
      KAFRUST_LIST_CONFIG_RESOURCES_RESOURCE_TYPE: ${{ inputs.kafka_version == '3.9.1' && '16' || '2' }}
      KAFRUST_EXPECT_DESCRIBE_CONFIGS: ${{ inputs.kafka_version == '3.9.1' && 'skip' || '4' }}
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker network create kafrust-published-config-resources
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-published-config-resources-broker \
            --network kafrust-published-config-resources \
            -p 39100:9092 \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-config-resources-broker:29092,EXTERNAL://localhost:39100 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-config-resources-broker:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-config-resources-broker \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-config-resources-broker:29092 \
              >/tmp/kafrust-published-config-resources-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-config-resources-probe.log || true
          docker logs kafrust-published-config-resources-broker
          exit 1

      - name: Create topic for Kafka 4.x configuration inspection
        if: inputs.kafka_version == '4.3.1'
        run: |
          docker exec kafrust-published-config-resources-broker /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-config-resources-broker:29092 \
            --create \
            --topic "$KAFRUST_CONFIG_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-config-resources"
          cargo new --bin "$project_dir"
          cp .github/published-config-resources-smoke/src/main.rs "$project_dir/src/main.rs"
          sed \
            -e "s|__KAFRUST_VERSION__|${KAFRUST_PUBLISHED_VERSION}|" \
            .github/published-config-resources-smoke/Cargo.toml > "$project_dir/Cargo.toml"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published smoke project must be outside the repository"
            exit 1
          fi

      - name: Run published API 74 configuration smoke
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-config-resources"
          cargo run --manifest-path "$project_dir/Cargo.toml" 2>&1 \
            | tee /tmp/kafrust-published-config-resources.log
          grep -Fq "api74 list_version=${KAFRUST_EXPECT_LIST_CONFIG_RESOURCES_VERSION}" \
            /tmp/kafrust-published-config-resources.log
          if [ "${{ inputs.kafka_version }}" = "4.3.1" ]; then
            grep -Fq "describe_documentation=true" /tmp/kafrust-published-config-resources.log
          fi
          grep -A1 -q 'name = "kafrust"' "$project_dir/Cargo.lock"
          grep -A1 -q 'version = "${{ inputs.kafrust_version }}"' "$project_dir/Cargo.lock"

      - name: Dump diagnostics
        if: failure()
        run: |
          cat /tmp/kafrust-published-config-resources.log || true
          docker logs kafrust-published-config-resources-broker || true
