            fi
            sleep 2
          done

          if [ -z "$repeated_partition" ]; then
            cat /tmp/kafrust-multi-repeat-topic.log || true
            exit 1
          fi

          KAFRUST_PARTITION="$repeated_partition" \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example producer_failover \
            >/tmp/kafrust-producer-repeat-failover.log 2>&1 &
          repeat_producer_pid=$!
          KAFRUST_PARTITION="$repeated_partition" \
          KAFRUST_OFFSET=0 \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          RUST_LOG=kafrust=debug cargo run -p kafrust --example consumer_epoch_failover \
            >/tmp/kafrust-consumer-repeat-failover.log 2>&1 &
          repeat_consumer_pid=$!

          repeat_send_seen=""
          repeat_fetch_seen=""
          for attempt in {1..60}; do
            if grep -q "failover before produced" /tmp/kafrust-producer-repeat-failover.log; then
              repeat_send_seen=1
            fi
            if grep -q "failover before fetched" /tmp/kafrust-consumer-repeat-failover.log; then
