            coordinator_node="$(sed -n 's/.*transaction coordinator node \([0-9][0-9]*\)$/\1/p' "$request_log" | tail -n 1)"
            if [ -f "$ready_file" ]; then
              request_ready=1
              break
            fi
            if ! kill -0 "$transaction_admin_pid" 2>/dev/null; then
              cat "$request_log" || true
              wait "$transaction_admin_pid"
            fi
            sleep 0.1
          done
          if ! [[ "$coordinator_node" =~ ^[123]$ ]] || [ -z "$request_ready" ] || \
             ! kill -0 "$transaction_admin_pid" 2>/dev/null; then
            cat "$request_log" || true
            echo "DescribeTransactions request was not held before transmission"
            kill "$transaction_admin_pid" 2>/dev/null || true
            wait "$transaction_admin_pid" || true
            exit 1
          fi

          docker stop "kafrust-kafka-multi-${coordinator_node}"
          touch "$release_file"

          transaction_admin_status=0
          wait "$transaction_admin_pid" || transaction_admin_status=$?
          cat "$request_log"

          docker start "kafrust-kafka-multi-${coordinator_node}"
          coordinator_ready=""
          for attempt in {1..120}; do
            if docker exec "kafrust-kafka-multi-${coordinator_node}" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "kafrust-kafka-multi-${coordinator_node}:29092" \
              >/tmp/kafrust-admin-describe-transactions-recovery.log 2>&1; then
              coordinator_ready=1
              break
            fi
            sleep 2
          done

          if [ "$transaction_admin_status" -ne 0 ] || [ -z "$coordinator_ready" ] || \
             ! grep -Eq "retries=[1-9][0-9]*" "$request_log"; then
            cat /tmp/kafrust-admin-describe-transactions-recovery.log || true
            docker logs "kafrust-kafka-multi-${coordinator_node}"
            echo "Admin DescribeTransactions did not prove retry recovery"
            exit 1
          fi

      - name: Run multi-broker producer and consumer failover through broker stop
        run: |
          KAFRUST_PARTITION="$KAFRUST_FAILOVER_PARTITION" \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example producer_failover \
            >/tmp/kafrust-producer-failover.log 2>&1 &
          producer_pid=$!
          KAFRUST_PARTITION="$KAFRUST_FAILOVER_PARTITION" \
          KAFRUST_OFFSET=0 \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example consumer_failover \
            >/tmp/kafrust-consumer-failover.log 2>&1 &
          consumer_pid=$!

          first_send_seen=""
          first_fetch_seen=""
          for attempt in {1..60}; do
            if grep -q "failover before produced" /tmp/kafrust-producer-failover.log; then
              first_send_seen=1
            fi
            if grep -q "failover before fetched" /tmp/kafrust-consumer-failover.log; then
              first_fetch_seen=1
            fi
            if [ -n "$first_send_seen" ] && [ -n "$first_fetch_seen" ]; then
              break
            fi
            if ! kill -0 "$producer_pid" 2>/dev/null; then
              cat /tmp/kafrust-producer-failover.log || true
              wait "$producer_pid"
            fi
            if ! kill -0 "$consumer_pid" 2>/dev/null; then
              cat /tmp/kafrust-consumer-failover.log || true
              wait "$consumer_pid"
            fi
            sleep 1
          done

          if [ -z "$first_send_seen" ]; then
            echo "producer failover example did not reach the first send"
            cat /tmp/kafrust-producer-failover.log || true
            kill "$producer_pid" 2>/dev/null || true
            kill "$consumer_pid" 2>/dev/null || true
            wait "$producer_pid" || true
            wait "$consumer_pid" || true
            exit 1
          fi
          if [ -z "$first_fetch_seen" ]; then
            echo "consumer failover example did not reach the first fetch"
            cat /tmp/kafrust-consumer-failover.log || true
            kill "$producer_pid" 2>/dev/null || true
            kill "$consumer_pid" 2>/dev/null || true
            wait "$producer_pid" || true
            wait "$consumer_pid" || true
            exit 1
          fi

          docker stop kafrust-kafka-multi-1

          cluster_ready=""
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-2:29092 \
              >/tmp/kafrust-multi-failover-probe.log 2>&1; then
              docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafrust-kafka-multi-2:29092 \
                --describe \
                --topic "$KAFRUST_TOPIC" \
                >/tmp/kafrust-multi-failover-topic.log 2>&1
              if ! grep -Eq "Leader: -1|Leader: none" /tmp/kafrust-multi-failover-topic.log; then
                cluster_ready=1
                break
              fi
            fi
            sleep 2
          done

          if [ -z "$cluster_ready" ]; then
            cat /tmp/kafrust-multi-failover-probe.log || true
            cat /tmp/kafrust-multi-failover-topic.log || true
            docker logs kafrust-kafka-multi-2
            docker logs kafrust-kafka-multi-3
            kill "$producer_pid" 2>/dev/null || true
            kill "$consumer_pid" 2>/dev/null || true
            wait "$producer_pid" || true
            wait "$consumer_pid" || true
            exit 1
          fi

          producer_status=0
          wait "$producer_pid" || producer_status=$?
          consumer_status=0
          wait "$consumer_pid" || consumer_status=$?
          cat /tmp/kafrust-producer-failover.log
          cat /tmp/kafrust-consumer-failover.log
          if [ "$producer_status" -ne 0 ] || [ "$consumer_status" -ne 0 ]; then
            exit 1
          fi

      - name: Run repeated leader failover through a second broker stop
        run: |
          docker start kafrust-kafka-multi-1
          broker_one_ready=""
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-1:29092 \
              >/tmp/kafrust-multi-repeat-probe.log 2>&1; then
