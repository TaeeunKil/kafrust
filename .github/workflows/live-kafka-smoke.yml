      - name: Run multi-broker Admin DescribeProducers during leader stop
        run: |
          docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-multi-2:29092 \
            --describe \
            --topic "$KAFRUST_TOPIC" \
            >/tmp/kafrust-admin-describe-producers-topic.log 2>&1
          describe_leader_node="$(
            awk -v target="$KAFRUST_FAILOVER_PARTITION" \
              '{ for (i = 1; i <= NF; i++) if ($i == "Partition:" && $(i + 1) == target) { for (j = 1; j <= NF; j++) if ($j == "Leader:") { print $(j + 1); exit } } }' \
              /tmp/kafrust-admin-describe-producers-topic.log
          )"
          if ! [[ "$describe_leader_node" =~ ^[123]$ ]]; then
            cat /tmp/kafrust-admin-describe-producers-topic.log
            echo "could not identify the current DescribeProducers leader"
            exit 1
          fi

          ready_file=/tmp/kafrust-admin-describe-producers-ready
          release_file=/tmp/kafrust-admin-describe-producers-release
          request_log=/tmp/kafrust-admin-describe-producers.log
          rm -f "$ready_file" "$release_file" "$request_log"
          KAFRUST_PARTITION="$KAFRUST_FAILOVER_PARTITION" \
          KAFRUST_REQUEST_READY_FILE="$ready_file" \
          KAFRUST_REQUEST_RELEASE_FILE="$release_file" \
          RUST_LOG=kafrust=debug \
          cargo run -p kafrust --example admin_describe_producers_failover \
            >"$request_log" 2>&1 &
          describe_pid=$!

          request_ready=""
          for attempt in {1..600}; do
            if [ -f "$ready_file" ]; then
              request_ready=1
              break
            fi
            if ! kill -0 "$describe_pid" 2>/dev/null; then
              cat "$request_log" || true
              wait "$describe_pid"
            fi
            sleep 0.1
          done
          if [ -z "$request_ready" ] || ! kill -0 "$describe_pid" 2>/dev/null; then
            cat "$request_log" || true
            echo "DescribeProducers request was not held before transmission"
            kill "$describe_pid" 2>/dev/null || true
            wait "$describe_pid" || true
            exit 1
          fi

          docker stop "kafrust-kafka-multi-${describe_leader_node}"
          touch "$release_file"

          describe_status=0
          wait "$describe_pid" || describe_status=$?
          cat "$request_log"

          docker start "kafrust-kafka-multi-${describe_leader_node}"
          describe_leader_ready=""
          for attempt in {1..120}; do
            if docker exec "kafrust-kafka-multi-${describe_leader_node}" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "kafrust-kafka-multi-${describe_leader_node}:29092" \
              >/tmp/kafrust-admin-describe-producers-recovery.log 2>&1; then
              describe_leader_ready=1
              break
            fi
            sleep 2
          done

          if [ "$describe_status" -ne 0 ] || [ -z "$describe_leader_ready" ] || \
             ! grep -Eq "retries=[1-9][0-9]*" "$request_log"; then
            cat /tmp/kafrust-admin-describe-producers-recovery.log || true
            docker logs "kafrust-kafka-multi-${describe_leader_node}"
            echo "Admin DescribeProducers did not prove retry recovery"
            exit 1
          fi

