            cat /tmp/kafrust-producer-repeat-failover.log || true
            cat /tmp/kafrust-consumer-repeat-failover.log || true
            kill "$repeat_producer_pid" 2>/dev/null || true
            kill "$repeat_consumer_pid" 2>/dev/null || true
            wait "$repeat_producer_pid" || true
            wait "$repeat_consumer_pid" || true
            exit 1
          fi

          docker stop kafrust-kafka-multi-2
          repeat_cluster_ready=""
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-1:29092 \
              >/tmp/kafrust-multi-repeat-after-stop-probe.log 2>&1; then
              docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafrust-kafka-multi-1:29092 \
                --describe \
                --topic "$KAFRUST_TOPIC" \
                >/tmp/kafrust-multi-repeat-after-stop-topic.log 2>&1
              if ! grep -Eq "Leader: -1|Leader: none" /tmp/kafrust-multi-repeat-after-stop-topic.log; then
                repeat_cluster_ready=1
                break
              fi
            fi
            sleep 2
          done

          repeat_producer_status=0
          wait "$repeat_producer_pid" || repeat_producer_status=$?
          repeat_consumer_status=0
          wait "$repeat_consumer_pid" || repeat_consumer_status=$?
          cat /tmp/kafrust-producer-repeat-failover.log
          cat /tmp/kafrust-consumer-repeat-failover.log
          if [ "$repeat_producer_status" -ne 0 ] || \
             [ "$repeat_consumer_status" -ne 0 ] || \
             [ -z "$repeat_cluster_ready" ]; then
            cat /tmp/kafrust-multi-repeat-after-stop-probe.log || true
            cat /tmp/kafrust-multi-repeat-after-stop-topic.log || true
            docker logs kafrust-kafka-multi-1
            docker logs kafrust-kafka-multi-3
            exit 1
          fi
          if ! grep -q "recovered fetch after leader epoch transition" /tmp/kafrust-consumer-repeat-failover.log; then
            echo "assigned consumer did not prove automatic leader-epoch recovery"
            exit 1
          fi

          docker start kafrust-kafka-multi-2
          broker_two_ready=""
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-2:29092 \
              >/tmp/kafrust-multi-repeat-recovery.log 2>&1; then
              broker_two_ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$broker_two_ready" ]; then
            cat /tmp/kafrust-multi-repeat-recovery.log || true
            docker logs kafrust-kafka-multi-2
            exit 1
          fi

      - name: Wait for multi-broker Kafka after broker stop
        run: |
