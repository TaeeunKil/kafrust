          release_file=/tmp/kafrust-admin-describe-transactions-release
          request_log=/tmp/kafrust-admin-describe-transactions.log
          rm -f "$ready_file" "$release_file" "$request_log"
          KAFRUST_TRANSACTIONAL_ID="kafrust-transaction-failover-${GITHUB_RUN_ID}" \
          KAFRUST_REQUEST_READY_FILE="$ready_file" \
          KAFRUST_REQUEST_RELEASE_FILE="$release_file" \
          RUST_LOG=kafrust=debug \
