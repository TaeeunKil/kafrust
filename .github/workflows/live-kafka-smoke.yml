name: Live Kafka Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:9092
  KAFRUST_ADMIN_TOPIC: kafrust-admin-smoke
  KAFRUST_GROUP_ID: kafrust-smoke
  KAFRUST_TOPIC: kafrust-smoke

jobs:
  kafka:
    name: Kafka ${{ matrix.kafka-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - 3.7.2
          - 3.8.1
          - 3.9.1
          - 4.3.1
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker run -d --name kafrust-kafka \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            "apache/kafka:${KAFKA_VERSION}"

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-kafka
          exit 1

      - name: Create smoke topic
        run: |
          docker exec kafrust-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Create regex subscription topics
        run: |
          for topic in kafrust-regex-orders kafrust-regex-payments; do
            docker exec kafrust-kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --create \
              --if-not-exists \
              --topic "$topic" \
              --partitions 1 \
              --replication-factor 1
          done

      - name: Run broker roundtrip
        run: cargo test -p kafrust --test broker_roundtrip -- --nocapture

      - name: Run admin topic lifecycle example
        run: cargo run -p kafrust --example admin_create_topic

      - name: Run producer example
        run: cargo run -p kafrust --example producer_send

      - name: Verify topic-ID and flexible Produce negotiation
        env:
          RUST_LOG: kafrust=debug
        run: |
          cargo run -p kafrust --example producer_send 2>&1 | tee /tmp/kafrust-produce-flexible.log
          produce_log="$(sed -E 's/\x1B\[[0-9;]*m//g' /tmp/kafrust-produce-flexible.log)"
          if [[ "${{ matrix.kafka-version }}" == "4.3.1" ]]; then
            expected_versions='produce_version=V13'
          else
            expected_versions='produce_version=V(12|11|9)'
          fi
          if ! grep -Eq "${expected_versions}" <<<"${produce_log}"; then
            cat /tmp/kafrust-produce-flexible.log
            echo "producer did not negotiate the expected Produce version: ${expected_versions}"
            exit 1
          fi

      - name: Run acks=0 producer example
        env:
          KAFRUST_ACKS: none
        run: cargo run -p kafrust --example producer_send

      - name: Run idempotent producer example
        env:
          KAFRUST_ENABLE_IDEMPOTENCE: "true"
        run: cargo run -p kafrust --example producer_send

      - name: Run producer batch example
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run acks=0 producer batch example
        env:
          KAFRUST_ACKS: none
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run idempotent producer batch example
        env:
          KAFRUST_ENABLE_IDEMPOTENCE: "true"
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run gzip producer batch example
        env:
          KAFRUST_COMPRESSION: gzip
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run snappy producer batch example
        env:
          KAFRUST_COMPRESSION: snappy
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run lz4 producer batch example
        env:
          KAFRUST_COMPRESSION: lz4
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run zstd producer batch example
        env:
          KAFRUST_COMPRESSION: zstd
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run buffered producer example
        env:
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run acks=0 buffered producer example
        env:
          KAFRUST_ACKS: none
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run idempotent buffered producer example
        env:
          KAFRUST_ENABLE_IDEMPOTENCE: "true"
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run immediate and buffered transactional producer example
        env:
          KAFRUST_TRANSACTIONAL_ID: kafrust-transactional-smoke-${{ matrix.kafka-version }}
        run: cargo run -p kafrust --example producer_transactional

      - name: Run admin DescribeProducers example
        run: cargo run -p kafrust --example admin_describe_producers

      - name: Run admin DescribeTransactions example
        env:
          KAFRUST_TRANSACTIONAL_ID: kafrust-transactional-smoke-${{ matrix.kafka-version }}
        run: cargo run -p kafrust --example admin_describe_transactions

      - name: Run admin ListTransactions example
        run: cargo run -p kafrust --example admin_list_transactions

      - name: Run direct consumer example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --example consumer_fetch

      - name: Run direct partition queue example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
          KAFRUST_PARTITION_QUEUE_REQUIRE_RECORD: "1"
        run: cargo run -p kafrust --example consumer_partition_queue

      - name: Run consumer group example
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run consumer group automatic commit example
        env:
          KAFRUST_AUTO_COMMIT_INTERVAL_MS: "100"
          KAFRUST_AUTO_COMMIT_REQUIRE_RECORD: "1"
          KAFRUST_GROUP_ID: kafrust-auto-commit-${{ matrix.kafka-version }}-${{ github.run_id }}
        run: cargo run -p kafrust --example consumer_group_auto_commit

      - name: Run consumer group partition queue example
        env:
          KAFRUST_GROUP_ID: kafrust-partition-queue-group-${{ matrix.kafka-version }}-${{ github.run_id }}
          KAFRUST_PARTITION_QUEUE: "1"
          KAFRUST_PARTITION_QUEUE_REQUIRE_RECORD: "1"
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Produce regex subscription smoke record
        env:
          KAFRUST_TOPIC: kafrust-regex-orders
          KAFRUST_KEY: kafrust-regex-key-${{ matrix.kafka-version }}
          KAFRUST_VALUE: kafrust-regex-value-${{ github.run_id }}
        run: cargo run -p kafrust --example producer_send

      - name: Run regex consumer group example
        env:
          KAFRUST_COMMIT_WORKER: "1"
          KAFRUST_COMMIT_WORKER_INTERVAL_MS: "100"
          KAFRUST_GROUP_ID: kafrust-regex-${{ matrix.kafka-version }}-${{ github.run_id }}
          KAFRUST_TOPIC_PATTERN: '^kafrust-regex-(orders|payments)$'
          KAFRUST_REGEX_EXPECTED_TOPICS: kafrust-regex-orders,kafrust-regex-payments
        run: cargo run -p kafrust --example consumer_group_regex

      - name: Run KIP-848 regex consumer group example
        if: matrix.kafka-version == '4.3.1'
        env:
          KAFRUST_COMMIT_WORKER: "1"
          KAFRUST_COMMIT_WORKER_INTERVAL_MS: "100"
          KAFRUST_GROUP_ID: kafrust-regex-kip848-${{ github.run_id }}
          KAFRUST_GROUP_PROTOCOL: consumer
          KAFRUST_TOPIC_PATTERN: '^kafrust-regex-(orders|payments)$'
          KAFRUST_REGEX_EXPECTED_TOPICS: kafrust-regex-orders,kafrust-regex-payments
        run: cargo run -p kafrust --example consumer_group_regex

      - name: Run KIP-848 consumer group example
        if: matrix.kafka-version == '4.3.1'
        env:
          KAFRUST_GROUP_ID: kafrust-consumer-protocol-${{ matrix.kafka-version }}-${{ github.run_id }}
          KAFRUST_GROUP_PROTOCOL: consumer
          KAFRUST_PARTITION_QUEUE: "1"
          KAFRUST_PARTITION_QUEUE_REQUIRE_RECORD: "1"
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run KIP-848 automatic commit example
        if: matrix.kafka-version == '4.3.1'
        env:
          KAFRUST_AUTO_COMMIT_INTERVAL_MS: "100"
          KAFRUST_AUTO_COMMIT_REQUIRE_RECORD: "1"
          KAFRUST_GROUP_ID: kafrust-auto-commit-kip848-${{ github.run_id }}
          KAFRUST_GROUP_PROTOCOL: consumer
        run: cargo run -p kafrust --example consumer_group_auto_commit

      - name: Run KIP-848 background heartbeat rejoin example
        if: matrix.kafka-version == '4.3.1'
        env:
          KAFRUST_GROUP_ID: kafrust-consumer-heartbeat-${{ matrix.kafka-version }}-${{ github.run_id }}
          KAFRUST_GROUP_PROTOCOL: consumer
        run: cargo run -p kafrust --example consumer_group_heartbeat_rejoin

      - name: Run consumer group offset reset example
        env:
          KAFRUST_GROUP_ID: kafrust-offset-reset-${{ matrix.kafka-version }}
          KAFRUST_TOPIC: kafrust-offset-reset-${{ matrix.kafka-version }}-${{ github.run_id }}
        run: |
          docker exec kafrust-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1
          cargo run -p kafrust --example consumer_group_offset_reset

      - name: Run consumer position and watermark control example
        env:
          KAFRUST_GROUP_ID: kafrust-position-control-${{ matrix.kafka-version }}
        run: cargo run -p kafrust --example consumer_position_control

      - name: Run background heartbeat rejoin example
        env:
          KAFRUST_GROUP_ID: kafrust-heartbeat-rejoin-${{ matrix.kafka-version }}
        run: cargo run -p kafrust --example consumer_group_heartbeat_rejoin

      - name: Run static consumer group example
        env:
          KAFRUST_GROUP_ID: kafrust-static-${{ matrix.kafka-version }}
          KAFRUST_GROUP_INSTANCE_ID: kafrust-static-member-1
          KAFRUST_ASSIGNMENT_STRATEGY: roundrobin
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run admin describe group example
        run: cargo run -p kafrust --example admin_describe_group

      - name: Run admin consumer group offsets example
        env:
          KAFRUST_ADMIN_OFFSET: "0"
        run: cargo run -p kafrust --example admin_consumer_group_offsets

      - name: Run admin delete group offsets example
        run: cargo run -p kafrust --example admin_delete_group_offsets

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-kafka

  kafka-kip848:
    name: Kafka 4.3.1 KIP-848
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:9092
      KAFRUST_GROUP_PROTOCOL: consumer
      KAFRUST_GROUP_ID: kafrust-kip848-${{ github.run_id }}
      KAFRUST_TOPIC: kafrust-kip848

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka 4.3.1
        run: |
          docker run -d --name kafrust-kafka-kip848 \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:4.3.1

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-kafka-kip848
          exit 1

      - name: Create KIP-848 smoke topic
        run: |
          docker exec kafrust-kafka-kip848 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Wait for group coordinator
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-kafka-kip848 /opt/kafka/bin/kafka-consumer-groups.sh \
              --bootstrap-server localhost:9092 \
              --list >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-kafka-kip848
          exit 1

      - name: Run KIP-848 foreground path
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run KIP-848 committed offset fetch path
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run KIP-848 member-aware admin offset path
        env:
          KAFRUST_GROUP_ID: kafrust-kip848-admin-offsets-${{ github.run_id }}
          KAFRUST_ADMIN_OFFSET: "0"
        run: cargo run -p kafrust --example admin_consumer_group_offsets_member

      - name: Run KIP-848 background heartbeat rejoin path
        run: cargo run -p kafrust --example consumer_group_heartbeat_rejoin

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-kafka-kip848

  kafka-kip848-multi-broker-failover:
    name: Kafka 4.3.1 multi-broker KIP-848 failover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:19192,localhost:19193,localhost:19194
      KAFRUST_EXPECTED_BROKERS: "3"
      KAFRUST_GROUP_PROTOCOL: consumer
      KAFRUST_GROUP_ID: kafrust-kip848-failover-${{ github.run_id }}
      KAFRUST_TOPIC: kafrust-kip848-failover-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start multi-broker Kafka 4.3.1
        run: |
          docker network create kafrust-kip848-multi
          KAFKA_CLUSTER_ID="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19191 + node))
            docker run -d --name "kafrust-kafka-kip848-multi-${node}" \
              --network kafrust-kip848-multi \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${KAFKA_CLUSTER_ID}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-kafka-kip848-multi-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-kafka-kip848-multi-1:9093,2@kafrust-kafka-kip848-multi-2:9093,3@kafrust-kafka-kip848-multi-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:4.3.1
          done

      - name: Wait for multi-broker Kafka 4.3.1
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-kip848-multi-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-kip848-multi-1:29092 \
              >/tmp/kafrust-kip848-multi-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-kip848-multi-probe.log || true
          docker logs kafrust-kafka-kip848-multi-1
          docker logs kafrust-kafka-kip848-multi-2
          docker logs kafrust-kafka-kip848-multi-3
          exit 1

      - name: Create KIP-848 failover topic
        run: |
          docker exec kafrust-kafka-kip848-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-kip848-multi-1:29092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 3 \
            --replication-factor 3

      - name: Build KIP-848 failover example
        run: cargo build -p kafrust --example consumer_group_failover

      - name: Run KIP-848 coordinator failover
        run: |
          KAFRUST_PARTITION_QUEUE=1 \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example consumer_group_failover \
            >/tmp/kafrust-kip848-failover.log 2>&1 &
          group_pid=$!

          coordinator_node=""
          before_seen=""
          for attempt in {1..120}; do
            coordinator_node="$(
              sed -n 's/.*coordinator node \([0-9][0-9]*\)$/\1/p' \
                /tmp/kafrust-kip848-failover.log | tail -n 1
            )"
            if grep -q "consumer group failover before polled" /tmp/kafrust-kip848-failover.log; then
              before_seen=1
            fi
            if [ -n "$coordinator_node" ] && [ -n "$before_seen" ]; then
              break
            fi
            if ! kill -0 "$group_pid" 2>/dev/null; then
              cat /tmp/kafrust-kip848-failover.log || true
              wait "$group_pid"
            fi
            sleep 1
          done

          if ! [[ "$coordinator_node" =~ ^[123]$ ]] || [ -z "$before_seen" ]; then
            echo "KIP-848 failover example did not reach its first poll"
            cat /tmp/kafrust-kip848-failover.log || true
            kill "$group_pid" 2>/dev/null || true
            wait "$group_pid" || true
            exit 1
          fi

          coordinator_container="kafrust-kafka-kip848-multi-${coordinator_node}"
          docker stop "$coordinator_container"

          group_status=0
          wait "$group_pid" || group_status=$?
          cat /tmp/kafrust-kip848-failover.log

          docker start "$coordinator_container"
          coordinator_ready=""
          for attempt in {1..120}; do
            if docker exec "$coordinator_container" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "${coordinator_container}:29092" \
              >/tmp/kafrust-kip848-coordinator-recovery.log 2>&1; then
              coordinator_ready=1
              break
            fi
            sleep 2
          done

          if [ "$group_status" -ne 0 ] || [ -z "$coordinator_ready" ]; then
            cat /tmp/kafrust-kip848-coordinator-recovery.log || true
            docker logs "$coordinator_container"
            exit 1
          fi

      - name: Run KIP-848 member-aware admin offset path
        env:
          KAFRUST_GROUP_ID: kafrust-kip848-admin-offsets-${{ github.run_id }}
          KAFRUST_ADMIN_OFFSET: "0"
        run: cargo run -p kafrust --example admin_consumer_group_offsets_member

      - name: Dump KIP-848 multi-broker Kafka logs
        if: failure()
        run: |
          cat /tmp/kafrust-kip848-failover.log || true
          docker logs kafrust-kafka-kip848-multi-1
          docker logs kafrust-kafka-kip848-multi-2
          docker logs kafrust-kafka-kip848-multi-3

  kafka-kip848-sasl-multi-failover:
    name: Kafka 4.3.1 multi-broker SASL_PLAINTEXT KIP-848 failover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:19392,localhost:19393,localhost:19394
      KAFRUST_SECURITY_PROTOCOL: sasl_plaintext
      KAFRUST_SASL_MECHANISM: plain
      KAFRUST_SASL_USERNAME: kafrust
      KAFRUST_SASL_PASSWORD: kafrust-secret
      KAFRUST_EXPECTED_BROKERS: "3"
      KAFRUST_GROUP_PROTOCOL: consumer
      KAFRUST_GROUP_ID: kafrust-kip848-sasl-failover-${{ github.run_id }}
      KAFRUST_TOPIC: kafrust-kip848-sasl-failover-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Write SASL config
        run: |
          mkdir -p sasl-kip848
          cat > sasl-kip848/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.plain.PlainLoginModule required
            username="broker"
            password="broker-secret"
            user_kafrust="kafrust-secret";
          };
          EOF
          chmod 644 sasl-kip848/kafka_server_jaas.conf

      - name: Start multi-broker Kafka 4.3.1 with SASL_PLAINTEXT
        run: |
          docker network create kafrust-kip848-sasl
          KAFKA_CLUSTER_ID="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19391 + node))
            docker run -d --name "kafrust-kafka-kip848-sasl-${node}" \
              --network kafrust-kip848-sasl \
              -p "${external_port}:9092" \
              -v "$PWD/sasl-kip848:/etc/kafka/secrets:ro" \
              -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
              -e KAFKA_CLUSTER_ID="${KAFKA_CLUSTER_ID}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-kafka-kip848-sasl-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-kafka-kip848-sasl-1:9093,2@kafrust-kafka-kip848-sasl-2:9093,3@kafrust-kafka-kip848-sasl-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              -e KAFKA_SASL_ENABLED_MECHANISMS=PLAIN \
              -e KAFKA_DELEGATION_TOKEN_SECRET_KEY=kafrust-delegation-secret \
              apache/kafka:4.3.1
          done

      - name: Wait for multi-broker Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-kip848-sasl-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-kip848-sasl-1:29092 \
              >/tmp/kafrust-kip848-sasl-startup.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-kip848-sasl-startup.log || true
          docker logs kafrust-kafka-kip848-sasl-1
          docker logs kafrust-kafka-kip848-sasl-2
          docker logs kafrust-kafka-kip848-sasl-3
          exit 1

      - name: Create KIP-848 SASL topic
        run: |
          docker exec kafrust-kafka-kip848-sasl-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-kip848-sasl-1:29092 \
            --create \
            --topic "$KAFRUST_TOPIC" \
            --partitions 3 \
            --replication-factor 3

      - name: Run delegation token lifecycle
        env:
          KAFRUST_DELEGATION_TOKEN_RENEWER: User:kafrust
        run: cargo run -p kafrust --example admin_delegation_tokens

      - name: Build KIP-848 SASL failover example
        run: cargo build -p kafrust --example consumer_group_failover

      - name: Run KIP-848 SASL coordinator failover
        run: |
          KAFRUST_PARTITION_QUEUE=1 \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example consumer_group_failover \
            >/tmp/kafrust-kip848-sasl-failover.log 2>&1 &
          group_pid=$!

          coordinator_node=""
          before_seen=""
          for attempt in {1..120}; do
            coordinator_node="$(
              sed -n 's/.*coordinator node \([0-9][0-9]*\)$/\1/p' \
                /tmp/kafrust-kip848-sasl-failover.log | tail -n 1
            )"
            if grep -q "consumer group failover before polled" /tmp/kafrust-kip848-sasl-failover.log; then
              before_seen=1
            fi
            if [ -n "$coordinator_node" ] && [ -n "$before_seen" ]; then
              break
            fi
            if ! kill -0 "$group_pid" 2>/dev/null; then
              cat /tmp/kafrust-kip848-sasl-failover.log || true
              wait "$group_pid"
            fi
            sleep 1
          done

          if ! [[ "$coordinator_node" =~ ^[123]$ ]] || [ -z "$before_seen" ]; then
            echo "KIP-848 SASL failover example did not reach its first poll"
            cat /tmp/kafrust-kip848-sasl-failover.log || true
            kill "$group_pid" 2>/dev/null || true
            wait "$group_pid" || true
            exit 1
          fi

          coordinator_container="kafrust-kafka-kip848-sasl-${coordinator_node}"
          docker stop "$coordinator_container"

          group_status=0
          wait "$group_pid" || group_status=$?
          cat /tmp/kafrust-kip848-sasl-failover.log

          docker start "$coordinator_container"
          coordinator_ready=""
          for attempt in {1..120}; do
            if docker exec "$coordinator_container" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "${coordinator_container}:29092" \
              >/tmp/kafrust-kip848-sasl-recovery.log 2>&1; then
              coordinator_ready=1
              break
            fi
            sleep 2
          done

          if [ "$group_status" -ne 0 ] || [ -z "$coordinator_ready" ]; then
            cat /tmp/kafrust-kip848-sasl-recovery.log || true
            docker logs "$coordinator_container"
            exit 1
          fi

      - name: Run KIP-848 SASL member-aware admin offset path
        env:
          KAFRUST_GROUP_ID: kafrust-kip848-admin-offsets-sasl-${{ github.run_id }}
          KAFRUST_ADMIN_OFFSET: "0"
        run: cargo run -p kafrust --example admin_consumer_group_offsets_member

      - name: Dump KIP-848 SASL Kafka logs
        if: failure()
        run: |
          cat /tmp/kafrust-kip848-sasl-failover.log || true
          docker logs kafrust-kafka-kip848-sasl-1
          docker logs kafrust-kafka-kip848-sasl-2
          docker logs kafrust-kafka-kip848-sasl-3

      - name: Upload KIP-848 SASL diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kip848-sasl-failover-diagnostics-${{ github.run_id }}
          path: /tmp/kafrust-kip848-sasl-*.log
          if-no-files-found: ignore

  kafka-kip848-sasl-ssl-scram-multi-failover:
    name: Kafka 4.3.1 multi-broker SASL_SSL SCRAM KIP-848 failover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:19405,localhost:19406,localhost:19407
      KAFRUST_SECURITY_PROTOCOL: sasl_tls
      KAFRUST_SASL_MECHANISM: scram-sha-256
      KAFRUST_SASL_USERNAME: kafrust
      KAFRUST_SASL_PASSWORD: kafrust-secret
      KAFRUST_TLS_SERVER_NAME: localhost
      KAFRUST_TLS_ROOT_CERT_DER_PATH: ${{ github.workspace }}/sasl-ssl-kip848/ca.der
      KAFRUST_GROUP_PROTOCOL: consumer
      KAFRUST_EXPECTED_BROKERS: "3"
      KAFRUST_GROUP_ID: kafrust-kip848-scram-failover-${{ github.run_id }}
      KAFRUST_TOPIC: kafrust-kip848-scram-failover-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate shared TLS certificates
        run: |
          mkdir -p sasl-ssl-kip848
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -subj "/CN=kafrust-test-ca" \
            -keyout sasl-ssl-kip848/ca.key \
            -out sasl-ssl-kip848/ca.crt
          openssl x509 \
            -in sasl-ssl-kip848/ca.crt \
            -outform DER \
            -out sasl-ssl-kip848/ca.der
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout sasl-ssl-kip848/server.key \
            -out sasl-ssl-kip848/server.csr
          openssl x509 -req \
            -in sasl-ssl-kip848/server.csr \
            -CA sasl-ssl-kip848/ca.crt \
            -CAkey sasl-ssl-kip848/ca.key \
            -CAcreateserial \
            -days 1 \
            -sha256 \
            -copy_extensions copy \
            -out sasl-ssl-kip848/server.crt
          openssl pkcs12 -export \
            -in sasl-ssl-kip848/server.crt \
            -inkey sasl-ssl-kip848/server.key \
            -certfile sasl-ssl-kip848/ca.crt \
            -name localhost \
            -out sasl-ssl-kip848/kafka.server.keystore.p12 \
            -password pass:kafrust
          keytool -importcert \
            -noprompt \
            -alias kafrust-test-ca \
            -file sasl-ssl-kip848/ca.crt \
            -keystore sasl-ssl-kip848/kafka.client.truststore.p12 \
            -storetype PKCS12 \
            -storepass kafrust
          printf kafrust > sasl-ssl-kip848/keystore-password
          printf kafrust > sasl-ssl-kip848/key-password
          chmod 644 sasl-ssl-kip848/*

      - name: Write SCRAM broker config
        run: |
          cat > sasl-ssl-kip848/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.scram.ScramLoginModule required
            username="broker"
            password="broker-secret";
          };
          EOF
          chmod 644 sasl-ssl-kip848/kafka_server_jaas.conf

      - name: Start multi-broker Kafka 4.3.1 with SASL_SSL SCRAM
        run: |
          docker network create kafrust-kip848-sasl-ssl
          KAFKA_CLUSTER_ID="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19404 + node))
            docker run -d --name "kafrust-kip848-scram-${node}" \
              --hostname "kafrust-kip848-scram-${node}" \
              --network kafrust-kip848-sasl-ssl \
              -p "${external_port}:9095" \
              -v "$PWD/sasl-ssl-kip848:/etc/kafka/secrets:ro" \
              -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
              -e KAFKA_CLUSTER_ID="${KAFKA_CLUSTER_ID}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,SASL_SSL://:9095,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-kip848-scram-${node}:29092,SASL_SSL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL_SSL:SASL_SSL \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-kip848-scram-1:9093,2@kafrust-kip848-scram-2:9093,3@kafrust-kip848-scram-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              -e KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-256,SCRAM-SHA-512 \
              -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
              -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
              -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
              -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
              -e KAFKA_SSL_CLIENT_AUTH=none \
              apache/kafka:4.3.1
          done

      - name: Wait for multi-broker Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kip848-scram-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kip848-scram-1:29092 \
              >/tmp/kafrust-kip848-scram-startup.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-kip848-scram-startup.log || true
          docker logs kafrust-kip848-scram-1
          docker logs kafrust-kip848-scram-2
          docker logs kafrust-kip848-scram-3
          exit 1

      - name: Create SCRAM user and replicated topic
        run: |
          docker exec kafrust-kip848-scram-1 /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-kip848-scram-1:29092 \
            --alter \
            --add-config 'SCRAM-SHA-256=[iterations=4096,password=kafrust-secret]' \
            --entity-type users \
            --entity-name kafrust
          docker exec kafrust-kip848-scram-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kip848-scram-1:29092 \
            --create \
            --topic "$KAFRUST_TOPIC" \
            --partitions 3 \
            --replication-factor 3

      - name: Verify external TLS listeners
        run: |
          for port in 19405 19406 19407; do
            openssl s_client \
              -connect "127.0.0.1:${port}" \
              -servername localhost \
              -CAfile sasl-ssl-kip848/ca.crt \
              -verify_return_error \
              </dev/null >/tmp/kafrust-kip848-scram-tls-${port}.log 2>&1
          done

      - name: Build KIP-848 SCRAM failover example
        run: cargo build -p kafrust --features tls --example consumer_group_failover

      - name: Run KIP-848 SCRAM coordinator failover
        run: |
          KAFRUST_PARTITION_QUEUE=1 \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --features tls --example consumer_group_failover \
            >/tmp/kafrust-kip848-scram-failover.log 2>&1 &
          group_pid=$!

          coordinator_node=""
          before_seen=""
          for attempt in {1..120}; do
            coordinator_node="$(
              sed -n 's/.*coordinator node \([0-9][0-9]*\)$/\1/p' \
                /tmp/kafrust-kip848-scram-failover.log | tail -n 1
            )"
            if grep -q "consumer group failover before polled" /tmp/kafrust-kip848-scram-failover.log; then
              before_seen=1
            fi
            if [ -n "$coordinator_node" ] && [ -n "$before_seen" ]; then
              break
            fi
            if ! kill -0 "$group_pid" 2>/dev/null; then
              cat /tmp/kafrust-kip848-scram-failover.log || true
              wait "$group_pid"
            fi
            sleep 1
          done

          if ! [[ "$coordinator_node" =~ ^[123]$ ]] || [ -z "$before_seen" ]; then
            echo "KIP-848 SCRAM failover example did not reach its first poll"
            cat /tmp/kafrust-kip848-scram-failover.log || true
            kill "$group_pid" 2>/dev/null || true
            wait "$group_pid" || true
            exit 1
          fi

          coordinator_container="kafrust-kip848-scram-${coordinator_node}"
          docker stop "$coordinator_container"

          group_status=0
          wait "$group_pid" || group_status=$?
          cat /tmp/kafrust-kip848-scram-failover.log

          docker start "$coordinator_container"
          coordinator_ready=""
          for attempt in {1..120}; do
            if docker exec "$coordinator_container" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "${coordinator_container}:29092" \
              >/tmp/kafrust-kip848-scram-recovery.log 2>&1; then
              coordinator_ready=1
              break
            fi
            sleep 2
          done

          if [ "$group_status" -ne 0 ] || [ -z "$coordinator_ready" ]; then
            cat /tmp/kafrust-kip848-scram-recovery.log || true
            docker logs "$coordinator_container"
            exit 1
          fi

      - name: Run KIP-848 SCRAM member-aware admin offset path
        env:
          KAFRUST_GROUP_ID: kafrust-kip848-admin-offsets-scram-${{ github.run_id }}
          KAFRUST_ADMIN_OFFSET: "0"
        run: cargo run -p kafrust --features tls --example admin_consumer_group_offsets_member

      - name: Dump KIP-848 SCRAM Kafka logs
        if: failure()
        run: |
          cat /tmp/kafrust-kip848-scram-failover.log || true
          docker logs kafrust-kip848-scram-1
          docker logs kafrust-kip848-scram-2
          docker logs kafrust-kip848-scram-3

      - name: Upload KIP-848 SCRAM diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kip848-scram-failover-diagnostics-${{ github.run_id }}
          path: /tmp/kafrust-kip848-scram-*.log
          if-no-files-found: ignore

  kafka-multi-broker:
    name: Kafka 3.7.2 multi-broker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
      KAFRUST_ADMIN_TOPIC: kafrust-admin-smoke-multi
      KAFRUST_EXPECTED_BROKERS: "3"
      KAFRUST_GROUP_ID: kafrust-smoke-multi
      KAFRUST_TOPIC: kafrust-smoke-multi

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start multi-broker Kafka
        run: |
          docker network create kafrust-multi
          KAFKA_CLUSTER_ID="$(docker run --rm apache/kafka:3.7.2 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            case "$node" in
              1) broker_rack=rack-a ;;
              2) broker_rack=rack-b ;;
              3) broker_rack=rack-c ;;
            esac
            docker run -d --name "kafrust-kafka-multi-${node}" \
              --network kafrust-multi \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${KAFKA_CLUSTER_ID}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-kafka-multi-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-kafka-multi-1:9093,2@kafrust-kafka-multi-2:9093,3@kafrust-kafka-multi-3:9093 \
              -e KAFKA_BROKER_RACK="${broker_rack}" \
              -e KAFKA_LOG_DIRS=/tmp/kafka-logs,/tmp/kafka-logs-2 \
              -e KAFKA_REPLICA_SELECTOR_CLASS=org.apache.kafka.common.replica.RackAwareReplicaSelector \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:3.7.2
          done

      - name: Wait for multi-broker Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-1:29092 \
              >/tmp/kafrust-multi-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-multi-probe.log || true
          docker logs kafrust-kafka-multi-1
          docker logs kafrust-kafka-multi-2
          docker logs kafrust-kafka-multi-3
          exit 1

      - name: Create multi-broker smoke topic
        run: |
          docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-multi-1:29092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 6 \
            --replication-factor 3
          docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-multi-1:29092 \
            --describe \
            --topic "$KAFRUST_TOPIC" \
            | tee /tmp/kafrust-multi-topic.log
          failover_partition="$(awk '/Partition:/ && /Leader: 1/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-multi-topic.log)"
          if [ -z "$failover_partition" ]; then
            echo "could not find a partition led by broker 1"
            cat /tmp/kafrust-multi-topic.log
            exit 1
          fi
          echo "KAFRUST_FAILOVER_PARTITION=${failover_partition}" >> "$GITHUB_ENV"
          rack_partition="$(awk '/Partition:/ && !/Leader: 1/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-multi-topic.log)"
          if [ -z "$rack_partition" ]; then
            echo "could not find a partition led by a non-rack-a broker"
            cat /tmp/kafrust-multi-topic.log
            exit 1
          fi
          echo "KAFRUST_RACK_PARTITION=${rack_partition}" >> "$GITHUB_ENV"

      - name: Run multi-broker roundtrip
        run: cargo test -p kafrust --test broker_roundtrip -- --nocapture

      - name: Run multi-broker roundtrip example
        run: cargo run -p kafrust --example broker_roundtrip

      - name: Run multi-broker admin topic lifecycle example
        env:
          KAFRUST_ADMIN_PARTITIONS: "3"
          KAFRUST_ADMIN_REPLICATION_FACTOR: "3"
        run: cargo run -p kafrust --example admin_create_topic

      - name: Run multi-broker producer example
        env:
          KAFRUST_KEY: abc
          KAFRUST_EXPECT_PARTITION: "3"
        run: cargo run -p kafrust --example producer_send

      - name: Run multi-broker keyless producer rotation example
        env:
          KAFRUST_EXPECT_PARTITIONS: "0,1,2,3,4,5,0"
        run: cargo run -p kafrust --example producer_keyless

      - name: Run multi-broker producer batch example
        env:
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker gzip producer batch example
        env:
          KAFRUST_COMPRESSION: gzip
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker snappy producer batch example
        env:
          KAFRUST_COMPRESSION: snappy
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker lz4 producer batch example
        env:
          KAFRUST_COMPRESSION: lz4
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker zstd producer batch example
        env:
          KAFRUST_COMPRESSION: zstd
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker buffered producer example
        env:
