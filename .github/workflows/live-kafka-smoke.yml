      - name: Move a disposable replica to a second log directory
        env:
          KAFRUST_REPLICA_LOG_DIR_BROKER: "1"
          KAFRUST_REPLICA_LOG_DIR_TOPIC: ${{ env.KAFRUST_TOPIC }}
          KAFRUST_REPLICA_LOG_DIR_PARTITION: ${{ env.KAFRUST_FAILOVER_PARTITION }}
          KAFRUST_REPLICA_LOG_DIR_DESTINATION: /tmp/kafka-logs-2
        run: cargo run -p kafrust --example admin_alter_replica_log_dirs

      - name: Verify replica directory movement completed
        env:
          KAFRUST_LOG_DIR_BROKERS: "1"
          KAFRUST_LOG_DIR_TOPIC: ${{ env.KAFRUST_TOPIC }}
          KAFRUST_LOG_DIR_PARTITION: ${{ env.KAFRUST_FAILOVER_PARTITION }}
        run: |
          for attempt in {1..60}; do
            output="$(cargo run -p kafrust --example admin_describe_log_dirs 2>&1)"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -q 'future=false path=/tmp/kafka-logs-2'; then
              exit 0
            fi
            sleep 1
          done
          echo "replica directory movement did not complete"
          exit 1

      - name: Wait for all replicas to leave under-replicated state
        run: |
          for attempt in {1..60}; do
            if docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafrust-kafka-multi-1:29092 \
              --describe \
              --under-replicated-partitions \
              >/tmp/kafrust-under-replicated.log 2>&1; then
              if [ ! -s /tmp/kafrust-under-replicated.log ]; then
                exit 0
              fi
            fi
            cat /tmp/kafrust-under-replicated.log || true
            sleep 2
          done
          echo "replicas remained under-replicated before transaction failover"
          cat /tmp/kafrust-under-replicated.log || true
          exit 1

      - name: Run transaction coordinator failover through broker stop
        run: |
          KAFRUST_TRANSACTIONAL_ID="kafrust-transaction-failover-${GITHUB_RUN_ID}" \
          KAFRUST_FAILOVER_PAUSE_MS=10000 \
          cargo run -p kafrust --example producer_transaction_failover \
            >/tmp/kafrust-transaction-failover.log 2>&1 &
          transaction_pid=$!

          coordinator_node=""
          for attempt in {1..90}; do
            coordinator_node="$(
              sed -n 's/.*coordinator node \([0-9][0-9]*\)$/\1/p' \
                /tmp/kafrust-transaction-failover.log \
                | tail -n 1
            )"
            if [ -n "$coordinator_node" ]; then
              break
            fi
            if ! kill -0 "$transaction_pid" 2>/dev/null; then
              cat /tmp/kafrust-transaction-failover.log || true
              wait "$transaction_pid"
            fi
            sleep 1
          done

          if ! [[ "$coordinator_node" =~ ^[123]$ ]]; then
            echo "transaction failover example did not report a valid coordinator"
            cat /tmp/kafrust-transaction-failover.log || true
            kill "$transaction_pid" 2>/dev/null || true
            wait "$transaction_pid" || true
            exit 1
          fi

          coordinator_container="kafrust-kafka-multi-${coordinator_node}"
          docker stop "$coordinator_container"

          transaction_status=0
          wait "$transaction_pid" || transaction_status=$?
          cat /tmp/kafrust-transaction-failover.log

          docker start "$coordinator_container"
          coordinator_ready=""
          for attempt in {1..120}; do
            if docker exec "$coordinator_container" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server "${coordinator_container}:29092" \
              >/tmp/kafrust-transaction-coordinator-recovery.log 2>&1; then
              coordinator_ready=1
              break
            fi
            sleep 2
          done

          if [ "$transaction_status" -ne 0 ] || [ -z "$coordinator_ready" ]; then
            cat /tmp/kafrust-transaction-coordinator-recovery.log || true
            docker logs "$coordinator_container"
            exit 1
          fi

      - name: Run multi-broker admin DescribeTransactions example
        env:
