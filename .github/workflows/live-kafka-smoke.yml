name: Live Kafka Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:9092
  KAFRUST_ADMIN_TOPIC: kafrust-admin-smoke
  KAFRUST_GROUP_ID: kafrust-smoke
  KAFRUST_TOPIC: kafrust-smoke

jobs:
  kafka:
    name: Kafka ${{ matrix.kafka-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - 3.7.2
          - 4.3.1
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start Kafka
        run: |
          docker run -d --name kafrust-kafka \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            "apache/kafka:${KAFKA_VERSION}"

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafrust-kafka
          exit 1

      - name: Create smoke topic
        run: |
          docker exec kafrust-kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Run broker roundtrip
        run: cargo test -p kafrust --test broker_roundtrip -- --nocapture

      - name: Run admin topic lifecycle example
        run: cargo run -p kafrust --example admin_create_topic

      - name: Run producer example
        run: cargo run -p kafrust --example producer_send

      - name: Run idempotent producer example
        env:
          KAFRUST_ENABLE_IDEMPOTENCE: "true"
        run: cargo run -p kafrust --example producer_send

      - name: Run producer batch example
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run idempotent producer batch example
        env:
          KAFRUST_ENABLE_IDEMPOTENCE: "true"
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run gzip producer batch example
        env:
          KAFRUST_COMPRESSION: gzip
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run snappy producer batch example
        env:
          KAFRUST_COMPRESSION: snappy
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run lz4 producer batch example
        env:
          KAFRUST_COMPRESSION: lz4
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run zstd producer batch example
        env:
          KAFRUST_COMPRESSION: zstd
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run buffered producer example
        env:
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run idempotent buffered producer example
        env:
          KAFRUST_ENABLE_IDEMPOTENCE: "true"
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run transactional producer commit and abort example
        env:
          KAFRUST_TRANSACTIONAL_ID: kafrust-transactional-smoke-${{ matrix.kafka-version }}
        run: cargo run -p kafrust --example producer_transactional

      - name: Run direct consumer example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --example consumer_fetch

      - name: Run consumer group example
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run admin describe group example
        run: cargo run -p kafrust --example admin_describe_group

      - name: Run admin delete group offsets example
        run: cargo run -p kafrust --example admin_delete_group_offsets

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-kafka

  kafka-multi-broker:
    name: Kafka 3.7.2 multi-broker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:19092,localhost:19093,localhost:19094
      KAFRUST_ADMIN_TOPIC: kafrust-admin-smoke-multi
      KAFRUST_EXPECTED_BROKERS: "3"
      KAFRUST_GROUP_ID: kafrust-smoke-multi
      KAFRUST_TOPIC: kafrust-smoke-multi

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start multi-broker Kafka
        run: |
          docker network create kafrust-multi
          KAFKA_CLUSTER_ID="$(docker run --rm apache/kafka:3.7.2 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((19091 + node))
            docker run -d --name "kafrust-kafka-multi-${node}" \
              --network kafrust-multi \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${KAFKA_CLUSTER_ID}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-kafka-multi-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-kafka-multi-1:9093,2@kafrust-kafka-multi-2:9093,3@kafrust-kafka-multi-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              apache/kafka:3.7.2
          done

      - name: Wait for multi-broker Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-1:29092 \
              >/tmp/kafrust-multi-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-multi-probe.log || true
          docker logs kafrust-kafka-multi-1
          docker logs kafrust-kafka-multi-2
          docker logs kafrust-kafka-multi-3
          exit 1

      - name: Create multi-broker smoke topic
        run: |
          docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-multi-1:29092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 6 \
            --replication-factor 3
          docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-kafka-multi-1:29092 \
            --describe \
            --topic "$KAFRUST_TOPIC" \
            | tee /tmp/kafrust-multi-topic.log
          failover_partition="$(awk '/Partition:/ && /Leader: 1/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-multi-topic.log)"
          if [ -z "$failover_partition" ]; then
            echo "could not find a partition led by broker 1"
            cat /tmp/kafrust-multi-topic.log
            exit 1
          fi
          echo "KAFRUST_FAILOVER_PARTITION=${failover_partition}" >> "$GITHUB_ENV"

      - name: Run multi-broker roundtrip
        run: cargo test -p kafrust --test broker_roundtrip -- --nocapture

      - name: Run multi-broker roundtrip example
        run: cargo run -p kafrust --example broker_roundtrip

      - name: Run multi-broker admin topic lifecycle example
        env:
          KAFRUST_ADMIN_PARTITIONS: "3"
          KAFRUST_ADMIN_REPLICATION_FACTOR: "3"
        run: cargo run -p kafrust --example admin_create_topic

      - name: Run multi-broker producer example
        env:
          KAFRUST_PARTITION: "1"
        run: cargo run -p kafrust --example producer_send

      - name: Run multi-broker producer batch example
        env:
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker gzip producer batch example
        env:
          KAFRUST_COMPRESSION: gzip
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker snappy producer batch example
        env:
          KAFRUST_COMPRESSION: snappy
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker lz4 producer batch example
        env:
          KAFRUST_COMPRESSION: lz4
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker zstd producer batch example
        env:
          KAFRUST_COMPRESSION: zstd
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker buffered producer example
        env:
          KAFRUST_BUFFERED_COUNT: "6"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run multi-broker direct consumer example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --example consumer_fetch

      - name: Run multi-broker consumer group example
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run multi-broker admin describe group example
        run: cargo run -p kafrust --example admin_describe_group

      - name: Run multi-broker admin delete group offsets example
        run: cargo run -p kafrust --example admin_delete_group_offsets

      - name: Run multi-broker producer and consumer failover through broker stop
        run: |
          KAFRUST_PARTITION="$KAFRUST_FAILOVER_PARTITION" \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example producer_failover \
            >/tmp/kafrust-producer-failover.log 2>&1 &
          producer_pid=$!
          KAFRUST_PARTITION="$KAFRUST_FAILOVER_PARTITION" \
          KAFRUST_OFFSET=0 \
          KAFRUST_FAILOVER_PAUSE_MS=30000 \
          cargo run -p kafrust --example consumer_failover \
            >/tmp/kafrust-consumer-failover.log 2>&1 &
          consumer_pid=$!

          first_send_seen=""
          first_fetch_seen=""
          for attempt in {1..60}; do
            if grep -q "failover before produced" /tmp/kafrust-producer-failover.log; then
              first_send_seen=1
            fi
            if grep -q "failover before fetched" /tmp/kafrust-consumer-failover.log; then
              first_fetch_seen=1
            fi
            if [ -n "$first_send_seen" ] && [ -n "$first_fetch_seen" ]; then
              break
            fi
            if ! kill -0 "$producer_pid" 2>/dev/null; then
              cat /tmp/kafrust-producer-failover.log || true
              wait "$producer_pid"
            fi
            if ! kill -0 "$consumer_pid" 2>/dev/null; then
              cat /tmp/kafrust-consumer-failover.log || true
              wait "$consumer_pid"
            fi
            sleep 1
          done

          if [ -z "$first_send_seen" ]; then
            echo "producer failover example did not reach the first send"
            cat /tmp/kafrust-producer-failover.log || true
            kill "$producer_pid" 2>/dev/null || true
            kill "$consumer_pid" 2>/dev/null || true
            wait "$producer_pid" || true
            wait "$consumer_pid" || true
            exit 1
          fi
          if [ -z "$first_fetch_seen" ]; then
            echo "consumer failover example did not reach the first fetch"
            cat /tmp/kafrust-consumer-failover.log || true
            kill "$producer_pid" 2>/dev/null || true
            kill "$consumer_pid" 2>/dev/null || true
            wait "$producer_pid" || true
            wait "$consumer_pid" || true
            exit 1
          fi

          docker stop kafrust-kafka-multi-1

          cluster_ready=""
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-2:29092 \
              >/tmp/kafrust-multi-failover-probe.log 2>&1; then
              docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafrust-kafka-multi-2:29092 \
                --describe \
                --topic "$KAFRUST_TOPIC" \
                >/tmp/kafrust-multi-failover-topic.log 2>&1
              if ! grep -Eq "Leader: -1|Leader: none" /tmp/kafrust-multi-failover-topic.log; then
                cluster_ready=1
                break
              fi
            fi
            sleep 2
          done

          if [ -z "$cluster_ready" ]; then
            cat /tmp/kafrust-multi-failover-probe.log || true
            cat /tmp/kafrust-multi-failover-topic.log || true
            docker logs kafrust-kafka-multi-2
            docker logs kafrust-kafka-multi-3
            kill "$producer_pid" 2>/dev/null || true
            kill "$consumer_pid" 2>/dev/null || true
            wait "$producer_pid" || true
            wait "$consumer_pid" || true
            exit 1
          fi

          producer_status=0
          wait "$producer_pid" || producer_status=$?
          consumer_status=0
          wait "$consumer_pid" || consumer_status=$?
          cat /tmp/kafrust-producer-failover.log
          cat /tmp/kafrust-consumer-failover.log
          if [ "$producer_status" -ne 0 ] || [ "$consumer_status" -ne 0 ]; then
            exit 1
          fi

      - name: Wait for multi-broker Kafka after broker stop
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-kafka-multi-2:29092 \
              >/tmp/kafrust-multi-after-stop-probe.log 2>&1; then
              docker exec kafrust-kafka-multi-2 /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafrust-kafka-multi-2:29092 \
                --describe \
                --topic "$KAFRUST_TOPIC" \
                >/tmp/kafrust-multi-after-stop-topic.log 2>&1
              if ! grep -Eq "Leader: -1|Leader: none" /tmp/kafrust-multi-after-stop-topic.log; then
                cat /tmp/kafrust-multi-after-stop-topic.log
                exit 0
              fi
            fi
            sleep 2
          done
          cat /tmp/kafrust-multi-after-stop-probe.log || true
          cat /tmp/kafrust-multi-after-stop-topic.log || true
          docker logs kafrust-kafka-multi-2
          docker logs kafrust-kafka-multi-3
          exit 1

      - name: Run multi-broker producer batch after broker stop
        env:
          KAFRUST_BATCH_COUNT: "6"
          KAFRUST_BATCH_PARTITIONS: "0,1,2,3,4,5"
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run multi-broker direct consumer after broker stop
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --example consumer_fetch

      - name: Run multi-broker consumer group after broker stop
        env:
          KAFRUST_GROUP_ID: kafrust-smoke-multi-after-stop
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Dump multi-broker Kafka logs
        if: failure()
        run: |
          docker logs kafrust-kafka-multi-1 || true
          docker logs kafrust-kafka-multi-2
          docker logs kafrust-kafka-multi-3

  kafka-tls:
    name: Kafka 3.7.2 TLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:9093
      KAFRUST_SECURITY_PROTOCOL: tls
      KAFRUST_GROUP_ID: kafrust-smoke
      KAFRUST_TOPIC: kafrust-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate TLS certificates
        run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -subj "/CN=kafrust-test-ca" \
            -keyout tls/ca.key \
            -out tls/ca.crt
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout tls/server.key \
            -out tls/server.csr
          openssl x509 -req \
            -in tls/server.csr \
            -CA tls/ca.crt \
            -CAkey tls/ca.key \
            -CAcreateserial \
            -days 1 \
            -sha256 \
            -copy_extensions copy \
            -out tls/server.crt
          openssl pkcs12 -export \
            -in tls/server.crt \
            -inkey tls/server.key \
            -certfile tls/ca.crt \
            -name localhost \
            -out tls/kafka.server.keystore.p12 \
            -password pass:kafrust
          printf kafrust > tls/keystore-password
          printf kafrust > tls/key-password
          sudo cp tls/ca.crt /usr/local/share/ca-certificates/kafrust-test-ca.crt
          sudo update-ca-certificates
          chmod 644 tls/*

      - name: Start TLS Kafka
        run: |
          docker run -d --name kafrust-kafka-tls \
            -p 9093:9093 \
            -v "$PWD/tls:/etc/kafka/secrets:ro" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,SSL://:9093,CONTROLLER://:9094 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,SSL://localhost:9093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9094 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
            -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
            -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
            -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
            -e KAFKA_SSL_CLIENT_AUTH=none \
            apache/kafka:3.7.2

      - name: Wait for TLS Kafka
        run: |
          for attempt in {1..90}; do
            if openssl s_client \
              -connect 127.0.0.1:9093 \
              -servername localhost \
              -CAfile tls/ca.crt \
              </dev/null >/tmp/kafrust-tls-probe.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-tls-probe.log || true
          docker logs kafrust-kafka-tls
          exit 1

      - name: Create smoke topic
        run: |
          docker exec kafrust-kafka-tls /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Run TLS broker roundtrip
        run: cargo test -p kafrust --features tls --test broker_roundtrip -- --nocapture

      - name: Run TLS broker roundtrip example
        run: cargo run -p kafrust --features tls --example broker_roundtrip

      - name: Run TLS producer example
        run: cargo run -p kafrust --features tls --example producer_send

      - name: Run TLS producer batch example
        run: cargo run -p kafrust --features tls --example producer_send_batch

      - name: Run TLS gzip producer batch example
        env:
          KAFRUST_COMPRESSION: gzip
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --features tls --example producer_send_batch

      - name: Run TLS snappy producer batch example
        env:
          KAFRUST_COMPRESSION: snappy
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --features tls --example producer_send_batch

      - name: Run TLS lz4 producer batch example
        env:
          KAFRUST_COMPRESSION: lz4
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --features tls --example producer_send_batch

      - name: Run TLS zstd producer batch example
        env:
          KAFRUST_COMPRESSION: zstd
          KAFRUST_BATCH_COUNT: "3"
        run: cargo run -p kafrust --features tls --example producer_send_batch

      - name: Run TLS buffered producer example
        env:
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --features tls --example producer_buffered

      - name: Run TLS direct consumer example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --features tls --example consumer_fetch

      - name: Run TLS consumer group example
        run: cargo run -p kafrust --features tls --example consumer_group_poll

      - name: Run TLS admin describe group example
        run: cargo run -p kafrust --features tls --example admin_describe_group

      - name: Run TLS admin delete group offsets example
        run: cargo run -p kafrust --features tls --example admin_delete_group_offsets

      - name: Dump TLS Kafka logs
        if: failure()
        run: docker logs kafrust-kafka-tls

  kafka-sasl-plaintext:
    name: Kafka 3.7.2 SASL_PLAINTEXT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:9094
      KAFRUST_SECURITY_PROTOCOL: sasl_plaintext
      KAFRUST_SASL_USERNAME: kafrust
      KAFRUST_SASL_PASSWORD: kafrust-secret
      KAFRUST_GROUP_ID: kafrust-smoke
      KAFRUST_TOPIC: kafrust-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Write SASL config
        run: |
          mkdir -p sasl
          cat > sasl/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.plain.PlainLoginModule required
            username="broker"
            password="broker-secret"
            user_kafrust="kafrust-secret";
          };
          EOF
          cat > sasl/client.properties <<'EOF'
          security.protocol=SASL_PLAINTEXT
          sasl.mechanism=PLAIN
          sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="kafrust" password="kafrust-secret";
          EOF
          chmod 644 sasl/*

      - name: Start SASL Kafka
        run: |
          docker run -d --name kafrust-kafka-sasl \
            -p 9094:9094 \
            -v "$PWD/sasl:/etc/kafka/secrets:ro" \
            -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,SASL_PLAINTEXT://:9094,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,SASL_PLAINTEXT://localhost:9094 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_SASL_ENABLED_MECHANISMS=PLAIN \
            apache/kafka:3.7.2

      - name: Wait for SASL Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-kafka-sasl /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9094 \
              --command-config /etc/kafka/secrets/client.properties \
              >/tmp/kafrust-sasl-probe.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-sasl-probe.log || true
          docker logs kafrust-kafka-sasl
          exit 1

      - name: Create smoke topic
        run: |
          docker exec kafrust-kafka-sasl /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Run SASL broker roundtrip
        run: cargo test -p kafrust --test broker_roundtrip -- --nocapture

      - name: Run SASL broker roundtrip example
        run: cargo run -p kafrust --example broker_roundtrip

      - name: Run SASL producer example
        run: cargo run -p kafrust --example producer_send

      - name: Run SASL producer batch example
        run: cargo run -p kafrust --example producer_send_batch

      - name: Run SASL buffered producer example
        env:
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --example producer_buffered

      - name: Run SASL direct consumer example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --example consumer_fetch

      - name: Run SASL consumer group example
        run: cargo run -p kafrust --example consumer_group_poll

      - name: Run SASL admin describe group example
        run: cargo run -p kafrust --example admin_describe_group

      - name: Run SASL admin delete group offsets example
        run: cargo run -p kafrust --example admin_delete_group_offsets

      - name: Dump SASL Kafka logs
        if: failure()
        run: docker logs kafrust-kafka-sasl

  kafka-sasl-ssl-scram:
    name: Kafka 3.7.2 SASL_SSL SCRAM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:9095
      KAFRUST_SECURITY_PROTOCOL: sasl_tls
      KAFRUST_SASL_MECHANISM: scram-sha-256
      KAFRUST_SASL_USERNAME: kafrust
      KAFRUST_SASL_PASSWORD: kafrust-secret
      KAFRUST_TLS_ROOT_CERT_DER_PATH: ${{ github.workspace }}/sasl-ssl/ca.der
      KAFRUST_GROUP_ID: kafrust-smoke
      KAFRUST_TOPIC: kafrust-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate TLS certificates
        run: |
          mkdir -p sasl-ssl
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -subj "/CN=kafrust-test-ca" \
            -keyout sasl-ssl/ca.key \
            -out sasl-ssl/ca.crt
          openssl x509 \
            -in sasl-ssl/ca.crt \
            -outform DER \
            -out sasl-ssl/ca.der
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout sasl-ssl/server.key \
            -out sasl-ssl/server.csr
          openssl x509 -req \
            -in sasl-ssl/server.csr \
            -CA sasl-ssl/ca.crt \
            -CAkey sasl-ssl/ca.key \
            -CAcreateserial \
            -days 1 \
            -sha256 \
            -copy_extensions copy \
            -out sasl-ssl/server.crt
          openssl pkcs12 -export \
            -in sasl-ssl/server.crt \
            -inkey sasl-ssl/server.key \
            -certfile sasl-ssl/ca.crt \
            -name localhost \
            -out sasl-ssl/kafka.server.keystore.p12 \
            -password pass:kafrust
          keytool -importcert \
            -noprompt \
            -alias kafrust-test-ca \
            -file sasl-ssl/ca.crt \
            -keystore sasl-ssl/kafka.client.truststore.p12 \
            -storetype PKCS12 \
            -storepass kafrust
          printf kafrust > sasl-ssl/keystore-password
          printf kafrust > sasl-ssl/key-password
          chmod 644 sasl-ssl/*

      - name: Write SASL_SSL SCRAM config
        run: |
          cat > sasl-ssl/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.scram.ScramLoginModule required
            username="broker"
            password="broker-secret";
          };
          EOF
          cat > sasl-ssl/client.properties <<'EOF'
          security.protocol=SASL_SSL
          sasl.mechanism=SCRAM-SHA-256
          sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafrust" password="kafrust-secret";
          ssl.truststore.location=/etc/kafka/secrets/kafka.client.truststore.p12
          ssl.truststore.password=kafrust
          ssl.truststore.type=PKCS12
          EOF
          chmod 644 sasl-ssl/*

      - name: Start SASL_SSL SCRAM Kafka
        run: |
          docker run -d --name kafrust-kafka-sasl-ssl \
            -p 9095:9095 \
            -v "$PWD/sasl-ssl:/etc/kafka/secrets:ro" \
            -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,SASL_SSL://:9095,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,SASL_SSL://localhost:9095 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-256 \
            -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
            -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
            -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
            -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
            -e KAFKA_SSL_CLIENT_AUTH=none \
            apache/kafka:3.7.2

      - name: Wait for SASL_SSL SCRAM Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-kafka-sasl-ssl /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              >/tmp/kafrust-sasl-ssl-startup.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-sasl-ssl-startup.log || true
          docker logs kafrust-kafka-sasl-ssl
          exit 1

      - name: Create SCRAM user
        run: |
          docker exec kafrust-kafka-sasl-ssl /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server localhost:9092 \
            --alter \
            --add-config 'SCRAM-SHA-256=[iterations=4096,password=kafrust-secret]' \
            --entity-type users \
            --entity-name kafrust

      - name: Verify SCRAM listener
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-kafka-sasl-ssl /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9095 \
              --command-config /etc/kafka/secrets/client.properties \
              >/tmp/kafrust-sasl-ssl-probe.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-sasl-ssl-probe.log || true
          docker logs kafrust-kafka-sasl-ssl
          exit 1

      - name: Create smoke topic
        run: |
          docker exec kafrust-kafka-sasl-ssl /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Run SASL_SSL SCRAM broker roundtrip
        run: cargo test -p kafrust --features tls --test broker_roundtrip -- --nocapture

      - name: Run SASL_SSL SCRAM broker roundtrip example
        run: cargo run -p kafrust --features tls --example broker_roundtrip

      - name: Run SASL_SSL SCRAM producer example
        run: cargo run -p kafrust --features tls --example producer_send

      - name: Run SASL_SSL SCRAM producer batch example
        run: cargo run -p kafrust --features tls --example producer_send_batch

      - name: Run SASL_SSL SCRAM buffered producer example
        env:
          KAFRUST_BUFFERED_COUNT: "3"
        run: cargo run -p kafrust --features tls --example producer_buffered

      - name: Run SASL_SSL SCRAM direct consumer example
        env:
          KAFRUST_PARTITION: "0"
          KAFRUST_OFFSET: "0"
        run: cargo run -p kafrust --features tls --example consumer_fetch

      - name: Run SASL_SSL SCRAM consumer group example
        run: cargo run -p kafrust --features tls --example consumer_group_poll

      - name: Run SASL_SSL SCRAM admin describe group example
        run: cargo run -p kafrust --features tls --example admin_describe_group

      - name: Run SASL_SSL SCRAM admin delete group offsets example
        run: cargo run -p kafrust --features tls --example admin_delete_group_offsets

      - name: Dump SASL_SSL SCRAM Kafka logs
        if: failure()
        run: docker logs kafrust-kafka-sasl-ssl
