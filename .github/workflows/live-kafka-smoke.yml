        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-kafka-sasl-ssl-oauth-oidc /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              >/tmp/kafrust-sasl-ssl-oauth-oidc-startup.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-sasl-ssl-oauth-oidc-startup.log || true
          docker logs kafrust-kafka-sasl-ssl-oauth-oidc
          exit 1

      - name: Create smoke topic
        run: |
          docker exec kafrust-kafka-sasl-ssl-oauth-oidc /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic "$KAFRUST_TOPIC" \
            --partitions 1 \
            --replication-factor 1

      - name: Inspect signed token claims
        run: |
          python3 - <<'PY'
          import base64
          import json

          token = open("sasl-ssl-oauth-oidc/oidc/oauth-token", encoding="utf-8").read().strip()
          header, payload, signature = token.split(".")

          def decode(value):
              return json.loads(base64.urlsafe_b64decode(value + "=" * (-len(value) % 4)))

          print("header=", decode(header))
          print("payload=", decode(payload))
          print("signature_bytes=", len(base64.urlsafe_b64decode(signature + "=" * (-len(signature) % 4))))
          PY

      - name: Validate signed token with Kafka jose4j
        continue-on-error: true
        run: |
          docker cp kafrust-kafka-sasl-ssl-oauth-oidc:/opt/kafka/libs/kafka-clients-3.7.2.jar /tmp/kafka-clients.jar
          docker cp kafrust-kafka-sasl-ssl-oauth-oidc:/opt/kafka/libs/jose4j-0.9.4.jar /tmp/jose4j.jar
          docker cp kafrust-kafka-sasl-ssl-oauth-oidc:/opt/kafka/libs/slf4j-api-1.7.36.jar /tmp/slf4j-api.jar
          cat > /tmp/KafkaOauthJwtProbe.java <<'JAVA'
          import java.util.Set;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import org.jose4j.jwk.HttpsJwks;
          import org.jose4j.keys.resolvers.HttpsJwksVerificationKeyResolver;
          import org.apache.kafka.common.security.oauthbearer.OAuthBearerToken;
          import org.apache.kafka.common.security.oauthbearer.internals.secured.ValidatorAccessTokenValidator;

          public final class KafkaOauthJwtProbe {
              public static void main(String[] args) throws Exception {
                  String token = Files.readString(Path.of(args[0])).trim();
                  HttpsJwks jwks = new HttpsJwks(args[1]);
                  ValidatorAccessTokenValidator validator = new ValidatorAccessTokenValidator(
                      2,
                      Set.of(args[2]),
                      args[3],
                      new HttpsJwksVerificationKeyResolver(jwks),
                      "scope",
                      "sub");
                  OAuthBearerToken validated = validator.validate(token);
                  System.out.println("kafka_validator=ok subject=" + validated.principalName()
                      + " scopes=" + validated.scope());
              }
          }
          JAVA
          javac -cp /tmp/kafka-clients.jar:/tmp/jose4j.jar:/tmp/slf4j-api.jar /tmp/KafkaOauthJwtProbe.java
          java -cp /tmp:/tmp/kafka-clients.jar:/tmp/jose4j.jar:/tmp/slf4j-api.jar KafkaOauthJwtProbe \
            sasl-ssl-oauth-oidc/oidc/oauth-token \
            http://127.0.0.1:8089/jwks.json \
            kafrust-client \
            http://host.docker.internal:8089/issuer

      - name: Probe signed token with Kafka Java client
        continue-on-error: true
        run: |
          export KAFRUST_SASL_TOKEN="$(cat sasl-ssl-oauth-oidc/oidc/oauth-token)"
          cat > /tmp/KafkaOauthAdminProbe.java <<'JAVA'
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.List;
          import java.util.Map;
          import java.util.Properties;
          import java.util.Set;
          import java.util.concurrent.TimeUnit;
          import javax.security.auth.Subject;
          import javax.security.auth.callback.Callback;
          import javax.security.auth.callback.CallbackHandler;
          import javax.security.auth.callback.UnsupportedCallbackException;
          import javax.security.auth.login.AppConfigurationEntry;
          import org.apache.kafka.clients.CommonClientConfigs;
          import org.apache.kafka.clients.admin.Admin;
          import org.apache.kafka.common.config.SaslConfigs;
          import org.apache.kafka.common.config.SslConfigs;
          import org.apache.kafka.common.security.auth.AuthenticateCallbackHandler;
          import org.apache.kafka.common.security.auth.SaslExtensionsCallback;
          import org.apache.kafka.common.security.oauthbearer.OAuthBearerTokenCallback;
          import org.apache.kafka.common.security.oauthbearer.internals.secured.BasicOAuthBearerToken;

          public final class KafkaOauthAdminProbe {
              public static final class Handler implements AuthenticateCallbackHandler {
                  private String token;

                  @Override
                  public void configure(Map<String, ?> configs, String mechanism,
                      List<AppConfigurationEntry> jaasConfigEntries) {
                      token = System.getenv("KAFRUST_SASL_TOKEN");
                  }

                  @Override
                  public void handle(Callback[] callbacks) throws UnsupportedCallbackException {
                      for (Callback callback : callbacks) {
                          if (callback instanceof OAuthBearerTokenCallback tokenCallback) {
                              tokenCallback.token(new BasicOAuthBearerToken(
                                  token,
                                  Set.of("kafrust-smoke"),
                                  System.currentTimeMillis() + 3_600_000,
                                  "kafrust",
                                  System.currentTimeMillis()));
                          } else if (!(callback instanceof SaslExtensionsCallback)) {
                              throw new UnsupportedCallbackException(callback);
                          }
                      }
                  }

                  @Override
                  public void close() {
                  }
              }

              public static void main(String[] args) throws Exception {
                  Properties properties = new Properties();
                  properties.put(CommonClientConfigs.BOOTSTRAP_SERVERS_CONFIG, "localhost:9098");
                  properties.put(CommonClientConfigs.SECURITY_PROTOCOL_CONFIG, "SASL_SSL");
                  properties.put(SaslConfigs.SASL_MECHANISM, "OAUTHBEARER");
                  properties.put(SaslConfigs.SASL_JAAS_CONFIG,
                      "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;");
                  properties.put(SaslConfigs.SASL_LOGIN_CALLBACK_HANDLER_CLASS, Handler.class.getName());
                  properties.put(SslConfigs.SSL_TRUSTSTORE_TYPE_CONFIG, "PEM");
                  properties.put(SslConfigs.SSL_TRUSTSTORE_CERTIFICATES_CONFIG,
                      Files.readString(Path.of("sasl-ssl-oauth-oidc/ca.crt")));

                  try (Admin admin = Admin.create(properties)) {
                      admin.describeCluster().nodes().get(30, TimeUnit.SECONDS);
                      System.out.println("kafka_java_client=ok");
                  }
              }
          }
          JAVA
          javac -cp /tmp/kafka-clients.jar:/tmp/slf4j-api.jar /tmp/KafkaOauthAdminProbe.java
          java -cp /tmp:/tmp/kafka-clients.jar:/tmp/slf4j-api.jar KafkaOauthAdminProbe

      - name: Run signed OAUTHBEARER with static token
        run: |
          export KAFRUST_SASL_TOKEN="$(cat sasl-ssl-oauth-oidc/oidc/oauth-token)"
          unset KAFRUST_SASL_TOKEN_PATH
          cargo run -p kafrust --features tls --example broker_roundtrip

      - name: Run provider-backed signed OAUTHBEARER paths
        run: |
          export KAFRUST_SASL_TOKEN_PATH="$GITHUB_WORKSPACE/sasl-ssl-oauth-oidc/oidc/oauth-token"
          unset KAFRUST_SASL_TOKEN
          cargo run -p kafrust --features tls --example broker_roundtrip
          cargo run -p kafrust --features tls --example producer_send
          KAFRUST_PARTITION=0 KAFRUST_OFFSET=0 \
            cargo run -p kafrust --features tls --example consumer_fetch
          cargo run -p kafrust --features tls --example consumer_group_poll

      - name: Dump signed OAUTHBEARER Kafka logs
        if: failure()
        run: |
          docker logs kafrust-kafka-sasl-ssl-oauth-oidc
          cat /tmp/kafrust-oidc-provider.log || true

  kafka-acls:
    name: Kafka 3.7.2 ACL authorizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:9096
      KAFRUST_ACL_TOPIC: kafrust-acl-smoke
      KAFRUST_ACL_PRINCIPAL: User:ANONYMOUS
      KAFRUST_ACL_DISCOVERY_ALLOWED_TOPIC: kafrust-acl-discovery-allowed
      KAFRUST_ACL_DISCOVERY_DENIED_TOPIC: kafrust-acl-discovery-denied
      KAFRUST_ACL_DISCOVERY_GROUP: kafrust-acl-discovery-group-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Write ACL broker JAAS config
        run: |
          mkdir -p acl-sasl
          cat > acl-sasl/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.plain.PlainLoginModule required
            username="admin"
            password="admin-secret"
            user_admin="admin-secret"
            user_limited="limited-secret";
          };
          EOF

      - name: Start Kafka with StandardAuthorizer
        run: |
          docker run -d --name kafrust-kafka-acls \
            -p 9096:9092 \
            -p 9097:9094 \
            -v "$PWD/acl-sasl:/etc/kafka/secrets:ro" \
            -e KAFKA_OPTS=-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,SASL_PLAINTEXT://:9094,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,SASL_PLAINTEXT://localhost:9094 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer \
            -e KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false \
            -e KAFKA_SUPER_USERS=User:ANONYMOUS \
            -e KAFKA_SASL_ENABLED_MECHANISMS=PLAIN \
            apache/kafka:3.7.2

      - name: Wait for authorizer Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-kafka-acls /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              >/tmp/kafrust-acls-probe.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kafrust-acls-probe.log || true
          docker logs kafrust-kafka-acls
          exit 1

      - name: Run ACL authorizer roundtrip
        run: cargo test -p kafrust --test broker_roundtrip -- --nocapture

      - name: Run ACL admin example
        run: cargo run -p kafrust --example admin_acls

      - name: Run client quota admin example
        run: cargo run -p kafrust --example admin_client_quotas

      - name: Prepare secured topic discovery fixtures
        run: |
          docker exec kafrust-kafka-acls /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --topic "$KAFRUST_ACL_DISCOVERY_ALLOWED_TOPIC" \
            --partitions 1 \
            --replication-factor 1
          docker exec kafrust-kafka-acls /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --topic "$KAFRUST_ACL_DISCOVERY_DENIED_TOPIC" \
            --partitions 1 \
            --replication-factor 1
          docker exec kafrust-kafka-acls /opt/kafka/bin/kafka-acls.sh \
            --bootstrap-server localhost:9092 \
            --add \
            --allow-principal User:limited \
            --operation Read \
            --operation Describe \
            --topic "$KAFRUST_ACL_DISCOVERY_ALLOWED_TOPIC"
          docker exec kafrust-kafka-acls /opt/kafka/bin/kafka-acls.sh \
            --bootstrap-server localhost:9092 \
            --add \
            --allow-principal User:limited \
            --operation Read \
            --group "$KAFRUST_ACL_DISCOVERY_GROUP"
          printf 'authorized-record\n' | docker exec -i kafrust-kafka-acls \
            /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 \
            --topic "$KAFRUST_ACL_DISCOVERY_ALLOWED_TOPIC"

      - name: Run secured topic discovery authorization example
        env:
          KAFRUST_BOOTSTRAP_SERVERS: localhost:9097
          KAFRUST_SECURITY_PROTOCOL: sasl_plaintext
          KAFRUST_SASL_MECHANISM: plain
          KAFRUST_SASL_USERNAME: limited
          KAFRUST_SASL_PASSWORD: limited-secret
          KAFRUST_GROUP_ID: ${{ env.KAFRUST_ACL_DISCOVERY_GROUP }}
          KAFRUST_TOPIC_PATTERN: ^kafrust-acl-discovery-(allowed|denied)$
          KAFRUST_REGEX_EXPECTED_TOPICS: ${{ env.KAFRUST_ACL_DISCOVERY_ALLOWED_TOPIC }}
        run: |
          set +e
          output="$(cargo run -p kafrust --example consumer_group_regex 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "secured topic discovery example failed with status $status"
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -q "$KAFRUST_ACL_DISCOVERY_DENIED_TOPIC"; then
            echo "regex discovery exposed an unauthorized topic"
            exit 1
          fi

      - name: Dump ACL authorizer Kafka logs
        if: failure()
        run: docker logs kafrust-kafka-acls
