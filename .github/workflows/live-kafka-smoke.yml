            fi
            sleep 2
          done

          if [ -z "$broker_one_ready" ]; then
            cat /tmp/kafrust-multi-repeat-probe.log || true
            docker logs kafrust-kafka-multi-1
            exit 1
          fi

          repeated_partition=""
          for attempt in {1..120}; do
            docker exec kafrust-kafka-multi-1 /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server kafrust-kafka-multi-1:29092 \
              --describe \
              --topic "$KAFRUST_TOPIC" \
              >/tmp/kafrust-multi-repeat-topic.log 2>&1 || true
            repeated_partition="$(awk '/Partition:/ && /Leader: 2/ { for (i = 1; i <= NF; i++) if ($i == "Partition:") { print $(i + 1); exit } }' /tmp/kafrust-multi-repeat-topic.log)"
            if [ -n "$repeated_partition" ]; then
