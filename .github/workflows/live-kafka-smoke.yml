            -e KAFKA_SASL_OAUTHBEARER_EXPECTED_ISSUER=http://host.docker.internal:8089/issuer \
            -e KAFKA_SASL_OAUTHBEARER_EXPECTED_AUDIENCE=kafrust-client \
