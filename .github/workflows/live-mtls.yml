name: Live Mutual TLS

on:
  workflow_dispatch:
    inputs:
      kafka_version:
        description: "Apache Kafka broker image version"
        required: true
        default: "3.7.2"
        type: choice
        options:
          - "3.7.2"
          - "4.3.1"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: 127.0.0.1:19093
  KAFRUST_SECURITY_PROTOCOL: tls
  KAFRUST_TLS_SERVER_NAME: localhost
  KAFRUST_TLS_ROOT_CERT_DER_PATH: ${{ github.workspace }}/mtls/ca.der
  KAFRUST_TLS_CLIENT_CERT_DER_PATH: ${{ github.workspace }}/mtls/client.der
  KAFRUST_TLS_CLIENT_KEY_DER_PATH: ${{ github.workspace }}/mtls/client-key.der
  KAFRUST_ADMIN_TOPIC: kafrust-mtls-admin-${{ github.run_id }}
  KAFRUST_TOPIC: kafrust-mtls-admin-${{ github.run_id }}
  KAFRUST_GROUP_ID: kafrust-mtls-group-${{ github.run_id }}
  KAFRUST_TRANSACTIONAL_ID: kafrust-mtls-transaction-${{ github.run_id }}
  KAFRUST_KEY: mtls-key
  KAFRUST_VALUE: mTLS-roundtrip

jobs:
  mtls:
    name: Kafka ${{ inputs.kafka_version }} mutual TLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate CA, broker, and client certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mtls

          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -subj "/CN=kafrust-mtls-ca" \
            -keyout mtls/ca.key \
            -out mtls/ca.crt
          openssl x509 -in mtls/ca.crt -outform DER -out mtls/ca.der

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out mtls/server.key
          openssl req -new -key mtls/server.key -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -out mtls/server.csr
          openssl x509 -req -in mtls/server.csr -CA mtls/ca.crt \
            -CAkey mtls/ca.key -CAcreateserial -days 1 -sha256 \
            -copy_extensions copy -out mtls/server.crt
          openssl pkcs12 -export -in mtls/server.crt -inkey mtls/server.key \
            -certfile mtls/ca.crt -name localhost \
            -out mtls/kafka.server.keystore.p12 -password pass:kafrust

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out mtls/client.key
          openssl req -new -key mtls/client.key -subj "/CN=kafrust-client" \
            -addext "extendedKeyUsage=clientAuth" \
            -out mtls/client.csr
          openssl x509 -req -in mtls/client.csr -CA mtls/ca.crt \
            -CAkey mtls/ca.key -CAcreateserial -days 1 -sha256 \
            -copy_extensions copy -out mtls/client.crt
          openssl x509 -in mtls/client.crt -outform DER -out mtls/client.der
          openssl pkcs8 -topk8 -nocrypt -in mtls/client.key \
            -outform DER -out mtls/client-key.der

          keytool -importcert -noprompt -alias kafrust-mtls-ca \
            -file mtls/ca.crt -keystore mtls/kafka.server.truststore.p12 \
            -storetype PKCS12 -storepass kafrust
          printf 'kafrust' > mtls/keystore-password
          printf 'kafrust' > mtls/key-password
          printf 'kafrust' > mtls/truststore-password
          chmod 644 mtls/*

      - name: Start Kafka with required client authentication
        shell: bash
        run: |
          set -euo pipefail
          docker network create kafrust-mtls
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version }} \
            /opt/kafka/bin/kafka-storage.sh random-uuid)"
          docker run -d --name kafrust-mtls-broker \
            --hostname kafrust-mtls-broker \
            --network kafrust-mtls \
            -p 19093:9093 \
            -v "$PWD/mtls:/etc/kafka/secrets:ro" \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,SSL://:9093,CONTROLLER://:9094 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-mtls-broker:29092,SSL://localhost:19093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SSL:SSL \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-mtls-broker:9094 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
            -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
            -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
            -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
            -e KAFKA_SSL_TRUSTSTORE_FILENAME=kafka.server.truststore.p12 \
            -e KAFKA_SSL_TRUSTSTORE_CREDENTIALS=truststore-password \
            -e KAFKA_SSL_TRUSTSTORE_TYPE=PKCS12 \
            -e KAFKA_SSL_CLIENT_AUTH=required \
            apache/kafka:${{ inputs.kafka_version }}

      - name: Wait for mutual TLS listener
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            if openssl s_client -connect 127.0.0.1:19093 \
                -CAfile mtls/ca.crt \
                -cert mtls/client.crt \
                -key mtls/client.key \
                -verify_return_error -brief < /dev/null \
                > /tmp/kafrust-mtls-openssl.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-mtls-openssl.log
          docker logs kafrust-mtls-broker
          exit 1

      - name: Run Kafka mTLS roundtrip
        run: |
          cargo run -p kafrust --features tls --example broker_roundtrip
          cargo run -p kafrust --features tls --example admin_create_topic
          cargo run -p kafrust --features tls --example producer_send
          cargo run -p kafrust --features tls --example consumer_fetch
          cargo run -p kafrust --features tls --example consumer_group_poll
          cargo run -p kafrust --features tls --example producer_transactional
          cargo test -p kafrust --features tls --test broker_roundtrip \
            api_versions_and_metadata_roundtrip_when_broker_is_configured -- \
            --nocapture
          cargo test -p kafrust --features tls --test broker_roundtrip \
            find_group_coordinator_roundtrip_when_broker_is_configured -- \
            --nocapture

      - name: Upload broker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mtls-kafka-diagnostics-${{ github.run_id }}
          path: /tmp/kafrust-mtls-openssl.log
          if-no-files-found: ignore

      - name: Cleanup Kafka
        if: always()
        shell: bash
        run: |
          docker logs kafrust-mtls-broker || true
          docker rm -f kafrust-mtls-broker || true
          docker network rm kafrust-mtls || true
