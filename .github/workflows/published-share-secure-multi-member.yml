name: Published ShareConsumer Secure Multi-Member

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to run from crates.io"
        required: true
        default: "0.3.5"
      run_seconds:
        description: "Seconds each published member remains active"
        required: true
        default: "300"
      records_per_partition:
        description: "Records seeded into each partition"
        required: true
        default: "64"
  schedule:
    - cron: "17 7 * * 2"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.81.0"
  KAFRUST_BOOTSTRAP_SERVERS: localhost:24092,localhost:24093,localhost:24094
  KAFRUST_SHARE_TOPIC: kafrust-published-share-secure-members-${{ github.run_id }}
  KAFRUST_SHARE_GROUP_ID: kafrust-published-share-secure-members-group-${{ github.run_id }}
  KAFRUST_SHARE_VALUE_PREFIX: published-share-secure-member-
  KAFRUST_SHARE_MEMBER_RUN_SECONDS: ${{ inputs.run_seconds || '300' }}
  KAFRUST_SHARE_RECORDS_PER_PARTITION: ${{ inputs.records_per_partition || '64' }}

jobs:
  published-share-secure-multi-member:
    name: Published kafrust ShareConsumer secure multi-member ownership
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Generate TLS certificates
        run: |
          mkdir -p sasl-ssl
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -subj "/CN=kafrust-share-test-ca" \
            -keyout sasl-ssl/ca.key -out sasl-ssl/ca.crt
          openssl x509 -in sasl-ssl/ca.crt -outform DER -out sasl-ssl/ca.der
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout sasl-ssl/server.key -out sasl-ssl/server.csr
          openssl x509 -req -in sasl-ssl/server.csr \
            -CA sasl-ssl/ca.crt -CAkey sasl-ssl/ca.key -CAcreateserial \
            -days 1 -sha256 -copy_extensions copy -out sasl-ssl/server.crt
          openssl pkcs12 -export -in sasl-ssl/server.crt \
            -inkey sasl-ssl/server.key -certfile sasl-ssl/ca.crt \
            -name localhost -out sasl-ssl/kafka.server.keystore.p12 \
            -password pass:kafrust
          printf kafrust > sasl-ssl/keystore-password
          printf kafrust > sasl-ssl/key-password
          chmod 644 sasl-ssl/*

      - name: Write SCRAM broker config
        run: |
          cat > sasl-ssl/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.scram.ScramLoginModule required
            username="broker"
            password="broker-secret";
          };
          EOF
          chmod 644 sasl-ssl/kafka_server_jaas.conf

      - name: Start three-broker Kafka 4.3.1 with secure Share groups
        run: |
          docker network create kafrust-published-share-secure-members
          cluster_id="$(docker run --rm apache/kafka:4.3.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          for node in 1 2 3; do
            external_port=$((24091 + node))
            docker run -d --name "kafrust-published-share-secure-members-${node}" \
              --network kafrust-published-share-secure-members \
              -p "${external_port}:9095" \
              -v "$PWD/sasl-ssl:/etc/kafka/secrets:ro" \
              -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,SASL_SSL://:9095,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-share-secure-members-${node}:29092,SASL_SSL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL_SSL:SASL_SSL \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-share-secure-members-1:9093,2@kafrust-published-share-secure-members-2:9093,3@kafrust-published-share-secure-members-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=2 \
              -e KAFKA_SHARE_RENEW_ACKNOWLEDGE_ENABLE=true \
              -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,share \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              -e KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-256,SCRAM-SHA-512 \
              -e KAFKA_SSL_KEYSTORE_FILENAME=kafka.server.keystore.p12 \
              -e KAFKA_SSL_KEYSTORE_CREDENTIALS=keystore-password \
              -e KAFKA_SSL_KEY_CREDENTIALS=key-password \
              -e KAFKA_SSL_KEYSTORE_TYPE=PKCS12 \
              -e KAFKA_SSL_CLIENT_AUTH=none \
              apache/kafka:4.3.1
          done

      - name: Wait for Kafka and verify TLS listeners
        run: |
          broker_ready=false
          for attempt in {1..120}; do
            if docker exec kafrust-published-share-secure-members-1 \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-share-secure-members-1:29092 \
              >/tmp/kafrust-published-share-secure-members-probe.log 2>&1; then
              broker_ready=true
              break
            fi
            sleep 2
          done
          test "$broker_ready" = true
          for port in 24092 24093 24094; do
            openssl s_client -connect "127.0.0.1:${port}" \
              -servername localhost -CAfile sasl-ssl/ca.crt \
              -verify_return_error </dev/null >/tmp/kafrust-share-tls-${port}.log 2>&1
          done

      - name: Create SCRAM user and replicated Share topic
        run: |
          docker exec kafrust-published-share-secure-members-1 \
            /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-published-share-secure-members-1:29092 \
            --alter --add-config 'SCRAM-SHA-256=[iterations=4096,password=kafrust-secret]' \
            --entity-type users --entity-name kafrust
          docker exec kafrust-published-share-secure-members-1 \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-share-secure-members-1:29092 \
            --create --topic "$KAFRUST_SHARE_TOPIC" --partitions 6 --replication-factor 3
          docker exec kafrust-published-share-secure-members-1 \
            /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafrust-published-share-secure-members-1:29092 \
            --alter --entity-type groups --entity-name "$KAFRUST_SHARE_GROUP_ID" \
            --add-config share.auto.offset.reset=earliest

      - name: Create fresh external published project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.5' }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-share-secure-members"
          cargo new --bin "$project_dir"
          cp .github/published-share-multi-member/src/main.rs "$project_dir/src/main.rs"
          sed "s|kafrust = \"__KAFRUST_VERSION__\"|kafrust = { version = \"${KAFRUST_PUBLISHED_VERSION}\", features = [\"tls\"] }|" \
            .github/published-share-multi-member/Cargo.toml > "$project_dir/Cargo.toml"
          cargo build --release --manifest-path "$project_dir/Cargo.toml"

      - name: Run two authenticated published Share members
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/kafrust-published-share-secure-members"
          ready_base="$RUNNER_TEMP/kafrust-published-share-secure-member-ready"
          start_file="$RUNNER_TEMP/kafrust-published-share-secure-member-start"
          output_base="$RUNNER_TEMP/kafrust-published-share-secure-member-output"
          log_base="$RUNNER_TEMP/kafrust-published-share-secure-member-log"
          pids_file="$RUNNER_TEMP/kafrust-published-share-secure-member-pids"
          rm -f "$ready_base"-* "$start_file" "$output_base"-* "$log_base"-* "$pids_file"
          for member in 1 2; do
            KAFRUST_OPERATION=member \
              KAFRUST_TLS_ROOT_CERT_DER_PATH="$PWD/sasl-ssl/ca.der" \
              KAFRUST_SHARE_MEMBER_ID="share-member-${member}" \
              KAFRUST_SHARE_MEMBER_READY_FILE="$ready_base-${member}" \
              KAFRUST_SHARE_MEMBER_START_FILE="$start_file" \
              KAFRUST_SHARE_MEMBER_OUTPUT_FILE="$output_base-${member}" \
              cargo run --quiet --release \
              --manifest-path "$project_dir/Cargo.toml" \
              > "$log_base-${member}" 2>&1 &
            echo "$!" >> "$pids_file"
          done
          for member in 1 2; do
            member_ready=false
            for attempt in {1..180}; do
              if test -f "$ready_base-${member}"; then
                member_ready=true
                break
              fi
              sleep 1
            done
            test "$member_ready" = true
          done
          touch "$start_file"
          KAFRUST_OPERATION=seed \
            KAFRUST_TLS_ROOT_CERT_DER_PATH="$PWD/sasl-ssl/ca.der" \
            cargo run --quiet --release --manifest-path "$project_dir/Cargo.toml"
          set +e
          while read -r pid; do
            wait "$pid"
            status=$?
            if [ "$status" -ne 0 ]; then
              cat "$log_base-1" "$log_base-2"
              exit "$status"
            fi
          done < "$pids_file"
          cat "$log_base-1" "$log_base-2"

      - name: Verify secure Share ownership and resource gauges
        run: |
          set -euo pipefail
          output_base="$RUNNER_TEMP/kafrust-published-share-secure-member-output"
          expected_per_partition="$KAFRUST_SHARE_RECORDS_PER_PARTITION"
          expected_total=$((expected_per_partition * 6))
          cat "$output_base-1" "$output_base-2" | sort -t, -k2,2n -k3,3n > "$RUNNER_TEMP/secure-share-member-observed"
          test "$(wc -l < "$RUNNER_TEMP/secure-share-member-observed")" -eq "$expected_total"
          for partition in $(seq 0 5); do
            test "$(cut -d, -f2 "$RUNNER_TEMP/secure-share-member-observed" | grep -cx "$partition")" -eq "$expected_per_partition"
          done
          test "$(cut -d, -f2,3 "$RUNNER_TEMP/secure-share-member-observed" | sort | uniq | wc -l)" -eq "$expected_total"
          test "$(cut -d, -f2,3 "$output_base-1" | sort | uniq | wc -l)" -eq "$(wc -l < "$output_base-1")"
          test "$(cut -d, -f2,3 "$output_base-2" | sort | uniq | wc -l)" -eq "$(wc -l < "$output_base-2")"
          grep -Eq 'in_flight=0 buffered=0' "$RUNNER_TEMP/kafrust-published-share-secure-member-log-1"
          grep -Eq 'in_flight=0 buffered=0' "$RUNNER_TEMP/kafrust-published-share-secure-member-log-2"
          grep -Eq 'max_in_flight=[0-9]+ max_buffered=[0-9]+' "$RUNNER_TEMP/kafrust-published-share-secure-member-log-1"
          grep -Eq 'max_in_flight=[0-9]+ max_buffered=[0-9]+' "$RUNNER_TEMP/kafrust-published-share-secure-member-log-2"

      - name: Verify published dependency versions
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.5' }}
        run: |
          lockfile="$RUNNER_TEMP/kafrust-published-share-secure-members/Cargo.lock"
          grep -A1 -q 'name = "kafrust"' "$lockfile"
          grep -A1 -q "version = \"${KAFRUST_PUBLISHED_VERSION}\"" "$lockfile"
          grep -A1 -q 'name = "kafrust-protocol"' "$lockfile"

      - name: Dump diagnostics
        if: failure()
        run: |
          cat "$RUNNER_TEMP/kafrust-published-share-secure-member-log-1" || true
          cat "$RUNNER_TEMP/kafrust-published-share-secure-member-log-2" || true
          docker logs kafrust-published-share-secure-members-1 || true
          docker logs kafrust-published-share-secure-members-2 || true
          docker logs kafrust-published-share-secure-members-3 || true
