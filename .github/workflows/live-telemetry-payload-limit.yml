name: Live Client Telemetry Payload Limit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 5"

env:
  CARGO_TERM_COLOR: always
  KAFRUST_BOOTSTRAP_SERVERS: localhost:9092

jobs:
  payload-limit:
    name: Kafka 3.7.2 KIP-714 payload limit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Build Kafka telemetry test image
        run: docker build -t kafrust-kafka-telemetry scripts/kafka-client-telemetry-plugin

      - name: Start Kafka with a small telemetry limit
        run: |
          docker run -d --name kafrust-kafka-telemetry \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TELEMETRY_MAX_BYTES=128 \
            -e KAFKA_METRIC_REPORTERS=com.kafrust.KafrustTelemetryReporter \
            -e CLASSPATH=/opt/kafka/libs/kafrust-telemetry.jar:/opt/kafka/libs/* \
            kafrust-kafka-telemetry

      - name: Wait for Kafka
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-kafka-telemetry /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 >/tmp/kafrust-telemetry-limit-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-telemetry-limit-probe.log || true
          docker logs kafrust-kafka-telemetry
          exit 1

      - name: Create client metrics subscription
        run: |
          docker exec kafrust-kafka-telemetry /opt/kafka/bin/kafka-client-metrics.sh \
            --bootstrap-server localhost:9092 \
            --alter \
            --name kafrust-payload-limit \
            --metrics kafrust.client. \
            --interval 1000

      - name: Verify kafrust rejects an oversized advertised payload
        env:
          KAFRUST_EXPECT_TELEMETRY_PAYLOAD_LIMIT: "true"
        run: |
          set -euo pipefail
          cargo run -p kafrust --features otlp --example telemetry_smoke \
            > /tmp/kafrust-telemetry-payload-limit.log 2>&1
          cat /tmp/kafrust-telemetry-payload-limit.log
          grep -Eq 'telemetry-smoke-payload-limit size=[1-9][0-9]* max=128' \
            /tmp/kafrust-telemetry-payload-limit.log

      - name: Dump Kafka logs
        if: failure()
        run: docker logs kafrust-kafka-telemetry
