name: Live CreatePartitions Authorization

on:
  workflow_dispatch:
  schedule:
    - cron: "7 6 * * 4"

permissions:
  contents: read

jobs:
  authorization:
    name: Kafka ${{ matrix.kafka-version }} CreatePartitions authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - "3.7.2"
          - "4.3.1"
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
      KAFRUST_BOOTSTRAP_SERVERS: localhost:39105
      KAFRUST_SECURITY_PROTOCOL: sasl_plaintext
      KAFRUST_SASL_MECHANISM: plain
      KAFRUST_ADMIN_TOPIC: kafrust-create-partitions-auth-${{ matrix.kafka-version }}-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start authorizer Kafka
        run: |
          kafka_image="apache/kafka:${KAFKA_VERSION}"
          cluster_id="$(docker run --rm "$kafka_image" /opt/kafka/bin/kafka-storage.sh random-uuid)"
          mkdir -p create-partitions-auth-sasl
          cat > create-partitions-auth-sasl/kafka_server_jaas.conf <<'EOF'
          KafkaServer {
            org.apache.kafka.common.security.plain.PlainLoginModule required
            username="broker"
            password="broker-secret"
            user_admin="admin-secret"
            user_denied="denied-secret";
          };
          EOF
          chmod 644 create-partitions-auth-sasl/kafka_server_jaas.conf
          docker run -d --name kafrust-create-partitions-auth \
            -p 39105:9092 \
            -v "$PWD/create-partitions-auth-sasl:/etc/kafka/secrets:ro" \
            -e KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf" \
            -e CLUSTER_ID="$cluster_id" \
            -e KAFKA_CLUSTER_ID="$cluster_id" \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,SASL_PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://localhost:29092,SASL_PLAINTEXT://localhost:39105 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer \
            -e KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false \
            -e 'KAFKA_SUPER_USERS=User:ANONYMOUS;User:admin' \
            -e KAFKA_SASL_ENABLED_MECHANISMS=PLAIN \
            "$kafka_image"

      - name: Wait for Kafka
        run: |
          for attempt in {1..90}; do
            if docker exec kafrust-create-partitions-auth \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:29092 \
              >/tmp/kafrust-create-partitions-auth-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-create-partitions-auth-probe.log || true
          docker logs kafrust-create-partitions-auth
          exit 1

      - name: Create target topic and allow restricted discovery
        run: |
          docker exec kafrust-create-partitions-auth /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:29092 \
            --create \
            --topic "$KAFRUST_ADMIN_TOPIC" \
            --partitions 1 \
            --replication-factor 1
          docker exec kafrust-create-partitions-auth /opt/kafka/bin/kafka-acls.sh \
            --bootstrap-server localhost:29092 \
            --add \
            --allow-principal User:denied \
            --operation Describe \
            --cluster
          docker exec kafrust-create-partitions-auth /opt/kafka/bin/kafka-acls.sh \
            --bootstrap-server localhost:29092 \
            --add \
            --allow-principal User:denied \
            --operation Describe \
            --topic "$KAFRUST_ADMIN_TOPIC"

      - name: Verify restricted principal is denied
        env:
          KAFRUST_SASL_USERNAME: denied
          KAFRUST_SASL_PASSWORD: denied-secret
          KAFRUST_EXPECT_CREATE_PARTITIONS_ERROR: "29"
        run: cargo run -p kafrust --example admin_create_partitions_authorization

      - name: Verify administrator is allowed
        env:
          KAFRUST_SASL_USERNAME: admin
          KAFRUST_SASL_PASSWORD: admin-secret
          KAFRUST_EXPECT_CREATE_PARTITIONS_ERROR: "0"
        run: cargo run -p kafrust --example admin_create_partitions_authorization

      - name: Dump Kafka diagnostics
        if: failure()
        run: docker logs kafrust-create-partitions-auth || true

      - name: Cleanup
        if: always()
        run: docker rm -f kafrust-create-partitions-auth || true
