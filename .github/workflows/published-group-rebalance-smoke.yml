name: Published Group Rebalance Smoke

on:
  workflow_dispatch:
    inputs:
      kafrust_version:
        description: "Published kafrust version to execute from crates.io"
        required: true
        default: "0.3.5"
      kafka_version:
        description: "Apache Kafka broker image version"
        required: true
        default: "4.3.1"
      group_protocol:
        description: "Consumer group protocol: classic or consumer (KIP-848)"
        required: true
        default: "consumer"
      member_exit:
        description: "How the second member exits: normal LeaveGroup or abrupt connection drop"
        required: true
        default: "drop"
        type: choice
        options:
          - leave
          - drop
      churn_cycles:
        description: "Independent join/leave or drop cycles"
        required: true
        default: "10"
  schedule:
    - cron: "7 5 * * 2"

env:
  CARGO_TERM_COLOR: always

jobs:
  published-group-rebalance:
    name: Published kafrust ${{ inputs.kafrust_version || '0.3.5' }} ${{ inputs.kafka_version || '4.3.1' }} ${{ inputs.group_protocol || 'consumer' }} group churn
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAFRUST_BOOTSTRAP_SERVERS: localhost:20092,localhost:20093,localhost:20094
      KAFRUST_TOPIC: kafrust-published-group-${{ github.run_id }}
      KAFRUST_GROUP_ID: kafrust-published-group-${{ github.run_id }}
      KAFRUST_GROUP_PROTOCOL: ${{ inputs.group_protocol || 'consumer' }}
      KAFRUST_MEMBER_EXIT: ${{ inputs.member_exit || 'drop' }}
      KAFRUST_GROUP_CHURN_CYCLES: ${{ inputs.churn_cycles || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Start three-broker Kafka ${{ inputs.kafka_version || '4.3.1' }}
        run: |
          docker network create kafrust-published-group
          cluster_id="$(docker run --rm apache/kafka:${{ inputs.kafka_version || '4.3.1' }} /opt/kafka/bin/kafka-storage.sh random-uuid)"
          consumer_group_config=()
          if [ "$KAFRUST_GROUP_PROTOCOL" = "consumer" ]; then
            consumer_group_config=(
              -e KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS=6000
              -e KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS=6000
              -e KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS=1000
              -e KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS=1000
            )
          fi
          for node in 1 2 3; do
            external_port=$((20091 + node))
            docker run -d --name "kafrust-published-group-${node}" \
              --network kafrust-published-group \
              -p "${external_port}:9092" \
              -e KAFKA_CLUSTER_ID="${cluster_id}" \
              -e KAFKA_NODE_ID="${node}" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 \
              -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafrust-published-group-${node}:29092,EXTERNAL://localhost:${external_port} \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafrust-published-group-1:9093,2@kafrust-published-group-2:9093,3@kafrust-published-group-3:9093 \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
              "${consumer_group_config[@]}" \
              apache/kafka:${{ inputs.kafka_version || '4.3.1' }}
          done

      - name: Wait for Kafka cluster
        run: |
          for attempt in {1..120}; do
            if docker exec kafrust-published-group-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafrust-published-group-1:29092 \
              >/tmp/kafrust-published-group-probe.log 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kafrust-published-group-probe.log || true
          docker logs kafrust-published-group-1
          docker logs kafrust-published-group-2
          docker logs kafrust-published-group-3
          exit 1

      - name: Create replicated topic
        run: |
          docker exec kafrust-published-group-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafrust-published-group-1:29092 \
            --create --if-not-exists --topic "$KAFRUST_TOPIC" --partitions 6 --replication-factor 3

      - name: Create fresh external project
        env:
          KAFRUST_PUBLISHED_VERSION: ${{ inputs.kafrust_version || '0.3.5' }}
        run: |
          project_dir="$RUNNER_TEMP/kafrust-published-group-smoke"
          if [ "$project_dir" = "$GITHUB_WORKSPACE" ]; then
            echo "the published group project must be outside the repository"
            exit 1
          fi
          cargo new --bin "$project_dir"
          cp .github/published-group-rebalance-smoke/src/main.rs "$project_dir/src/main.rs"
          sed "s/__KAFRUST_VERSION__/$KAFRUST_PUBLISHED_VERSION/; s/__KAFRUST_FEATURES__/[]/" \
            .github/published-group-rebalance-smoke/Cargo.toml > "$project_dir/Cargo.toml"

      - name: Run published multi-member rebalance churn
        run: cargo run --manifest-path "$RUNNER_TEMP/kafrust-published-group-smoke/Cargo.toml"

      - name: Verify published dependency versions
        run: |
          grep -A1 -q 'name = "kafrust"' "$RUNNER_TEMP/kafrust-published-group-smoke/Cargo.lock"
          grep -A1 -q "version = \"${{ inputs.kafrust_version || '0.3.5' }}\"" "$RUNNER_TEMP/kafrust-published-group-smoke/Cargo.lock"

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker logs kafrust-published-group-1 || true
          docker logs kafrust-published-group-2 || true
          docker logs kafrust-published-group-3 || true
