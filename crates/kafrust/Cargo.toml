[package]
name = "kafrust"
version = "0.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A pure Rust Kafka client with no librdkafka or C client binding dependency."
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
blocking = ["tokio/rt-multi-thread"]
tls = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
    "dep:zeroize",
]
otlp = [
    "dep:opentelemetry-proto",
    "dep:prost",
    "dep:prost-derive",
]

[dependencies]
base64 = "0.22"
hmac = "0.12"
kafrust-protocol = { version = "0.3.5", path = "../kafrust-protocol" }
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic-messages",
    "metrics",
], optional = true }
pbkdf2 = "0.12"
prost = { version = "=0.14.1", optional = true }
prost-derive = { version = "=0.14.1", optional = true }
rand = "0.8"
regex = "1"
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-platform-verifier = { version = "=0.6.2", optional = true }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
tracing = "0.1"
# Keep TLS dependency resolution on the line verified by the MSRV CI job.
zeroize = { version = ">=1.8.2, <1.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
