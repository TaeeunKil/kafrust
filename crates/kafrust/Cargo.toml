[package]
name = "kafrust"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A pure Rust Kafka client with no librdkafka or C toolchain dependency."
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
tls = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio-rustls",
    "dep:zeroize",
]

[dependencies]
kafrust-protocol = { version = "0.2.1", path = "../kafrust-protocol" }
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-platform-verifier = { version = "=0.6.2", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
tracing = "0.1"
# zeroize 1.9 uses an edition 2024 manifest that Cargo 1.75 cannot parse.
# Keep TLS dependency resolution on the MSRV-compatible line until MSRV moves.
zeroize = { version = ">=1.8.2, <1.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
